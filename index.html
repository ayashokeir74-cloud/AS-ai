<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Sultan AI - مساعد ذكاء اصطناعي متقدم">
<title>Sultan AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b0d10;
  --panel:#11151b;
  --panel2:#171c23;
  --border:#252c35;
  --text:#f5f7fa;
  --muted:#8e98a6;
  --accent:#ffffff;
  --accentText:#0b0d10;
  --user:#1d2630;
  --danger:#ff5c5c;
  --success:#50d890;
  --shadow:0 15px 45px rgba(0,0,0,.35);
}

body.light{
  --bg:#f3f5f7;
  --panel:#ffffff;
  --panel2:#eef1f4;
  --border:#dce1e6;
  --text:#11151a;
  --muted:#68717d;
  --accent:#11151a;
  --accentText:#ffffff;
  --user:#e7ebef;
  --shadow:0 15px 40px rgba(0,0,0,.12);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    Arial,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* APP */

.app{
  width:100%;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:285px;
  height:100%;
  background:var(--panel);
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  transition:.3s;
  z-index:20;
}

.logo{
  padding:24px 20px;
  border-bottom:1px solid var(--border);
}

.logo-title{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo-title span{
  opacity:.45;
}

.logo-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}

.sidebar-content{
  flex:1;
  overflow:auto;
  padding:14px;
}

.section-title{
  font-size:11px;
  color:var(--muted);
  margin:12px 8px 8px;
  text-transform:uppercase;
}

.mode{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:var(--text);
  padding:12px;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:5px;
  text-align:right;
  transition:.2s;
}

.mode:hover{
  background:var(--panel2);
}

.mode.active{
  background:var(--panel2);
  border-color:var(--border);
  box-shadow:inset 3px 0 var(--accent);
}

.mode-icon{
  width:32px;
  height:32px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.06);
  font-size:16px;
}

.mode-info{
  flex:1;
}

.mode-name{
  font-size:13px;
  font-weight:700;
}

.mode-desc{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

.sidebar-bottom{
  padding:14px;
  border-top:1px solid var(--border);
}

.small-btn{
  width:100%;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  border-radius:11px;
  padding:10px;
  margin-top:7px;
  transition:.2s;
}

.small-btn:hover{
  background:var(--panel2);
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* TOPBAR */

.topbar{
  height:68px;
  min-height:68px;
  border-bottom:1px solid var(--border);
  background:rgba(11,13,16,.75);
  backdrop-filter:blur(15px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  z-index:10;
}

body.light .topbar{
  background:rgba(255,255,255,.78);
}

.top-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
  display:none;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}

.status-dot{
  width:8px;
  height:8px;
  background:var(--success);
  border-radius:50%;
  box-shadow:0 0 12px var(--success);
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  scroll-behavior:smooth;
  padding:30px 18px 170px;
}

.chat-inner{
  width:min(950px,100%);
  margin:auto;
}

/* WELCOME */

.welcome{
  min-height:58vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  animation:fadeUp .5s ease;
}

.welcome-logo{
  width:75px;
  height:75px;
  border-radius:23px;
  background:var(--accent);
  color:var(--accentText);
  display:grid;
  place-items:center;
  font-size:27px;
  font-weight:900;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}

.welcome h1{
  font-size:clamp(28px,5vw,48px);
  font-weight:900;
  letter-spacing:-2px;
}

.welcome p{
  color:var(--muted);
  margin-top:10px;
  max-width:600px;
  line-height:1.8;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  width:min(700px,100%);
  margin-top:30px;
}

.quick{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:15px;
  padding:15px;
  text-align:right;
  transition:.2s;
}

.quick:hover{
  transform:translateY(-2px);
  background:var(--panel2);
}

.quick b{
  display:block;
  margin-bottom:5px;
}

.quick span{
  color:var(--muted);
  font-size:11px;
}

/* MESSAGE */

.message{
  display:flex;
  gap:13px;
  margin:20px 0;
  animation:fadeUp .25s ease;
}

.message.user{
  flex-direction:row-reverse;
}

.avatar{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:13px;
  font-weight:800;
}

.message.user .avatar{
  background:var(--accent);
  color:var(--accentText);
}

.bubble-wrap{
  max-width:82%;
}

.bubble{
  padding:14px 16px;
  border-radius:17px;
  background:var(--panel);
  border:1px solid var(--border);
  line-height:1.75;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user .bubble{
  background:var(--user);
}

.message-actions{
  display:flex;
  gap:5px;
  margin-top:6px;
  opacity:.55;
}

.message-actions button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  padding:3px 6px;
}

.message-actions button:hover{
  color:var(--text);
}

/* TYPING */

.typing{
  display:inline-flex;
  gap:4px;
  padding:5px;
}

.typing i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--muted);
  animation:typing 1s infinite;
}

.typing i:nth-child(2){
  animation-delay:.15s;
}

.typing i:nth-child(3){
  animation-delay:.3s;
}

/* INPUT */

.composer-area{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:16px 18px 20px;
  background:
    linear-gradient(
      to top,
      var(--bg) 70%,
      transparent
    );
}

.composer{
  width:min(950px,100%);
  margin:auto;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.attachments{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:9px 12px 0;
}

.file-chip{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:9px;
  padding:6px 9px;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:6px;
}

.file-chip button{
  border:0;
  background:none;
  color:var(--muted);
}

textarea{
  width:100%;
  min-height:58px;
  max-height:180px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:16px;
  line-height:1.6;
}

textarea::placeholder{
  color:var(--muted);
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 10px 10px;
}

.composer-left,
.composer-right{
  display:flex;
  align-items:center;
  gap:6px;
}

.tool-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  border-radius:10px;
}

.send-btn{
  width:42px;
  height:42px;
  border:0;
  background:var(--accent);
  color:var(--accentText);
  border-radius:12px;
  font-weight:900;
  transition:.2s;
}

.send-btn:hover{
  transform:scale(1.04);
}

.send-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* MODE BADGE */

.current-mode{
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:9px;
  color:var(--muted);
  padding:6px 9px;
  font-size:10px;
}

/* OVERLAY */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:15;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%) translateY(20px);
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 17px;
  border-radius:12px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ANIMATIONS */

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes typing{
  0%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  50%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* RESPONSIVE */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    right:-300px;
    top:0;
    bottom:0;
    box-shadow:var(--shadow);
  }

  .sidebar.open{
    right:0;
  }

  .overlay.show{
    display:block;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 12px;
  }

  .chat{
    padding:20px 10px 160px;
  }

  .bubble-wrap{
    max-width:88%;
  }

  .quick-grid{
    grid-template-columns:1fr;
  }

  .welcome{
    min-height:55vh;
  }

}

@media(max-width:480px){

  .status{
    display:none;
  }

  .top-actions .icon-btn:nth-child(1){
    display:none;
  }

  .composer-area{
    padding:10px 8px 12px;
  }

  .bubble{
    font-size:14px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <div class="logo-title">
        Sultan <span>AI</span>
      </div>
      <div class="logo-sub">
        مساعد ذكاء اصطناعي متقدم
      </div>
    </div>

    <div class="sidebar-content">

      <div class="section-title">
        أوضاع الذكاء
      </div>

      <button class="mode active" data-mode="smart">
        <div class="mode-icon">🧠</div>
        <div class="mode-info">
          <div class="mode-name">Smart</div>
          <div class="mode-desc">إجابة ذكية ومتوازنة</div>
        </div>
      </button>

      <button class="mode" data-mode="fast">
        <div class="mode-icon">⚡</div>
        <div class="mode-info">
          <div class="mode-name">Fast</div>
          <div class="mode-desc">إجابة سريعة</div>
        </div>
      </button>

      <button class="mode" data-mode="deep">
        <div class="mode-icon">🔬</div>
        <div class="mode-info">
          <div class="mode-name">Deep</div>
          <div class="mode-desc">تحليل أعمق</div>
        </div>
      </button>

      <button class="mode" data-mode="code">
        <div class="mode-icon">💻</div>
        <div class="mode-info">
          <div class="mode-name">Code</div>
          <div class="mode-desc">برمجة ومساعدة تقنية</div>
        </div>
      </button>

      <button class="mode" data-mode="web">
        <div class="mode-icon">🌐</div>
        <div class="mode-info">
          <div class="mode-name">Web</div>
          <div class="mode-desc">بحث ومعلومات حديثة</div>
        </div>
      </button>

      <button class="mode" data-mode="vision">
        <div class="mode-icon">👁️</div>
        <div class="mode-info">
          <div class="mode-name">Vision</div>
          <div class="mode-desc">تحليل الصور</div>
        </div>
      </button>

      <button class="mode" data-mode="files">
        <div class="mode-icon">📁</div>
        <div class="mode-info">
          <div class="mode-name">Files</div>
          <div class="mode-desc">تحليل الملفات</div>
        </div>
      </button>

    </div>

    <div class="sidebar-bottom">
      <button class="small-btn" id="newChat">
        ＋ محادثة جديدة
      </button>

      <button class="small-btn" id="clearChat">
        🗑️ مسح المحادثة
      </button>
    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          class="menu-btn"
          id="menuBtn"
          aria-label="فتح القائمة"
        >
          ☰
        </button>

        <div class="status">
          <span class="status-dot"></span>
          <span id="statusText">
            Sultan AI Online
          </span>
        </div>

      </div>

      <div class="top-actions">

        <button
          class="icon-btn"
          id="themeBtn"
          title="الوضع الليلي/الفاتح"
        >
          ☀️
        </button>

      </div>

    </header>

    <!-- CHAT -->
    <section class="chat" id="chat">

      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">
            SA
          </div>

          <h1>
            Sultan AI
          </h1>

          <p>
            مساعدك الذكي للبرمجة، التحليل، البحث،
            الصور والملفات.
          </p>

          <div class="quick-grid">

            <button class="quick"
              data-prompt="اشرح لي كيف يعمل الذكاء الاصطناعي بطريقة بسيطة">
              <b>🧠 تعلّم</b>
              <span>اشرح لي موضوعاً بطريقة سهلة</span>
            </button>

            <button class="quick"
              data-prompt="ساعدني في كتابة كود HTML احترافي">
              <b>💻 برمجة</b>
              <span>ساعدني في مشروع برمجي</span>
            </button>

            <button class="quick"
              data-prompt="حلل هذا السؤال وأعطني أفضل إجابة">
              <b>🔬 تحليل</b>
              <span>حلّل سؤالاً أو مشكلة</span>
            </button>

            <button class="quick"
              data-prompt="أعطني فكرة مشروع ذكاء اصطناعي مميزة">
              <b>💡 أفكار</b>
              <span>ابتكر فكرة جديدة</span>
            </button>

          </div>

        </div>

      </div>

    </section>

    <!-- COMPOSER -->
    <div class="composer-area">

      <div class="composer">

        <div
          class="attachments"
          id="attachments"
        ></div>

        <textarea
          id="messageInput"
          placeholder="اكتب رسالتك إلى Sultan AI..."
          rows="1"
          autocomplete="off"
        ></textarea>

        <div class="composer-bottom">

          <div class="composer-left">

            <button
              class="tool-btn"
              id="fileBtn"
              title="إرفاق ملف"
            >
              📎
            </button>

            <input
              type="file"
              id="fileInput"
              hidden
              multiple
            >

            <span
              class="current-mode"
              id="currentMode"
            >
              Smart
            </span>

          </div>

          <div class="composer-right">

            <button
              class="send-btn"
              id="sendBtn"
              title="إرسال"
            >
              ↑
            </button>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SULTAN AI FRONTEND
========================================================= */

const STREAM_API = "/api/chat/stream";
const NORMAL_API = "/api/chat";
const HEALTH_API = "/api/health";

let messages = [];

let currentMode = "smart";

let selectedFiles = [];

let isGenerating = false;

let currentAssistantBubble = null;

/* =========================================================
   ELEMENTS
========================================================= */

const chat =
  document.getElementById("chat");

const chatInner =
  document.getElementById("chatInner");

const welcome =
  document.getElementById("welcome");

const input =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const fileBtn =
  document.getElementById("fileBtn");

const fileInput =
  document.getElementById("fileInput");

const attachments =
  document.getElementById("attachments");

const currentModeEl =
  document.getElementById("currentMode");

const toast =
  document.getElementById("toast");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const menuBtn =
  document.getElementById("menuBtn");

const themeBtn =
  document.getElementById("themeBtn");

const statusText =
  document.getElementById("statusText");

/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {
        toast.classList.remove(
          "show"
        );
      },
      2600
    );

}

/* =========================================================
   THEME
========================================================= */

const savedTheme =
  localStorage.getItem(
    "sultan-theme"
  );

if(
  savedTheme === "light"
){
  document.body.classList.add(
    "light"
  );

  themeBtn.textContent =
    "🌙";
}

themeBtn.addEventListener(
  "click",
  () => {

    document.body.classList.toggle(
      "light"
    );

    const light =
      document.body.classList.contains(
        "light"
      );

    localStorage.setItem(
      "sultan-theme",
      light
        ? "light"
        : "dark"
    );

    themeBtn.textContent =
      light
        ? "🌙"
        : "☀️";

  }
);

/* =========================================================
   SIDEBAR MOBILE
========================================================= */

function closeSidebar(){

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

}

menuBtn.addEventListener(
  "click",
  () => {

    sidebar.classList.add(
      "open"
    );

    overlay.classList.add(
      "show"
    );

  }
);

overlay.addEventListener(
  "click",
  closeSidebar
);

/* =========================================================
   MODES
========================================================= */

document
  .querySelectorAll(".mode")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".mode"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          currentMode =
            button.dataset.mode;

          currentModeEl.textContent =
            button
              .querySelector(
                ".mode-name"
              )
              .textContent;

          closeSidebar();

        }
      );

    }
  );

/* =========================================================
   INPUT
========================================================= */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        180
      ) + "px";

  }
);

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      generateResponse();

    }

  }
);

/* =========================================================
   FILES
========================================================= */

fileBtn.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);

fileInput.addEventListener(
  "change",
  () => {

    const incoming =
      Array.from(
        fileInput.files || []
      );

    for(
      const file of incoming
    ){

      if(
        selectedFiles.length >= 5
      ){

        showToast(
          "الحد الأقصى 5 ملفات."
        );

        break;

      }

      if(
        file.size >
        20 * 1024 * 1024
      ){

        showToast(
          `${file.name} أكبر من 20MB`
        );

        continue;

      }

      selectedFiles.push(
        file
      );

    }

    renderFiles();

    fileInput.value = "";

  }
);

function renderFiles(){

  attachments.innerHTML =
    "";

  selectedFiles.forEach(
    (file,index) => {

      const chip =
        document.createElement(
          "div"
        );

      chip.className =
        "file-chip";

      chip.innerHTML =
        `
        <span>📄 ${escapeHtml(
          file.name
        )}</span>
        <button
          type="button"
          data-index="${index}"
        >×</button>
        `;

      chip
        .querySelector(
          "button"
        )
        .addEventListener(
          "click",
          () => {

            selectedFiles.splice(
              index,
              1
            );

            renderFiles();

          }
        );

      attachments.appendChild(
        chip
      );

    }
  );

}

function escapeHtml(text){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

/* =========================================================
   FILE DATA
========================================================= */

function fileToDataURL(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () =>
          resolve(
            reader.result
          );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

async function prepareFiles(){

  const result = [];

  for(
    const file of selectedFiles
  ){

    try{

      const data =
        await fileToDataURL(
          file
        );

      result.push({

        name:
          file.name,

        type:
          file.type ||
          "application/octet-stream",

        size:
          file.size,

        data

      });

    }catch{

      showToast(
        `تعذر قراءة ${file.name}`
      );

    }

  }

  return result;

}

/* =========================================================
   PAYLOAD
========================================================= */

async function buildPayload(
  userText = ""
){

  const files =
    await prepareFiles();

  const cleanText =
    String(
      userText || ""
    ).trim();

  return {

    message:
      cleanText,

    messages:
      messages.slice(
        -12
      ),

    files,

    fastMode:
      currentMode === "fast",

    mode:
      currentMode

  };

}

function editMessage(

){

  const index =

    Array.from(
      chatInner.querySelectorAll(

  if(
    userIndex < 0 ||

    messages.find(

  input.value =

/* =========================================================
   STREAM PARSER
========================================================= */

function parseSSEEvent(
  raw
){

  const lines =
    raw
      .replace(/\r/g,"")
      .split("\n");

  let event =
    "message";

  const dataLines =
    [];

  for(
    const line of lines
  ){

    if(
      line.startsWith(
        "event:"
      )
    ){

      event =
        line
          .slice(6)
          .trim();

    }

    if(
      line.startsWith(
        "data:"
      )
    ){

      dataLines.push(
        line.slice(5).trim()
      );

    }

  }

  if(
    !dataLines.length
  ){

    return null;

  }

  const rawData =
    dataLines.join("\n");

  if(
    rawData === "[DONE]"
  ){

    return {
      event,
      data:
        "[DONE]"
    };

  }

  let data =
    rawData;

  try{

    data =
      JSON.parse(
        rawData
      );

  }catch{

    /* plain text */

  }

  return {
    event,
    data
  };

}

/* =========================================================
   STREAM REQUEST
========================================================= */

async function streamRequest(
  payload,
  assistantBubble,
  typingElement
){

  const response =
    await fetch(
      STREAM_API,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify(
            payload
          )
      }
    );

  if(
    !response.ok
  ){

    let message =
      `HTTP ${response.status}`;

    try{

      const error =
        await response.json();

      message =
        error.error ||
        message;

    }catch{}

    throw new Error(
      message
    );

  }

  if(
    !response.body
  ){

    throw new Error(
      "Streaming غير متاح."
    );

  }

  const reader =
    response.body.getReader();

  const decoder =
    new TextDecoder();

  let buffer =
    "";

  let fullReply =
    "";

  while(true){

    const {
      value,
      done
    } =
      await reader.read();

    if(
      done
    ){

      break;

    }

    buffer +=
      decoder.decode(
        value,
        {
          stream:true
        }
      );

    buffer =
      buffer.replace(
        /\r\n/g,
        "\n"
      );

    let separator;

    while(
      (separator =
        buffer.indexOf(
          "\n\n"
        )) !== -1
    ){

      const raw =
        buffer.slice(
          0,
          separator
        );

      buffer =
        buffer.slice(
          separator + 2
        );

      const parsed =
        parseSSEEvent(
          raw
        );

      if(
        !parsed
      ){

        continue;

      }

      const data =
        parsed.data;

      if(
        parsed.event ===
        "token"
      ){

        const text =
          typeof data === "string"
            ? data
            : data?.text ||
              data?.token ||
              data?.content ||
              "";

        if(text){

          fullReply +=
            text;

          assistantBubble.textContent =
            fullReply;

          scrollBottom();

        }

      }

      if(
        parsed.event ===
        "done"
      ){

        if(
          data?.reply &&
          !fullReply
        ){

          fullReply =
            String(
              data.reply
            );

          assistantBubble.textContent =
            fullReply;

        }

      }

      if(
        parsed.event ===
        "error"
      ){

        throw new Error(
          data?.error ||
          "حدث خطأ أثناء البث."
        );

      }

      if(
        parsed.event ===
        "status"
      ){

        statusText.textContent =
          data?.text ||
          "Sultan AI يعمل...";

      }

    }

  }

  return fullReply.trim();

}

/* =========================================================
   NORMAL REQUEST
========================================================= */

async function normalRequest(
  payload
){

  const response =
    await fetch(
      NORMAL_API,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify(
            payload
          )
      }
    );

  let data = {};

  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "الخادم لم يرجع JSON صالح."
    );

  }

  if(
    !response.ok ||
    !data.success
  ){

    throw new Error(
      data.error ||
      `HTTP ${response.status}`
    );

  }

  return String(
    data.reply || ""
  ).trim();

}

/* =========================================================
   GENERATE
========================================================= */

async function generateResponse(
  forcedText = null
){

  if(
    isGenerating
  ){

    return;

  }

  const userText =
    forcedText !== null
      ? String(
          forcedText
        ).trim()
      : input.value.trim();

  if(
    !userText &&
    !selectedFiles.length
  ){

    showToast(
      "اكتب رسالة أو أرفق ملفاً."
    );

    return;

  }

  isGenerating =
    true;

  sendBtn.disabled =
    true;

  if(
    welcome
  ){

    welcome.remove();

  }

  const finalText =
    userText ||
    "حلل الملفات المرفقة وقدم نتيجة مفيدة.";

  messages.push({
    role:"user",
    content:
      finalText
  });

  addMessage(
    "user",
    finalText
  );

  if(
    forcedText === null
  ){

    input.value =
      "";

    input.style.height =
      "auto";

  }

  const typing =
    createTyping();

  const assistantBubble =
    typing.querySelector(
      ".bubble"
    );

  assistantBubble.innerHTML =
    "";

  currentAssistantBubble =
    assistantBubble;

  const payload =
    await buildPayload(
      finalText
    );

  /*
    بعد بناء الـpayload،
    نفضّي الملفات من الواجهة.
  */

  selectedFiles =
    [];

  renderFiles();

  statusText.textContent =
    "Sultan AI يعمل...";

  let reply = "";

  try{

    reply =
      await streamRequest(
        payload,
        assistantBubble,
        typing
      );

  }catch(
    streamError
  ){

    console.warn(
      "Streaming failed:",
      streamError
    );

    assistantBubble.textContent =
      "";

    try{

      reply =
        await normalRequest(
          payload
        );

      assistantBubble.textContent =
        reply;

    }catch(
      normalError
    ){

      typing.remove();

      messages.pop();

      showToast(
        normalError.message ||
        "حدث خطأ أثناء الاتصال."
      );

      statusText.textContent =
        "Sultan AI Offline";

      isGenerating =
        false;

      sendBtn.disabled =
        false;

      return;

    }

  }

  typing.classList.remove(
    "typing-message"
  );

  if(
    !reply
  ){

    typing.remove();

    messages.pop();

    showToast(
      "لم تصل إجابة من Sultan AI."
    );

    statusText.textContent =
      "Sultan AI Online";

    isGenerating =
      false;

    sendBtn.disabled =
      false;

    return;

  }

  messages.push({
    role:"assistant",
    content:
      reply
  });

  assistantBubble.textContent =
    reply;

  statusText.textContent =
    "Sultan AI Online";

  isGenerating =
    false;

  sendBtn.disabled =
    false;

  scrollBottom();

}
