<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Sultan AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent!important;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  background:#08090b;
  color:#f5f5f5;
  font-family:Arial,"Segoe UI",sans-serif;
}

body{
  overflow:hidden;
}

button,
textarea,
input{
  font:inherit;
}

button{
  border:0;
  outline:0;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  -webkit-tap-highlight-color:transparent!important;
  -webkit-touch-callout:none;
  user-select:none;
  touch-action:manipulation;
}

button:focus,
button:focus-visible{
  outline:none!important;
  box-shadow:none!important;
}

button:active{
  outline:none!important;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:270px;
  height:100dvh;
  flex-shrink:0;
  background:#0d0f12;
  border-left:1px solid #202329;
  display:flex;
  flex-direction:column;
  padding:16px;
  z-index:50;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  padding:6px 4px 18px;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,#ff9d00,#ff5a00);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 25px rgba(255,115,0,.18);
}

.logo-icon svg{
  width:27px;
  height:27px;
}

.logo-text{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo-text span{
  color:#ff8a00;
}

.new-chat{
  width:100%;
  min-height:48px;
  border-radius:13px;
  background:#ff7900;
  color:#fff;
  font-weight:800;
  margin-bottom:18px;
  transition:.15s;
}

.new-chat:active{
  transform:scale(.97);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav-btn{
  width:100%;
  min-height:46px;
  padding:0 14px;
  border-radius:11px;
  background:transparent;
  color:#aeb3bb;
  text-align:right;
  display:flex;
  align-items:center;
  gap:12px;
  transition:background .15s,color .15s;
}

.nav-btn:hover{
  background:#171a1f;
  color:#fff;
}

.nav-btn.active{
  background:#1b1d21;
  color:#fff;
}

.nav-icon{
  width:22px;
  text-align:center;
  font-size:18px;
}

.sidebar-bottom{
  margin-top:auto;
  color:#666c75;
  font-size:12px;
  text-align:center;
  padding-top:15px;
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-width:0;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:62px;
  min-height:62px;
  border-bottom:1px solid #202329;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:rgba(8,9,11,.94);
  backdrop-filter:blur(15px);
  z-index:20;
}

.mobile-menu{
  display:none;
  width:42px;
  height:42px;
  border-radius:11px;
  background:#15171b;
  color:#fff;
  font-size:22px;
  margin-left:10px;
}

.top-title{
  font-weight:800;
  font-size:15px;
}

.status{
  margin-right:auto;
  display:flex;
  align-items:center;
  gap:7px;
  color:#747a83;
  font-size:12px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#29d17d;
  box-shadow:0 0 10px rgba(41,209,125,.5);
}

.content{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}

.chat{
  height:100%;
  overflow-y:auto;
  padding:28px max(18px,calc((100% - 920px)/2));
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

.chat::-webkit-scrollbar{
  width:6px;
}

.chat::-webkit-scrollbar-thumb{
  background:#292d34;
  border-radius:10px;
}

/* ================= WELCOME ================= */

.welcome{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 0 150px;
}

.welcome-inner{
  width:100%;
  max-width:760px;
  text-align:center;
}

.hero-logo{
  width:74px;
  height:74px;
  border-radius:22px;
  margin:0 auto 20px;
  background:linear-gradient(135deg,#ffae00,#ff5b00);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 45px rgba(255,105,0,.2);
}

.hero-logo svg{
  width:48px;
  height:48px;
}

.welcome h1{
  margin:0;
  font-size:34px;
  letter-spacing:-1px;
}

.welcome h1 span{
  color:#ff8500;
}

.welcome p{
  margin:12px 0 30px;
  color:#858b94;
  font-size:15px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  text-align:right;
}

.quick{
  min-height:76px;
  padding:14px;
  border:1px solid #252930;
  border-radius:15px;
  background:#111317;
  color:#fff;
  text-align:right;
  transition:background .15s,border-color .15s,transform .15s;
}

.quick:hover{
  background:#17191e;
  border-color:#383c44;
}

.quick:active{
  transform:scale(.98);
}

.quick strong{
  display:block;
  font-size:14px;
  margin-bottom:7px;
}

.quick span{
  color:#747b85;
  font-size:12px;
}

/* ================= MESSAGES ================= */

.message{
  width:100%;
  margin:0 auto 24px;
  animation:messageIn .18s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  display:flex;
  justify-content:flex-start;
}

.message.user .bubble{
  max-width:min(80%,700px);
  background:#ff7900;
  color:#fff;
  padding:12px 15px;
  border-radius:17px 17px 4px 17px;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.assistant{
  display:block;
}

.assistant-wrap{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:11px;
  background:linear-gradient(135deg,#ff9f00,#ff5b00);
  display:flex;
  align-items:center;
  justify-content:center;
}

.avatar svg{
  width:22px;
  height:22px;
}

.assistant-content{
  min-width:0;
  flex:1;
}

.assistant-name{
  font-size:12px;
  color:#ff8b00;
  font-weight:800;
  margin:3px 0 7px;
}

.assistant-text{
  color:#e9eaec;
  line-height:1.75;
  font-size:15px;
  overflow-wrap:anywhere;
}

.assistant-text p{
  margin:0 0 12px;
}

.assistant-text p:last-child{
  margin-bottom:0;
}

.assistant-text code{
  background:#171a1f;
  border:1px solid #292d34;
  border-radius:6px;
  padding:2px 5px;
  direction:ltr;
  unicode-bidi:embed;
}

.assistant-text a{
  color:#ff9300;
  text-decoration:none;
}

.code-wrap{
  margin:14px 0;
  border:1px solid #292d34;
  border-radius:12px;
  overflow:hidden;
  background:#0a0c0f;
  direction:ltr;
}

.code-head{
  height:38px;
  padding:0 10px;
  background:#12151a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#777e88;
  font-size:11px;
}

.copy-code{
  background:#20242a;
  color:#ddd;
  padding:6px 10px;
  border-radius:7px;
  font-size:11px;
}

.code-content{
  padding:13px;
  overflow:auto;
  white-space:pre;
  font-family:monospace;
  font-size:12px;
  line-height:1.6;
}

.message-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.action-btn{
  width:34px;
  height:32px;
  border-radius:9px;
  background:#15181d;
  color:#9298a1;
  font-size:14px;
}

.action-btn:active{
  transform:scale(.94);
}

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:7px 0;
}

.typing i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff8100;
  animation:typing 1s infinite;
}

.typing i:nth-child(2){
  animation-delay:.15s;
}

.typing i:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  30%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* ================= COMPOSER ================= */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:15px max(18px,calc((100% - 920px)/2)) 18px;
  background:linear-gradient(transparent,#08090b 25%);
  pointer-events:none;
}

.composer{
  pointer-events:auto;
  border:1px solid #292d34;
  background:#111317;
  border-radius:18px;
  padding:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.composer-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.message-input{
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:12px 9px;
  line-height:1.5;
}

.message-input::placeholder{
  color:#686e77;
}

.attach-btn,
.send-btn{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.attach-btn{
  background:#1b1e23;
  color:#b9bec6;
  font-size:20px;
}

.send-btn{
  background:#ff7900;
  color:#fff;
  font-size:19px;
}

.send-btn.stop{
  background:#d74a32;
}

.attach-btn:active,
.send-btn:active{
  transform:scale(.94);
}

.composer-bottom{
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 5px 1px;
}

.fast-toggle{
  min-height:30px;
  padding:0 11px;
  border-radius:9px;
  background:#171a1f;
  color:#858b94;
  font-size:11px;
}

.fast-toggle.active{
  background:rgba(255,121,0,.14);
  color:#ff9300;
}

.file-list{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:7px;
}

.file-chip{
  display:flex;
  align-items:center;
  gap:6px;
  background:#1a1d22;
  border:1px solid #292d34;
  border-radius:9px;
  padding:7px 9px;
  font-size:11px;
  color:#c6cad0;
  white-space:nowrap;
}

.file-remove{
  width:20px;
  height:20px;
  border-radius:6px;
  background:#2b2f36;
  color:#aaa;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:100;
  background:#20242a;
  color:#fff;
  border:1px solid #353a42;
  border-radius:11px;
  padding:10px 15px;
  font-size:12px;
  transition:.2s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= OVERLAY ================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:40;
}

.overlay.show{
  display:block;
}

/* ================= MOBILE ================= */

@media(max-width:760px){

  .sidebar{
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    transform:translateX(105%);
    transition:transform .22s ease;
    z-index:60;
    box-shadow:-15px 0 45px rgba(0,0,0,.45);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 10px;
  }

  .status{
    display:none;
  }

  .chat{
    padding:20px 13px 150px;
  }

  .welcome{
    padding:15px 0 100px;
  }

  .welcome h1{
    font-size:28px;
  }

  .quick-grid{
    grid-template-columns:1fr;
  }

  .message.user .bubble{
    max-width:90%;
  }

  .composer-area{
    padding:10px 9px 10px;
  }

  .composer{
    border-radius:16px;
  }
}

@media(max-width:420px){

  .logo-text{
    font-size:19px;
  }

  .welcome h1{
    font-size:25px;
  }

  .welcome p{
    font-size:13px;
  }

  .assistant-text{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M24 24h52v38H24z"
                stroke="white"
                stroke-width="8"
                rx="10"/>
          <path d="M36 76h28M50 62v14"
                stroke="white"
                stroke-width="8"
                stroke-linecap="round"/>
          <path d="M38 40h24M38 50h15"
                stroke="white"
                stroke-width="6"
                stroke-linecap="round"/>
        </svg>
      </div>

      <div class="logo-text">
        Sultan <span>AI</span>
      </div>
    </div>

    <button type="button"
            class="new-chat"
            id="newChat">
      + محادثة جديدة
    </button>

    <nav class="nav">

      <button type="button"
              class="nav-btn active"
              data-mode="chat">
        <span class="nav-icon">💬</span>
        <span>المحادثة</span>
      </button>

      <button type="button"
              class="nav-btn"
              data-mode="files">
        <span class="nav-icon">📁</span>
        <span>الملفات</span>
      </button>

      <button type="button"
              class="nav-btn"
              data-mode="fast">
        <span class="nav-icon">⚡</span>
        <span>الوضع السريع</span>
      </button>

      <button type="button"
              class="nav-btn"
              data-mode="web">
        <span class="nav-icon">🌐</span>
        <span>البحث والويب</span>
      </button>

      <button type="button"
              class="nav-btn"
              data-mode="code">
        <span class="nav-icon">💻</span>
        <span>البرمجة</span>
      </button>

      <button type="button"
              class="nav-btn"
              data-mode="analysis">
        <span class="nav-icon">🧠</span>
        <span>التحليل</span>
      </button>

    </nav>

    <div class="sidebar-bottom">
      Sultan AI V7.2
    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button
        type="button"
        class="mobile-menu"
        id="mobileMenu"
        aria-label="فتح القائمة"
        aria-expanded="false"
      >☰</button>

      <div class="top-title">
        Sultan AI
      </div>

      <div class="status">
        <span class="status-dot"></span>
        متصل
      </div>

    </header>

    <div class="content">

      <section class="chat" id="chat">

        <div class="welcome" id="welcome">

          <div class="welcome-inner">

            <div class="hero-logo">

              <svg viewBox="0 0 100 100" fill="none">

                <path d="M24 24h52v38H24z"
                      stroke="white"
                      stroke-width="8"
                      rx="10"/>

                <path d="M36 76h28M50 62v14"
                      stroke="white"
                      stroke-width="8"
                      stroke-linecap="round"/>

                <path d="M38 40h24M38 50h15"
                      stroke="white"
                      stroke-width="6"
                      stroke-linecap="round"/>

              </svg>

            </div>

            <h1>
              أهلاً بك في <span>Sultan AI</span>
            </h1>

            <p>
              مساعدك الذكي للمحادثة، البرمجة، تحليل الملفات والبحث.
            </p>

            <div class="quick-grid">

              <button
                type="button"
                class="quick"
                data-prompt="اشرح لي كيف يعمل الذكاء الاصطناعي بطريقة سهلة ومفهومة"
              >
                <strong>🧠 تعلّم شيئاً جديداً</strong>
                <span>شرح مبسط لأي موضوع</span>
              </button>

              <button
                type="button"
                class="quick"
                data-prompt="اكتب لي مثالاً برمجياً واشرح لي كيف يعمل خطوة بخطوة"
              >
                <strong>💻 ساعدني بالبرمجة</strong>
                <span>اكتب وفسّر الكود</span>
              </button>

              <button
                type="button"
                class="quick"
                data-prompt="حلل هذه الفكرة واقترح أفضل طريقة لتنفيذها"
              >
                <strong>🔎 حلّل فكرة</strong>
                <span>تحليل واقتراحات عملية</span>
              </button>

              <button
                type="button"
                class="quick"
                data-prompt="ما هي أهم التقنيات الجديدة في الذكاء الاصطناعي حالياً؟"
              >
                <strong>🌐 ابحث عن المعلومات</strong>
                <span>معلومات حديثة عند الحاجة</span>
              </button>

            </div>

          </div>

        </div>

      </section>

      <!-- COMPOSER -->
      <div class="composer-area">

        <div class="composer">

          <div class="file-list"
               id="fileList"></div>

          <div class="composer-row">

            <button
              type="button"
              class="attach-btn"
              id="attachButton"
              aria-label="إرفاق ملف"
              title="إرفاق ملف"
            >📎</button>

            <textarea
              id="messageInput"
              class="message-input"
              rows="1"
              placeholder="اكتب رسالتك هنا..."
              autocomplete="off"
              spellcheck="true"
            ></textarea>

            <button
              type="button"
              class="send-btn"
              id="sendButton"
              aria-label="إرسال"
              title="إرسال"
            >➤</button>

          </div>

          <div class="composer-bottom">

            <button
              type="button"
              class="fast-toggle"
              id="fastToggle"
              aria-pressed="false"
            >
              ⚡ الوضع السريع
            </button>

            <input
              type="file"
              id="fileInput"
              hidden
              multiple
              accept="*/*"
            >

          </div>

        </div>

      </div>

    </div>

  </main>

</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_ENDPOINT = "/api/chat";

const MAX_HISTORY = 24;
const MAX_FILES = 5;
const MAX_FILE_SIZE = 20 * 1024 * 1024;
const MAX_TOTAL_FILE_BYTES = 45 * 1024 * 1024;
const REQUEST_TIMEOUT = 180000;


/* =========================================================
   STATE
========================================================= */

let conversation = [];
let selectedFiles = [];
let sending = false;
let abortController = null;
let fastMode = false;

let lastUserText = "";
let lastRequestFiles = [];

let toastTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const mobileMenu = document.getElementById("mobileMenu");

const newChatButton = document.getElementById("newChat");

const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

const attachButton = document.getElementById("attachButton");
const fileInput = document.getElementById("fileInput");
const fileList = document.getElementById("fileList");

const fastToggle = document.getElementById("fastToggle");
const toast = document.getElementById("toast");


/* =========================================================
   ERROR HANDLING
========================================================= */

window.addEventListener("error", function(event){

  console.error(
    "Sultan AI error:",
    event.error || event.message
  );

});

window.addEventListener("unhandledrejection", function(event){

  console.error(
    "Sultan AI promise error:",
    event.reason
  );

});


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

  if(!toast) return;

  clearTimeout(toastTimer);

  toast.textContent = message;

  toast.classList.add("show");

  toastTimer = setTimeout(function(){

    toast.classList.remove("show");

  },2600);

}


/* =========================================================
   SIDEBAR
========================================================= */

function openSidebar(){

  if(!sidebar || !overlay) return;

  sidebar.classList.add("open");
  overlay.classList.add("show");

  if(mobileMenu){

    mobileMenu.setAttribute(

function addFiles(files){

  if(!files.length) return;

  for(const file of files){

    if(selectedFiles.length >= MAX_FILES){

      showToast(
        `الحد الأقصى ${MAX_FILES} ملفات.`
      );

      break;

    }

    if(file.size > MAX_FILE_SIZE){

      showToast(
        `الملف ${file.name} أكبر من 20MB.`
      );

      continue;

    }

    const total =
      selectedFiles.reduce(
        function(sum,item){

          return sum + item.size;

        },
        0
      ) + file.size;

    if(total > MAX_TOTAL_FILE_BYTES){

      showToast(
        "تجاوز الحجم الإجمالي المسموح للملفات."
      );

      continue;

    }

    const duplicate =
      selectedFiles.some(
        function(item){

          return (
            item.name === file.name &&
            item.size === file.size &&
            item.lastModified === file.lastModified
          );

        }
      );

    if(duplicate) continue;

    selectedFiles.push(file);

  }

  renderSelectedFiles();

}


function renderSelectedFiles(){

  fileList.innerHTML = "";

  selectedFiles.forEach(
    function(file,index){

      const chip =
        document.createElement("div");

            index,
            1
          );

          renderSelectedFiles();

        },
        false
      );

      chip.appendChild(name);

      chip.appendChild(remove);

      fileList.appendChild(chip);

    }
  );

}


/* =========================================================
   FILE READER
========================================================= */

function readFile(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload = function(){

        resolve({

          name:file.name,

          type:
            file.type ||
            "application/octet-stream",

          size:file.size,

          data:reader.result

        });

      };

      reader.onerror = function(){

        reject(
          new Error(
            "تعذر قراءة الملف."
          )
        );

      };

      reader.readAsDataURL(file);

    }
  );

}


async function prepareFiles(files){

  const output = [];

  for(const file of files){

    try{

      output.push(
        await readFile(file)
      );

    }catch(error){

      console.error(error);

      showToast(
        `تعذر قراءة ${file.name}`
      );

    }

  }

  return output;

}


/* =========================================================
   MARKDOWN
========================================================= */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function inlineMarkdown(text){

  let result =
    escapeHTML(text);

  result =
    result.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );

  result =
    result.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

  result =
    result.replace(
      /\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

  return result;

}


function renderMarkdown(text){

  if(!text) return "";

  const blocks = [];

  let source = String(text);

  source =
    source.replace(
      /```([\w-]*)\n?([\s\S]*?)```/g,
      function(_,language,code){

        const id =
          "code_" +
          Math.random()
            .toString(36)
            .slice(2);

        blocks.push({

          id,

          language:
            language || "code",

          code

        });

        return `___CODE_BLOCK_${blocks.length - 1}___`;

      }
    );

  const lines =
    source.split("\n");

  let html = "";

  let paragraph = [];


  function flushParagraph(){

    if(!paragraph.length) return;

    html +=
      "<p>" +
      paragraph
        .map(inlineMarkdown)
        .join("<br>") +
      "</p>";

    paragraph = [];

  }


  for(const line of lines){

    const trimmed =
      line.trim();

    if(!trimmed){

      flushParagraph();

      continue;

    }


    if(/^#{1,3}\s/.test(trimmed)){

      flushParagraph();

      const match =
        trimmed.match(
          /^(#{1,3})\s+(.*)$/
        );

      const level =
        match[1].length;

      html +=
        `<h${level + 2}>${inlineMarkdown(match[2])}</h${level + 2}>`;

      continue;

    }


    if(/^[*-]\s+/.test(trimmed)){

      flushParagraph();

      html +=
        `<div>• ${inlineMarkdown(
          trimmed.replace(
            /^[*-]\s+/,
            ""
          )
        )}</div>`;

      continue;

    }

    paragraph.push(line);

  }


  flushParagraph();


  blocks.forEach(
    function(block,index){

      const codeHTML =
        escapeHTML(block.code);

      const blockHTML = `
        <div class="code-wrap">

          <div class="code-head">

            <span>
              ${escapeHTML(block.language)}
            </span>

            <button
              type="button"
              class="copy-code"
              data-copy-code="${block.id}"
            >
              نسخ
            </button>

          </div>

          <pre
            class="code-content"
            id="${block.id}"
          >${codeHTML}</pre>

        </div>
      `;

      html =
        html.replace(
          `___CODE_BLOCK_${index}___`,
          blockHTML
        );

    }
  );


  return html;

}

/* =========================================================
   COPY
========================================================= */

async function copyText(text){

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(
      text
    );

    return;

  }


  const textarea =
    document.createElement(
      "textarea"
    );

  textarea.value = text;

  textarea.style.position =
    "fixed";

  textarea.style.opacity =
    "0";

  document.body.appendChild(
    textarea
  );

  textarea.focus();

  textarea.select();

  const success =
    document.execCommand("copy");

  textarea.remove();

  if(!success){

    throw new Error(
      "Copy failed"
    );

  }

}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(
  customText = null,
  isRegenerate = false
){

  if(sending) return;


  const text =
    customText !== null
      ? String(customText).trim()
      : messageInput.value.trim();


  if(!text){

    showToast(
      "اكتب رسالة أولاً."
    );

    messageInput.focus();

    return;

  }


  lastUserText = text;


  let filesForRequest = [];


  if(!isRegenerate){

    filesForRequest =
      [...selectedFiles];

    lastRequestFiles =
      [...selectedFiles];

  }else{

    filesForRequest =
      [...lastRequestFiles];

  }


  if(!isRegenerate){

    addUserMessage(text);

    conversation.push({

      role:"user",

      content:text

    });


    if(
      conversation.length >
      MAX_HISTORY
    ){

      conversation =
        conversation.slice(
          -MAX_HISTORY
        );

    }


    messageInput.value = "";

    autoResize();

    selectedFiles = [];

    renderSelectedFiles();

  }else{

    addUserMessage(text);

  }


  addTypingMessage();

  setSendingState(true);


  try{

    const preparedFiles =
      await prepareFiles(
        filesForRequest
      );


    const answer =
      await requestAI(
        text,
        preparedFiles
      );


    if(!answer){

      throw new Error(
        "لم يصل رد من الخادم."
      );

    }


    addAssistantMessage(
      answer
    );


    conversation.push({

      role:"assistant",

      content:answer

    });


    if(
      conversation.length >
      MAX_HISTORY
    ){

      conversation =
        conversation.slice(
          -MAX_HISTORY
        );

    }

  }catch(error){

    console.error(error);

    removeTyping();


    let errorMessage =
      "حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.";


    if(
      error.name ===
      "AbortError"
    ){

      errorMessage =
        "تم إيقاف الطلب.";

    }else if(
      String(
        error.message || ""
      ).includes(
        "Failed to fetch"
      )
    ){

      errorMessage =
        "تعذر الاتصال بالخادم. تأكد أن السيرفر يعمل.";

    }else if(error.message){

      errorMessage =
        error.message;

    }


    addAssistantMessage(
      "⚠️ " + errorMessage
    );

    showToast(
      errorMessage
    );

  }finally{

    setSendingState(false);

  }

}


/* =========================================================
   API REQUEST
========================================================= */

async function requestAI(
  text,
  files
){

  abortController =
    new AbortController();


  const timeout =
    setTimeout(
      function(){

        if(abortController){

          abortController.abort();

        }

      },
      REQUEST_TIMEOUT
    );


  const payload = {

    message:text,

    messages:
      conversation.slice(
        -MAX_HISTORY
      ),

    files:files,

    fastMode:fastMode

  };


  try{

    const response =
      await fetch(
        API_ENDPOINT,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            ),

          signal:
            abortController.signal,

          cache:"no-store"
        }
      );


    let data = null;


    try{

      data =
        await response.json();

    }catch(error){

      throw new Error(
        "الخادم أرسل استجابة غير صالحة."
      );

    }


    if(!response.ok){

      throw new Error(

        data?.error ||

        data?.message ||

        `خطأ من الخادم (${response.status})`

      );

    }


    const answer =
      data?.answer ??
      data?.response ??
      data?.message ??
      data?.content ??
      data?.text;


    if(
      typeof answer ===
      "string"
    ){

      return answer;

    }


    if(
      answer &&
      typeof answer ===
      "object"
    ){

      return JSON.stringify(
        answer,
        null,
        2
      );

    }


    throw new Error(
      "لم يتم العثور على نص الرد من الخادم."
    );


  }finally{

    clearTimeout(timeout);

    abortController = null;

  }

}

          class="status-dot"
          style="
            background:#ff5b45;
            box-shadow:none
          "
        ></span>

        غير متصل

      `;

    }

    showToast(
      "لا يوجد اتصال بالإنترنت."
    );

  },
  false
);
