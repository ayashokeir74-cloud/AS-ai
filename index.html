<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Sultan AI - مساعد ذكاء اصطناعي متقدم وسريع للبرمجة، البحث، الصور والملفات.">
<meta name="robots" content="index,follow">
<title>Sultan AI V8.3</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  width:100%;
  height:100%;
  background:#0b0d10;
}

body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .2s ease,color .2s ease;
}

:root{
  --bg:#0b0d10;
  --bg2:#101318;
  --panel:#151920;
  --panel2:#1b2028;
  --panel3:#222832;
  --border:#2a3039;
  --text:#f4f6f8;
  --muted:#9299a5;
  --accent:#ffffff;
  --accentText:#0b0d10;
  --danger:#ff5f56;
  --success:#35d07f;
  --warning:#f5c451;
  --shadow:0 12px 40px rgba(0,0,0,.28);
  --radius:18px;
}

body.light{
  --bg:#f4f6f8;
  --bg2:#ffffff;
  --panel:#ffffff;
  --panel2:#f0f2f5;
  --panel3:#e7eaee;
  --border:#d7dbe1;
  --text:#111318;
  --muted:#68707c;
  --accent:#111318;
  --accentText:#ffffff;
  --shadow:0 10px 30px rgba(0,0,0,.10);
}

button,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  display:flex;
  width:100%;
  height:100%;
  position:relative;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:275px;
  min-width:275px;
  height:100%;
  background:var(--bg2);
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:16px;
  position:relative;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 4px 18px;
}

.logo{
  width:43px;
  height:43px;
  border-radius:14px;
  background:var(--accent);
  color:var(--accentText);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:21px;
  box-shadow:var(--shadow);
  flex:none;
}

.brandText{
  min-width:0;
}

.brandTitle{
  font-size:17px;
  font-weight:850;
  line-height:1.2;
}

.brandVersion{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.newChat{
  width:100%;
  min-height:47px;
  border-radius:14px;
  background:var(--accent);
  color:var(--accentText);
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .15s ease,opacity .15s ease;
}

.newChat:active{
  transform:scale(.98);
}

.sectionTitle{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  margin:20px 4px 8px;
}

.history{
  flex:1;
  min-height:0;
  overflow:auto;
  padding-right:2px;
}

.history::-webkit-scrollbar,
.chat::-webkit-scrollbar{
  width:5px;
}

.history::-webkit-scrollbar-thumb,
.chat::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:20px;
}

.historyEmpty{
  color:var(--muted);
  font-size:12px;
  text-align:center;
  padding:25px 10px;
}

.historyItem{
  width:100%;
  text-align:right;
  background:transparent;
  color:var(--text);
  border-radius:12px;
  padding:10px;
  margin-bottom:4px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  transition:background .15s ease;
}

.historyItem:hover,
.historyItem.active{
  background:var(--panel2);
}

.sidebarBottom{
  border-top:1px solid var(--border);
  padding-top:12px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.sideBtn{
  min-height:42px;
  border-radius:12px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  font-size:12px;
  font-weight:700;
}

.sideBtn:hover{
  background:var(--panel2);
}

/* =========================================================
   MAIN
========================================================= */

.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(255,255,255,.035),
      transparent 35%
    ),
    var(--bg);
}

.topbar{
  height:66px;
  min-height:66px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  background:rgba(11,13,16,.72);
  backdrop-filter:blur(14px);
  position:relative;
  z-index:10;
}

body.light .topbar{
  background:rgba(255,255,255,.8);
}

.menuBtn{
  display:none;
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  font-size:20px;
}

.modeWrap{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.modeLabel{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.modeSelect{
  height:42px;
  min-width:155px;
  padding:0 12px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:var(--panel);
  color:var(--text);
  cursor:pointer;
}

.topSpacer{
  flex:1;
}

.health{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
}

.healthDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--warning);
}

.healthDot.ok{
  background:var(--success);
}

.healthDot.bad{
  background:var(--danger);
}

.topBtn{
  height:42px;
  padding:0 13px;
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  font-size:12px;
  font-weight:700;
}

/* =========================================================
   CHAT
========================================================= */

.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:28px 20px 150px;
  scroll-behavior:smooth;
}

.chatInner{
  width:min(950px,100%);
  margin:0 auto;
}

.welcome{
  min-height:calc(100vh - 260px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:30px 10px;
}

.welcomeLogo{
  width:72px;
  height:72px;
  border-radius:23px;
  background:var(--accent);
  color:var(--accentText);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  font-weight:950;
  margin-bottom:20px;
  box-shadow:0 18px 55px rgba(0,0,0,.25);
}

.welcome h1{
  margin:0;
  font-size:30px;
  letter-spacing:-.5px;
}

.welcome p{
  margin:10px 0 0;
  color:var(--muted);
  font-size:14px;
  max-width:600px;
  line-height:1.7;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  width:min(700px,100%);
  margin-top:27px;
}

.suggestion{
  text-align:right;
  padding:15px;
  border-radius:15px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  min-height:64px;
  transition:
    transform .15s ease,
    background .15s ease,
    border-color .15s ease;
}

.suggestion:hover{
  background:var(--panel2);
  transform:translateY(-1px);
}

.suggestionTitle{
  font-weight:800;
  font-size:13px;
}

.suggestionDesc{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:flex;
  gap:12px;
  margin:0 auto 22px;
  width:100%;
  animation:messageIn .18s ease both;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  flex-direction:row-reverse;
}

.avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:13px;
  background:var(--panel2);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
  color:var(--text);
}

.message.user .avatar{
  background:var(--accent);
  color:var(--accentText);
}

.messageBody{
  min-width:0;
  max-width:min(82%,800px);
}

.message.user .messageBody{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.bubble{
  padding:13px 16px;
  border-radius:17px;
  line-height:1.75;
  font-size:14px;
  overflow-wrap:anywhere;
}

.message.user .bubble{
  background:var(--accent);
  color:var(--accentText);
  border-bottom-right-radius:5px;
}

.message.assistant .bubble{
  background:var(--panel);
  border:1px solid var(--border);
  border-bottom-left-radius:5px;
}

.messageActions{
  display:flex;
  gap:5px;
  margin-top:6px;
  opacity:.75;
}

.actionBtn{
  min-width:31px;
  height:30px;
  padding:0 8px;
  border-radius:9px;
  background:var(--panel2);
  color:var(--muted);
  border:1px solid var(--border);
  font-size:11px;
}

.actionBtn:hover{
  color:var(--text);
}

.message.user .actionBtn{
  background:var(--panel);
}

/* =========================================================
   MARKDOWN-LIKE CONTENT
========================================================= */

.bubble p{
  margin:0 0 9px;
}

.bubble p:last-child{
  margin-bottom:0;
}

.bubble ul,
.bubble ol{
  margin:7px 0;
  padding-right:23px;
}

.bubble li{
  margin:4px 0;
}

.bubble strong{
  font-weight:850;
}

.inlineCode{
  background:rgba(127,127,127,.16);
  border:1px solid rgba(127,127,127,.2);
  border-radius:6px;
  padding:1px 5px;
  direction:ltr;
  unicode-bidi:plaintext;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
  font-size:.92em;
}

.codeBlock{
  margin:12px 0 2px;
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  background:#0a0c0f;
  direction:ltr;
  text-align:left;
}

body.light .codeBlock{
  background:#f0f1f3;
}

.codeHeader{
  height:38px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  color:var(--muted);
  font-size:10px;
  direction:ltr;
}

.copyCode{
  height:27px;
  padding:0 9px;
  border-radius:7px;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  font-size:10px;
}

.codeBlock pre{
  margin:0;
  padding:13px;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12px;
  line-height:1.65;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
}

/* =========================================================
   TYPING
========================================================= */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  min-height:25px;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--muted);
  animation:typing 1s infinite ease-in-out;
}

.typing span:nth-child(2){
  animation-delay:.12s;
}

.typing span:nth-child(3){
  animation-delay:.24s;
}

@keyframes typing{
  0%,70%,100%{
    transform:translateY(0);
    opacity:.45;
  }
  35%{
    transform:translateY(-4px);
    opacity:1;
  }
}

/* =========================================================
   TOOL STATUS
========================================================= */

.toolStatus{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  margin-top:8px;
}

.toolPulse{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--success);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:.35;
    transform:scale(.8);
  }
  50%{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================================================
   COMPOSER
========================================================= */

.composerArea{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:13px 18px calc(13px + env(safe-area-inset-bottom));
  pointer-events:none;
  background:
    linear-gradient(
      to top,
      var(--bg) 55%,
      transparent
    );
}

.composer{
  pointer-events:auto;
  width:min(950px,100%);
  margin:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.attachments{
  display:none;
  gap:7px;
  flex-wrap:wrap;
  padding:9px 11px 0;
}

.attachments.hasFiles{
  display:flex;
}

.fileChip{
  max-width:220px;
  height:31px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 8px;
  border-radius:9px;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:10px;
  color:var(--text);
}

.fileChipName{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.removeFile{
  width:19px;
  height:19px;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
}

.removeFile:hover{
  background:var(--panel3);
  color:var(--danger);
}

.inputRow{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:10px;
}

.attachBtn,
.sendBtn{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.attachBtn{
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  font-size:19px;
}

.sendBtn{
  background:var(--accent);
  color:var(--accentText);
  font-size:18px;
  font-weight:900;
}

.sendBtn.stop{
  background:var(--danger);
  color:#fff;
}

.textarea{
  flex:1;
  min-width:0;
  resize:none;
  max-height:180px;
  min-height:44px;
  padding:11px 12px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:14px;
  line-height:1.6;
}

.textarea::placeholder{
  color:var(--muted);
}

.composerFooter{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:0 13px 9px;
  color:var(--muted);
  font-size:10px;
}

.statusText{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.statusDot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--success);
}

.charCount{
  white-space:nowrap;
}

/* =========================================================
   MOBILE OVERLAY
========================================================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:15;
}

.overlay.show{
  display:block;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translate(-50%,20px);
  background:var(--panel3);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 15px;
  border-radius:11px;
  font-size:12px;
  box-shadow:var(--shadow);
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
  z-index:100;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    width:280px;
    min-width:280px;
    transform:translateX(105%);
    transition:transform .22s ease;
    box-shadow:-20px 0 50px rgba(0,0,0,.3);
    z-index:30;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .menuBtn{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .topbar{
    padding:10px;
  }

  .modeLabel{
    display:none;
  }

  .modeSelect{
    min-width:125px;
    height:40px;
  }

  .health{
    display:none;
  }

  .topBtn{
    display:none;
  }

  .chat{
    padding:18px 11px 145px;
  }

  .welcome{
    min-height:calc(100vh - 235px);
    padding:20px 5px;
  }

  .welcomeLogo{
    width:62px;
    height:62px;
    border-radius:20px;
    font-size:26px;
  }

  .welcome h1{
    font-size:25px;
  }

  .welcome p{
    font-size:13px;
  }

  .suggestions{
    grid-template-columns:1fr;
    margin-top:20px;
  }

  .message{
    gap:8px;
    margin-bottom:18px;
  }

  .avatar{
    width:33px;
    height:33px;
    min-width:33px;
    border-radius:11px;
    font-size:11px;
  }

  .messageBody{
    max-width:86%;
  }

  .bubble{
    padding:11px 13px;
    font-size:13px;
  }

  .composerArea{
    padding-left:8px;
    padding-right:8px;
  }

  .composer{
    border-radius:16px;
  }

  .attachBtn,
  .sendBtn{
    width:41px;
    min-width:41px;
    height:41px;
  }

  .textarea{
    min-height:41px;
    font-size:13px;
  }

  .composerFooter{
    padding-bottom:8px;
  }
}

@media(max-width:390px){

  .modeSelect{
    min-width:110px;
    font-size:11px;
  }

  .welcome h1{
    font-size:22px;
  }

  .messageBody{
    max-width:84%;
  }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">S</div>

      <div class="brandText">
        <div class="brandTitle">Sultan AI</div>
        <div class="brandVersion">V8.3 • AI Assistant</div>
      </div>
    </div>

    <button class="newChat" id="newChatBtn">
      <span>＋</span>
      <span>محادثة جديدة</span>
    </button>

    <div class="sectionTitle">
      المحادثات
    </div>

    <div class="history" id="history">
      <div class="historyEmpty">
        لا توجد محادثات محفوظة
      </div>
    </div>

    <div class="sidebarBottom">

      <button class="sideBtn" id="themeBtn">
        ☀️ الوضع
      </button>

      <button class="sideBtn" id="clearBtn">
        🗑️ مسح
      </button>

    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main">

    <header class="topbar">

      <button
        class="menuBtn"
        id="menuBtn"
        aria-label="القائمة"
      >
        ☰
      </button>

      <div class="modeWrap">

        <span class="modeLabel">
          الوضع:
        </span>

        <select
          class="modeSelect"
          id="modeSelect"
          aria-label="وضع الذكاء الاصطناعي"
        >

          <option value="smart">
            🧠 Smart — ذكي
          </option>

          <option value="fast">
            ⚡ Fast — سريع
          </option>

          <option value="deep">
            🔬 Deep — عميق
          </option>

          <option value="code">
            💻 Code — برمجة
          </option>

          <option value="web">
            🌐 Web — بحث

function safeParse(value, fallback) {

  try {
    return JSON.parse(value);
  } catch {
    return fallback;
  }
}

function loadState() {

  const savedMessages =
    safeParse(
      localStorage.getItem(
        STORAGE_MESSAGES
      ),
      []
    );

  if (Array.isArray(savedMessages)) {
    messages =
      savedMessages
        .filter(
          item =>
            item &&
            (
              item.role === "user" ||
              item.role === "assistant"
            ) &&
            typeof item.content === "string"
        )
        .slice(-60);
  }

  const savedMode =
    localStorage.getItem(
      STORAGE_MODE

  if (
    savedMode &&
    [

      "code",
      "web",
      "vision",
      "files"

    currentMode = savedMode;

  const savedTheme =
    localStorage.getItem(
      STORAGE_THEME

  if (savedTheme === "light") {
    document.body.classList.add("light");
  }

  modeSelect.value =
    currentMode;

  renderMessages();
  renderHistory();
}

function saveMessages() {

  try {

      STORAGE_MESSAGES,

}

/* =========================================================
   UI HELPERS
========================================================= */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(text) {

  clearTimeout(toastTimer);

  toast.textContent =
    String(text || "");

  toast.classList.add("show");

  toastTimer =
    setTimeout(

    );
}

/* =========================================================
   MARKDOWN RENDERER
   Lightweight and safe
========================================================= */

function renderMarkdown(text) {

  let source =
    String(text || "")
      .replace(/\r\n/g,"\n")
      .replace(/\r/g,"\n");

  const codeBlocks = [];

  source =
    source.replace(
      /```([\w+-]*)\n?([\s\S]*?)```/g,
      (_,lang,code) => {

        const id =
          codeBlocks.length;

        codeBlocks.push({
          lang:
            lang || "code",
          code
        });

        return `@@CODEBLOCK_${id}@@`;
      }
    );

  let html =
    escapeHTML(source);

  html =
    html.replace(
      /`([^`\n]+)`/g,
      '<span class="inlineCode">$1</span>'
    );

  html =
    html.replace(
      /\*\*([^*\n]+)\*\*/g,
      "<strong>$1</strong>"
    );

  html =
    html.replace(
      /__([^_\n]+)__/g,
      "<strong>$1</strong>"
    );

  html =
    html.replace(
      /^\s*[-*]\s+(.+)$/gm,
      "<li>$1</li>"
    );

  html =
    html.replace(
      /(<li>[\s\S]*?<\/li>)/g,
      "<ul>$1</ul>"
    );

  html =
    html.replace(
      /^\s*\d+\.\s+(.+)$/gm,
      "<li>$1</li>"
    );

  html =
    html.replace(
      /@@CODEBLOCK_(\d+)@@/g,
      (_,index) => {

        const item =
          codeBlocks[
            Number(index)
          ];

        const code =
          escapeHTML(
            item.code
          );

        return `
          <div class="codeBlock">
            <div class="codeHeader">
              <span>${escapeHTML(item.lang)}</span>
              <button
                class="copyCode"
                data-code="${encodeURIComponent(item.code)}"
              >
                نسخ
              </button>
            </div>
            <pre>${code}</pre>
          </div>
        `;
      }
    );

  const blocks =
    html
      .split(/\n{2,}/)
      .map(block => {

        const trimmed =
          block.trim();

        if (!trimmed) {
          return "";
        }

        if (
          trimmed.startsWith("<ul>") ||
          trimmed.startsWith("<ol>") ||
          trimmed.startsWith("<div class=\"codeBlock\">")
        ) {
          return trimmed;
        }

        return `<p>${trimmed.replace(/\n/g,"<br>")}</p>`;
      })
      .join("");

  return blocks;
}

   MESSAGE RENDER

function createMessageElement(

  }

    document.createElement("div");

  actions.className =
    "messageActions";

  if (
    message.role === "assistant"

  } else {

    edit.addEventListener(

    actions.appendChild(edit);

  row.appendChild(

  );

  return row;
}

/* =========================================================
   COPY
========================================================= */

async function copyText(text) {

  try {

    await navigator.clipboard.writeText(
      String(text || "")
    );

    showToast(
      "تم النسخ ✓"
    );

  } catch {

    const area =
      document.createElement("textarea");

    area.value =
      String(text || "");

    document.body.appendChild(area);

    area.select();

    document.execCommand(
      "copy"
    );

    area.remove();

    showToast(
      "تم النسخ ✓"
    );
  }
}

document.addEventListener(
  "click",
  event => {

    const btn =
      event.target.closest(
        ".copyCode"
      );

    if (!btn) {
      return;
    }

    try {

      copyText(
        decodeURIComponent(
          btn.dataset.code
        )
      );

    } catch {}
  }
);

/* =========================================================
   EDIT MESSAGE
========================================================= */

function editMessage(index) {

  const item =
    messages[index];

  if (
    !item ||
    item.role !== "user"
  ) {
    return;
  }

  const newText =
    prompt(
      "عدّل رسالتك:",
      item.content
    );

  if (
    newText === null
  ) {
    return;
  }

  const clean =
    newText.trim();

  if (!clean) {
    return;
  }

  messages =
    messages.slice(
      0,
      index
    );

  saveMessages();
  renderMessages();

  messageInput.value =
    clean;

  autoResize();

  messageInput.focus();
}

/* =========================================================
   HISTORY
========================================================= */

function renderHistory() {

  historyEl.innerHTML = "";

  const userMessages =
    messages.filter(
      item =>
        item.role === "user"
    );

  if (!userMessages.length) {

    const empty =
      document.createElement("div");

    empty.className =
      "historyEmpty";

    empty.textContent =
      "لا توجد محادثات محفوظة";

    historyEl.appendChild(
      empty
    );

    return;
  }

  userMessages
    .slice(-25)
    .reverse()
    .forEach(
      item => {

        const button =
          document.createElement("button");

        button.className =
          "historyItem";

        button.textContent =
          item.content
            .replace(/\s+/g," ")
            .slice(0,70);

        button.title =
          item.content;

        button.addEventListener(
          "click",
          () => {

            messageInput.value =
              item.content;

            autoResize();

            messageInput.focus();

            closeSidebar();
          }
        );

        historyEl.appendChild(
          button
        );
      }
    );
}

/* =========================================================
   FILES
========================================================= */

attachBtn.addEventListener(
  "click",
  () => {

      showToast(
        "انتظر انتهاء الإجابة أولاً"
      );
      return;
    }

    fileInput.click();
  }
);

fileInput.addEventListener(
  "change",
  async event => {

    const files =
      Array.from(
        event.target.files || []
      );

    await addFiles(files);

    fileInput.value = "";
  }
);

async function addFiles(files) {

  if (!files.length) {
    return;
  }

  if (
    selectedFiles.length +
    files.length >
    MAX_FILES
  ) {

    showToast(
      `الحد الأقصى ${MAX_FILES} ملفات`
    );

    return;
  }

  let total =
    selectedFiles.reduce(
      (sum,file) =>
        sum +
        Number(file.size || 0),
      0
    );

  for (
    const file of files
  ) {

    if (
      file.size >
      MAX_FILE_SIZE
    ) {

      showToast(
        `${file.name} أكبر من 20MB`
      );

      continue;
    }

    if (
      total +
      file.size >
      MAX_TOTAL_FILE_SIZE
    ) {

      showToast(
        "تجاوز الحجم الإجمالي المسموح"
      );

      break;
    }

    total +=
      file.size;

    try {

      const data =
        await fileToDataURL(
          file
        );

      selectedFiles.push({
        name:file.name,
        type:file.type,
        size:file.size,
        data
      });

    } catch {

      showToast(
        `تعذر قراءة ${file.name}`
      );
    }
  }

  renderFiles();
}

function fileToDataURL(file) {

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () =>
          resolve(
            reader.result
          );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}

function renderFiles() {

  attachments.innerHTML = "";

  if (!selectedFiles.length) {

    attachments.classList.remove(
      "hasFiles"
    );

    return;
  }

  attachments.classList.add(
    "hasFiles"
  );

  selectedFiles.forEach(
    (file,index) => {

      const chip =
        document.createElement("div");

      chip.className =
        "fileChip";

      const icon =
        String(file.type || "")
          .startsWith("image/")
          ? "🖼️"
          : file.name
              .toLowerCase()
              .endsWith(".pdf")
              ? "📕"
              : "📄";

      chip.innerHTML = `
        <span>${icon}</span>
        <span class="fileChipName">
          ${escapeHTML(file.name)}
        </span>
        <button
          class="removeFile"
          type="button"
          data-index="${index}"
        >
          ×
        </button>
      `;

      attachments.appendChild(
        chip
      );
    }
  );
}

attachments.addEventListener(
  "click",
  event => {

    const btn =
      event.target.closest(
        ".removeFile"
      );

    if (!btn) {
      return;
    }

    const index =
      Number(
        btn.dataset.index
      );

    selectedFiles.splice(
      index,
      1
    );

    renderFiles();
  }
);

========================================================= */

function autoResize() {

  messageInput.style.height =
    "auto";

  messageInput.style.height =

      messageInput.scrollHeight,

}

function updateCharCount() {

  const length =
    messageInput.value.length;

  charCount.textContent =
    `${length} / ${MAX_MESSAGE_CHARS}`;
}

messageInput.addEventListener(
  "input",
  () => {

    autoResize();
    updateCharCount();
  }
);

messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      if (!isGenerating) {
        generateResponse();
      }
    }
  }
);

/* =========================================================
   SUGGESTIONS
========================================================= */

document
  .querySelectorAll(
    ".suggestion"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          messageInput.value =
            button.dataset.prompt ||
            "";

          autoResize();
          updateCharCount();

          messageInput.focus();
        }
      );
    }
  );

/* =========================================================
   SSE PARSER
========================================================= */

async function readSSE(
  response,
  onEvent
) {

  if (!response.body) {
    throw new Error(
      "Streaming غير متاح."
    );
  }

  const reader =
    response.body.getReader();

  const decoder =
    new TextDecoder(
      "utf-8"
    );

  let buffer = "";

  while (true) {

    const {
      value,
      done
    } =
      await reader.read();

    if (done) {
      break;
    }

    buffer +=
      decoder.decode(
        value,
        {
          stream:true
        }
      );

    buffer =
      buffer.replace(
        /\r\n/g,
        "\n"
      );

    const events =
      buffer.split(
        "\n\n"
      );

    buffer =
      events.pop() || "";

    for (
      const block of events
    ) {

      parseSSEBlock(
        block,
        onEvent
      );
    }
  }

  buffer +=
    decoder.decode();

  if (buffer.trim()) {

    parseSSEBlock(
      buffer,
      onEvent
    );
  }
}

function parseSSEBlock(
  block,
  onEvent
) {

  const lines =
    block.split("\n");

  let eventName =
    "message";

  const dataLines = [];

  for (
    const line of lines
  ) {

    if (
      line.startsWith("event:")
    ) {

      eventName =
        line
          .slice(6)
          .trim();

      continue;
    }

    if (
      line.startsWith("data:")
    ) {

      dataLines.push(
        line.slice(5).trim()
      );
    }
  }

  if (!dataLines.length) {
    return;
  }

  const raw =
    dataLines.join("\n");

  if (
    raw === "[DONE]"
  ) {

    onEvent(
      "done",
      {
        success:true
      }
    );

    return;
  }

  try {

    const data =
      JSON.parse(raw);

    onEvent(
      eventName,
      data
    );

  } catch {

    /* تجاهل event غير صالح */
  }
}

/* =========================================================
   GENERATE
========================================================= */

async function generateResponse() {

  if (isGenerating) {
    return;
  }

  const text =
    messageInput.value
      .trim();

  if (
    !text &&
    !selectedFiles.length
  ) {

    showToast(
      "اكتب رسالة أو أرفق ملفاً"
    );

    messageInput.focus();

    return;
  }

  const cleanText =
    text.slice(
      0,
      MAX_MESSAGE_CHARS
    );

  const filesForRequest =
    selectedFiles.map(
      file => ({
        name:file.name,
        type:file.type,
        size:file.size,
        data:file.data
      })
    );

  const userMessage = {
    role:"user",
    content:
      cleanText ||
      "حلل الملفات المرفقة وقدم نتيجة مفيدة."
  };

  messages.push(
    userMessage
  );

  saveMessages();

  renderMessages();

  const historyForRequest =
    messages
      .slice(-12)
      .map(
        item => ({
          role:item.role,
          content:
            String(
              item.content || ""
            )
        })
      );

  messageInput.value =
    "";

  selectedFiles = [];

  renderFiles();

  autoResize();
  updateCharCount();

  isGenerating = true;

  controller =
    new AbortController();

  sendBtn.classList.add(
    "stop"
  );

  sendBtn.textContent =
    "■";

  setStatus(
    "Sultan AI يعمل...",
    "busy"
  );

  const typing =
    createTypingElement();

  chatInner.appendChild(
    typing
  );

  scrollToBottom();

  let assistantText = "";
  let gotStreamResponse = false;
  let finished = false;

  try {

    const payload = {
      message: cleanText,
      messages: historyForRequest,
      files: filesForRequest,
      fastMode:
        currentMode === "fast",
      mode: currentMode
    };

    /*
      Streaming أولاً.
      إذا فشل، ننتقل تلقائياً إلى
      /api/chat.
    */

    try {

      const response =
        await fetch(
          STREAM_API,
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify(
                payload
              ),
            signal:
              controller.signal
          }
        );

      if (!response.ok) {

        let errorText =
          "تعذر الاتصال بالخادم.";

        try {

          const data =
            await response.json();

          errorText =
            data.error ||
            errorText;

        } catch {}

        throw new Error(
          errorText
        );
      }

      await readSSE(
        response,
        (event,data) => {

          if (event === "meta") {

            setLiveStatus(
              data.mode === "fast"
                ? "الوضع السريع يعمل..."
                : "Sultan AI يحلل طلبك..."
            );

            return;
          }

          if (event === "status") {

            setLiveStatus(
              data.text ||
              "Sultan AI يعمل..."
            );

            return;
          }

          if (event === "tool") {

            setLiveStatus(
              data.text ||
              "Sultan AI يستخدم أدواته..."
            );

            return;
          }

          if (event === "token") {

            gotStreamResponse =
              true;

            assistantText +=
              String(
                data.text || ""
              );

            updateTypingMessage(
              assistantText
            );

            scrollToBottom();

            return;
          }

          if (event === "done") {

            finished = true;

            if (
              !assistantText &&
              data.reply
            ) {

              assistantText =
                String(
                  data.reply
                );

              updateTypingMessage(
                assistantText
              );
            }

            return;
          }

          if (event === "error") {

            throw new Error(
              data.error ||
              "حدث خطأ أثناء التوليد."
            );
          }
        }
      );

      /*
        إذا وصل نص فعلي من Streaming
        نعتبر الطلب ناجحاً.
      */

      if (
        gotStreamResponse &&
        assistantText.trim()
      ) {

        finishAssistantMessage(
          assistantText
        );

        return;
      }

      /*
        أحياناً السيرفر قد يرجع done
        مع reply بدون token.
      */

      if (
        finished &&
        assistantText.trim()
      ) {

        finishAssistantMessage(
          assistantText
        );

        return;
      }

      throw new Error(
        "لم تصل إجابة من Streaming."
      );

    } catch (streamError) {

      if (
        controller.signal.aborted
      ) {
        throw streamError;
      }

      /*
        Fallback إلى endpoint العادي
      */

      setLiveStatus(
        "نحاول الاتصال بالطريقة البديلة..."
      );

      const normalResponse =
        await fetch(
          NORMAL_API,
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify(
                payload
              ),
            signal:
              controller.signal
          }
        );

      const data =
        await normalResponse.json()
          .catch(
            () => ({})
          );

      if (
        !normalResponse.ok ||
        data.success === false
      ) {

        throw new Error(
          data.error ||
          streamError.message ||
          "تعذر الحصول على إجابة."
        );
      }

      const reply =
        String(
          data.reply ||
          data.text ||
          data.message ||
          ""
        ).trim();

      if (!reply) {

        throw new Error(
          "لم تصل إجابة من الخادم."
        );
      }

      assistantText =
        reply;

      updateTypingMessage(
        assistantText
      );

      finishAssistantMessage(
        assistantText
      );
    }

  } catch (error) {

    if (
      error?.name ===
      "AbortError"
    ) {

      removeTypingMessage();

      setStatus(
        "تم إيقاف التوليد"
      );

      return;
    }

    removeTypingMessage();

    const errorMessage =
      error?.message ||
      "حدث خطأ غير متوقع.";

    messages.push({
      role:"assistant",
      content:
        `⚠️ ${errorMessage}`
    });

    saveMessages();

    renderMessages();

    setStatus(
      "حدث خطأ",
      "error"
    );

    showToast(
      errorMessage
    );

  } finally {

    isGenerating = false;

    controller = null;

    sendBtn.classList.remove(
      "stop"
    );

    sendBtn.textContent =
      "➤";

    if (
      !statusText.textContent ||
      statusText.textContent ===
        "Sultan AI يعمل..."
    ) {

      setStatus(
        "Sultan AI جاهز"
      );
    }
  }
}

/* =========================================================
   UPDATE STREAM MESSAGE
========================================================= */

function updateTypingMessage(
  text
) {

  let row =
    document.getElementById(
      "typingMessage"
    );

  if (!row) {

    row =
      createTypingElement();

    chatInner.appendChild(
      row
    );
  }

  const bubble =
    row.querySelector(
      ".bubble"
    );

  if (bubble) {

    bubble.innerHTML =
      renderMarkdown(
        text
      );
  }

  const typing =
    row.querySelector(
      ".typing"
    );

  if (typing) {
    typing.remove();
  }
}

/* =========================================================
   FINISH ASSISTANT
========================================================= */

function finishAssistantMessage(
  text
) {

  removeTypingMessage();

  const clean =
    String(text || "")
      .trim();

  if (!clean) {
    return;
  }

  messages.push({
    role:"assistant",
    content:clean
  });

  saveMessages();

  renderMessages();

  renderHistory();

  setStatus(
    "Sultan AI جاهز"
  );

  scrollToBottom();
}

/* =========================================================
   REMOVE TYPING
========================================================= */

function removeTypingMessage() {

  const row =
    document.getElementById(
      "typingMessage"
    );

  if (row) {
    row.remove();
  }
}

/* =========================================================
   STOP
========================================================= */

function stopGeneration() {

  if (
    controller
  ) {

    controller.abort();

    controller = null;
  }

  isGenerating = false;

  sendBtn.classList.remove(
    "stop"
  );

  sendBtn.textContent =
    "➤";

  removeTypingMessage();

  setStatus(
    "تم إيقاف التوليد"
  );
}

sendBtn.addEventListener(
  "click",
  () => {

    if (isGenerating) {

      stopGeneration();

    } else {

      generateResponse();
    }
  }
);

/* =========================================================
   HEALTH
========================================================= */

async function checkHealth() {

  try {

    const response =
      await fetch(
        HEALTH_API,
        {
          method:"GET",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if (
      response.ok &&
      data.configured
    ) {

      healthDot.classList.add(
        "ok"
      );

      healthDot.classList.remove(
        "bad"
      );

      healthText.textContent =
        "متصل";

    } else {

      healthDot.classList.remove(
        "ok"
      );

      healthDot.classList.add(
        "bad"
      );

      healthText.textContent =
        "غير جاهز";
    }

  } catch {

    healthDot.classList.remove(
      "ok"
    );

    healthDot.classList.add(
      "bad"
    );

    healthText.textContent =
      "غير متصل";
  }
}

/* =========================================================
   INITIALIZE
========================================================= */

loadState();

renderFiles();

autoResize();

updateCharCount();

checkHealth();

/*
  فحص الخادم كل دقيقة.
  ما منعمله بشكل سريع حتى ما نزيد
  الضغط على Render.
*/

setInterval(
  checkHealth,
  60000
);

/* =========================================================
   ONLINE / OFFLINE
========================================================= */

window.addEventListener(
  "online",
  () => {

    setStatus(
      "تم الاتصال بالإنترنت"
    );

    checkHealth();
  }
);

window.addEventListener(
  "offline",
  () => {

    setStatus(
      "لا يوجد اتصال بالإنترنت",
      "error"
    );
  }
);

/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden
    ) {
      checkHealth();
    }
  }
);

</script>
