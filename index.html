<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Sultan AI - مساعد ذكاء اصطناعي سريع ومتطور">
<title>Sultan AI V8.1</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#0b0d10;
  --bg2:#101318;
  --panel:#151920;
  --panel2:#1b2028;
  --panel3:#222832;
  --border:#2a3039;
  --text:#f4f6f8;
  --muted:#9299a5;
  --accent:#ffffff;
  --accentText:#0b0d10;
  --danger:#ff5f56;
  --success:#35d07f;
  --shadow:0 12px 40px rgba(0,0,0,.28);
  --radius:18px;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans Arabic",sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  background:var(--bg);
}

/* SIDEBAR */

.sidebar{
  width:270px;
  height:100%;
  background:#0d1014;
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:16px;
  transition:.25s ease;
  z-index:30;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:7px 4px 20px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:#fff;
  color:#0b0d10;
  font-size:19px;
  font-weight:900;
  box-shadow:0 6px 22px rgba(255,255,255,.08);
}

.brand-text strong{
  display:block;
  font-size:17px;
}

.brand-text span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.new-chat{
  width:100%;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:13px;
  padding:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.18s;
}

.new-chat:hover{
  background:var(--panel2);
  border-color:#3a424e;
}

.side-title{
  color:#727985;
  font-size:11px;
  margin:24px 5px 9px;
}

.chat-history{
  flex:1;
  overflow:auto;
}

.history-item{
  padding:10px 11px;
  border-radius:10px;
  color:#c6cad0;
  font-size:13px;
  cursor:pointer;
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#171b21;
}

.side-bottom{
  border-top:1px solid var(--border);
  padding-top:12px;
  margin-top:10px;
}

.side-action{
  width:100%;
  border:0;
  background:transparent;
  color:#b7bcc5;
  padding:10px;
  text-align:right;
  border-radius:10px;
  cursor:pointer;
}

.side-action:hover{
  background:#171b21;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:62px;
  min-height:62px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(11,13,16,.88);
  backdrop-filter:blur(15px);
  z-index:10;
}

.top-left,
.top-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.mobile-menu{
  display:none;
}

.mode-select{
  position:relative;
}

.mode-button{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
}

.mode-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
}

.mode-menu{
  position:absolute;
  top:46px;
  right:0;
  width:210px;
  background:#151920;
  border:1px solid var(--border);
  border-radius:14px;
  padding:7px;
  box-shadow:var(--shadow);
  display:none;
  z-index:50;
}

.mode-menu.open{
  display:block;
  animation:pop .14s ease;
}

@keyframes pop{
  from{opacity:0;transform:translateY(-5px)}
  to{opacity:1;transform:translateY(0)}
}

.mode-option{
  width:100%;
  border:0;
  background:transparent;
  color:#dce0e5;
  padding:10px;
  border-radius:9px;
  text-align:right;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.mode-option:hover,
.mode-option.active{
  background:#222832;
}

.mode-info{
  display:flex;
  gap:8px;
  align-items:center;
}

.mode-icon{
  width:25px;
  text-align:center;
}

.icon-button{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:#dce0e5;
  cursor:pointer;
  display:grid;
  place-items:center;
}

.icon-button:hover{
  background:var(--panel2);
}

/* CHAT */

.chat{
  flex:1;
  overflow:auto;
  scroll-behavior:smooth;
  padding:30px 20px 160px;
}

.chat-inner{
  max-width:850px;
  margin:auto;
}

.welcome{
  min-height:calc(100dvh - 260px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.welcome-logo{
  width:70px;
  height:70px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:#fff;
  color:#0b0d10;
  font-size:27px;
  font-weight:900;
  margin-bottom:20px;
  box-shadow:0 15px 45px rgba(255,255,255,.08);
}

.welcome h1{
  margin:0;
  font-size:32px;
  letter-spacing:-.5px;
}

.welcome p{
  color:var(--muted);
  margin:10px 0 24px;
  font-size:14px;
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  max-width:650px;
}

.suggestion{
  background:var(--panel);
  border:1px solid var(--border);
  color:#cdd2d8;
  border-radius:12px;
  padding:10px 13px;
  cursor:pointer;
  font-size:12px;
}

.suggestion:hover{
  background:var(--panel2);
}

.message{
  display:flex;
  gap:12px;
  margin:0 0 25px;
  animation:messageIn .18s ease;
}

@keyframes messageIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

.message.user{
  flex-direction:row-reverse;
}

.avatar{
  flex:0 0 34px;
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:bold;
}

.message.user .avatar{
  background:#303640;
  color:#fff;
}

.message.assistant .avatar{
  background:#fff;
  color:#0b0d10;
}

.bubble{
  max-width:min(760px,85%);
  line-height:1.75;
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.user .bubble{
  background:#1c2128;
  border:1px solid #272d36;
  padding:11px 14px;
  border-radius:16px 5px 16px 16px;
}

.message.assistant .bubble{
  padding-top:2px;
}

.message-tools{
  display:flex;
  gap:5px;
  margin-top:7px;
  opacity:.7;
}

.message-tools button{
  border:0;
  background:transparent;
  color:#888f9a;
  cursor:pointer;
  padding:5px;
  border-radius:6px;
  font-size:12px;
}

.message-tools button:hover{
  background:#1b2027;
  color:#fff;
}

.typing{
  display:inline-flex;
  gap:4px;
  padding:8px 0;
}

.typing i{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#8f96a0;
  animation:typing 1s infinite;
}

.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,60%,100%{opacity:.3;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-3px)}
}

/* INPUT */

.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:16px 20px 18px;
  background:linear-gradient(transparent,var(--bg) 27%);
}

.composer{
  max-width:850px;
  margin:auto;
  background:#151920;
  border:1px solid #303640;
  border-radius:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
  overflow:hidden;
}

.file-preview{
  display:none;
  gap:7px;
  flex-wrap:wrap;
  padding:9px 11px 0;
}

.file-preview.show{
  display:flex;
}

.file-chip{
  background:#222832;
  border:1px solid #303743;
  border-radius:9px;
  padding:6px 8px;
  font-size:11px;
  color:#cbd0d7;
  display:flex;
  align-items:center;
  gap:6px;
}

.file-chip button{
  border:0;
  background:transparent;
  color:#9097a1;
  cursor:pointer;
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:10px;
}

.attach-btn,
.send-btn{
  flex:0 0 39px;
  width:39px;
  height:39px;
  border-radius:11px;
  border:1px solid var(--border);
  background:#1c2128;
  color:#dfe3e8;
  cursor:pointer;
  display:grid;
  place-items:center;
}

.attach-btn:hover{
  background:#252b34;
}

.send-btn{
  background:#fff;
  color:#0b0d10;
  border-color:#fff;
  font-weight:bold;
}

.send-btn:hover{
  background:#e5e7ea;
}

.send-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

#messageInput{
  flex:1;
  min-height:39px;
  max-height:160px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#f4f6f8;
  padding:9px 4px;
  line-height:1.5;
  font-size:14px;
}

#messageInput::placeholder{
  color:#717883;
}

.composer-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px 8px;
  color:#6f7680;
  font-size:10px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--success);
}

.status-dot.offline{
  background:var(--danger);
}

#fileInput{
  display:none;
}

/* CODE */

pre{
  direction:ltr;
  text-align:left;
  background:#0b0d10;
  border:1px solid #2b3139;
  border-radius:12px;
  padding:14px;
  overflow:auto;
  white-space:pre;
}

code{
  font-family:Consolas,Monaco,monospace;
  font-size:12px;
}

/* MOBILE */

@media(max-width:760px){

  .sidebar{
    position:fixed;
    right:-290px;
    top:0;
    bottom:0;
    width:280px;
    transition:right .25s ease;
    box-shadow:-20px 0 50px rgba(0,0,0,.45);
  }

  .sidebar.open{
    right:0;
  }

  .mobile-menu{
    display:grid;
  }

  .topbar{
    padding:0 11px;
  }

  .top-left{
    gap:6px;
  }

  .top-right .icon-button:not(:last-child){
    display:none;
  }

  .mode-button{
    max-width:125px;
    font-size:11px;
  }

  .chat{
    padding:22px 12px 145px;
  }

  .welcome{
    min-height:calc(100dvh - 245px);
  }

  .welcome h1{
    font-size:26px;
  }

  .welcome-logo{
    width:60px;
    height:60px;
  }

  .bubble{
    max-width:87%;
    font-size:13px;
  }

  .composer-wrap{
    padding:10px 9px 11px;
  }

  .composer{
    border-radius:16px;
  }

  .composer-footer{
    display:none;
  }
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:20;
}

.overlay.show{
  display:block;
}

/* LIGHT */

body.light{
  --bg:#f6f7f9;
  --bg2:#fff;
  --panel:#fff;
  --panel2:#f0f2f5;
  --border:#dfe3e8;
  --text:#15181d;
  --muted:#69717c;
  --accent:#15181d;
  --accentText:#fff;
}

body.light .sidebar{
  background:#fff;
}

body.light .topbar{
  background:rgba(246,247,249,.88);
}

body.light .message.user .bubble{
  background:#e9edf2;
  border-color:#dce1e7;
}

body.light .composer{
  background:#fff;
  border-color:#d7dce2;
}

body.light .welcome-logo,
body.light .brand-logo{
  background:#15181d;
  color:#fff;
}

body.light .send-btn{
  background:#15181d;
  color:#fff;
  border-color:#15181d;
}
</style>
</head>

<body>
<div class="app">

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">S</div>
      <div class="brand-text">
        <strong>Sultan AI</strong>
        <span>V8.1 • AI Assistant</span>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">
      ＋ محادثة جديدة
    </button>

    <div class="side-title">المحادثات</div>

    <div class="chat-history" id="chatHistory"></div>

    <div class="side-bottom">

      <button class="side-action" id="clearBtn">⌫ مسح المحادثة</button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button class="icon-button mobile-menu" id="menuBtn">☰</button>

        <div class="mode-select">

          <button class="mode-button" id="modeButton">
            <span class="mode-dot"></span>
            <span id="modeLabel">Smart</span>
            <span>⌄</span>
          </button>

          <div class="mode-menu" id="modeMenu">

            <button class="mode-option active" data-mode="smart">
              <span class="mode-info">
                <span class="mode-icon">✦</span>
                Smart
              </span>
            </button>

            <button class="mode-option" data-mode="fast">
              <span class="mode-info">
                <span class="mode-icon">⚡</span>
                Fast
              </span>
            </button>

            <button class="mode-option" data-mode="deep">
              <span class="mode-info">
                <span class="mode-icon">◉</span>
                Deep
              </span>
            </button>

            <button class="mode-option" data-mode="code">
              <span class="mode-info">
                <span class="mode-icon">&lt;/&gt;</span>
                Code
              </span>
            </button>

            <button class="mode-option" data-mode="web">
              <span class="mode-info">
                <span class="mode-icon">⌕</span>
                Web
              </span>
            </button>

            <button class="mode-option" data-mode="vision">
              <span class="mode-info">
                <span class="mode-icon">◉</span>
                Vision
              </span>
            </button>

            <button class="mode-option" data-mode="files">
              <span class="mode-info">
                <span class="mode-icon">▧</span>
                Files
              </span>
            </button>

          </div>

        </div>

      </div>

      <div class="top-right">

        <button class="icon-button" id="healthBtn" title="حالة النظام">●</button>

        <button class="icon-button" id="newTopBtn" title="محادثة جديدة">＋</button>

    </header>

    <section class="chat" id="chat">

      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">S</div>

          <h1>كيف فيني ساعدك؟</h1>

          <p>Sultan AI V8.1 — مساعدك الذكي للمحادثة، البرمجة وتحليل الملفات.</p>

          <div class="suggestions">

            <button class="suggestion">اشرحلي فكرة بطريقة بسيطة</button>
            <button class="suggestion">ساعدني بكتابة كود</button>
            <button class="suggestion">حلللي هالمشكلة</button>
            <button class="suggestion">شو فيني أعمل اليوم؟</button>

        </div>

    </section>

    <div class="composer-wrap">

      <div class="composer">

          <textarea
            id="messageInput"
            rows="1"
            maxlength="10000"
            placeholder="اكتب رسالتك..."
          ></textarea>

          <button class="send-btn" id="sendBtn" title="إرسال">➤</button>

        </div>

        <div class="composer-footer">

          <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Sultan AI متصل</span>
          </div>

          <span>Enter للإرسال • Shift+Enter لسطر جديد</span>

        </div>

      </div>

    </div>

  </main>

</div>

<script>
"use strict";

/* =========================
   API
========================= */

const STREAM_API = "/api/chat/stream";
const NORMAL_API = "/api/chat";
const HEALTH_API = "/api/health";

/* =========================
   STATE
========================= */

let messages = [];
let selectedFiles = [];
let currentMode = "smart";
let isGenerating = false;
let controller = null;

const MAX_FILES = 5;
const MAX_FILE_SIZE = 20 * 1024 * 1024;

/* =========================
   ELEMENTS
========================= */

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");
const newChatBtn = document.getElementById("newChatBtn");
const newTopBtn = document.getElementById("newTopBtn");
const clearBtn = document.getElementById("clearBtn");
const themeBtn = document.getElementById("themeBtn");

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const welcome = document.getElementById("welcome");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const filePreview = document.getElementById("filePreview");

const modeButton = document.getElementById("modeButton");
const modeMenu = document.getElementById("modeMenu");
const modeLabel = document.getElementById("modeLabel");

const healthBtn = document.getElementById("healthBtn");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

const chatHistory = document.getElementById("chatHistory");

/* =========================
   STORAGE
========================= */

function saveMessages(){
  try{
    localStorage.setItem(
      "sultan_ai_messages_v81",
      JSON.stringify(messages.slice(-40))
    );
  }catch(e){}
}

function loadMessages(){
  try{
    const raw = localStorage.getItem("sultan_ai_messages_v81");
    if(!raw)return;

    const data = JSON.parse(raw);

    if(Array.isArray(data)){
      messages = data;
      renderMessages();
    }
  }catch(e){
    messages = [];
  }
}

function saveMode(){
  try{
    localStorage.setItem("sultan_ai_mode_v81",currentMode);
  }catch(e){}
}

function loadMode(){
  try{
    const mode = localStorage.getItem("sultan_ai_mode_v81");
    if(mode){
      setMode(mode);
    }
  }catch(e){}
}

/* =========================
   NEW CHAT
========================= */

function newChat(){
  if(isGenerating && controller){
    try{controller.abort()}catch(e){}
  }

  messages = [];
  selectedFiles = [];

  saveMessages();

  renderMessages();
  renderFiles();

  messageInput.value = "";
  autoResize();

  closeSidebar();

  messageInput.focus();
}

newChatBtn.addEventListener("click",newChat);
newTopBtn.addEventListener("click",newChat);

/* =========================
   RENDER
========================= */

function escapeHTML(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatText(text){

  let safe = escapeHTML(text || "");

  safe = safe.replace(
    /```([\s\S]*?)```/g,
    function(_,code){
      return "<pre><code>"+code.trim()+"</code></pre>";
    }
  );

  safe = safe.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  safe = safe.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  return safe;
}

function renderMessages(){

  chatInner.innerHTML = "";

  if(messages.length === 0){
    chatInner.appendChild(welcome);
    updateHistory();
    scrollBottom();
    return;
  }

  messages.forEach((msg,index)=>{

    const wrapper = document.createElement("div");
    wrapper.className = "message " +
      (msg.role === "user" ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = msg.role === "user" ? "أنت" : "S";

    const body = document.createElement("div");
    body.style.minWidth = "0";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.innerHTML = formatText(msg.content || "");

    const tools = document.createElement("div");
    tools.className = "message-tools";

    if(msg.role === "assistant"){

      const copy = document.createElement("button");
      copy.textContent = "نسخ";
      copy.onclick = ()=>{
        navigator.clipboard?.writeText(msg.content || "");
        copy.textContent = "تم النسخ";
        setTimeout(()=>copy.textContent="نسخ",1200);
      };

      tools.appendChild(copy);

    }else{

      const edit = document.createElement("button");
      edit.textContent = "تعديل";
      edit.onclick = ()=>{
        editMessage(index);
      };

      tools.appendChild(edit);
    }

    body.appendChild(bubble);
    body.appendChild(tools);

    wrapper.appendChild(avatar);
    wrapper.appendChild(body);

    chatInner.appendChild(wrapper);
  });

  updateHistory();
  scrollBottom();
}

function addMessageToDOM(role,content){

  if(welcome.parentNode === chatInner){
    welcome.remove();
  }

  const wrapper = document.createElement("div");
  wrapper.className = "message "+role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "أنت" : "S";

  const body = document.createElement("div");
  body.style.minWidth = "0";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = formatText(content || "");

  body.appendChild(bubble);

  wrapper.appendChild(avatar);
  wrapper.appendChild(body);

  chatInner.appendChild(wrapper);

  scrollBottom();

  return bubble;
}

function scrollBottom(){
  requestAnimationFrame(()=>{
    chat.scrollTop = chat.scrollHeight;
  });
}

/* =========================
   HISTORY
========================= */

function updateHistory(){

  chatHistory.innerHTML = "";

  const userMessages = messages
    .filter(m=>m.role==="user")
    .slice(-12)
    .reverse();

  if(userMessages.length===0){

    const empty = document.createElement("div");
    empty.style.color="#656c76";
    empty.style.fontSize="12px";
    empty.style.padding="10px";
    empty.textContent="لا توجد محادثات بعد";

    chatHistory.appendChild(empty);
    return;
  }

  userMessages.forEach((msg)=>{

    const item = document.createElement("div");
    item.className = "history-item";

    item.textContent =
      String(msg.content || "").slice(0,45);

    item.onclick = ()=>{
      scrollBottom();
    };

    chatHistory.appendChild(item);
  });
}

/* =========================
   MODE
========================= */

const modeNames = {
  smart:"Smart",
  fast:"Fast",
  deep:"Deep",
  code:"Code",
  web:"Web",
  vision:"Vision",
  files:"Files"
};

function setMode(mode){

  if(!modeNames[mode]) mode="smart";

  currentMode = mode;
  modeLabel.textContent = modeNames[mode];

  document.querySelectorAll(".mode-option")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.mode===mode
      );
    });

  saveMode();
}

modeButton.addEventListener("click",(e)=>{

  modeMenu.classList.toggle("open");
});

document.querySelectorAll(".mode-option")
.forEach(btn=>{
  btn.addEventListener("click",()=>{
    setMode(btn.dataset.mode);
    modeMenu.classList.remove("open");
  });
});

document.addEventListener("click",()=>{
  modeMenu.classList.remove("open");
});

/* =========================
   FILES
========================= */

attachBtn.addEventListener("click",()=>{
  fileInput.click();
});

fileInput.addEventListener("change",async()=>{

  const incoming = Array.from(fileInput.files || []);

  for(const file of incoming){

    if(selectedFiles.length >= MAX_FILES) break;

    if(file.size > MAX_FILE_SIZE){
      alert("الملف "+file.name+" أكبر من 20MB.");
      continue;
    }

    if(selectedFiles.some(
      f=>f.name===file.name && f.size===file.size
    )){
      continue;
    }

    try{

      const data = await fileToDataURL(file);

      selectedFiles.push({
        name:file.name,
        type:file.type || "application/octet-stream",
        size:file.size,
        data
      });

    }catch(e){
      console.error(e);
    }
  }

  renderFiles();

  fileInput.value="";
});

function fileToDataURL(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function renderFiles(){

  filePreview.innerHTML = "";

  if(selectedFiles.length===0){
    filePreview.classList.remove("show");
    return;
  }

  filePreview.classList.add("show");

  selectedFiles.forEach((file,index)=>{

    const chip = document.createElement("div");
    chip.className="file-chip";

    const name = document.createElement("span");

    name.textContent =
      file.name.length>24
        ? file.name.slice(0,21)+"..."
        : file.name;

    const remove = document.createElement("button");
    remove.textContent="×";

    remove.onclick=()=>{
      selectedFiles.splice(index,1);
      renderFiles();
    };

    chip.appendChild(name);
    chip.appendChild(remove);

    filePreview.appendChild(chip);
  });
}

/* =========================
   PAYLOAD
========================= */

function buildPayload(userText=""){

  const cleanText = String(userText || "").trim();

  return {
    message:cleanText,

    messages:messages
      .slice(-12)
      .map(m=>({
        role:m.role,
        content:String(m.content || "")
      })),

    files:selectedFiles,

    fastMode:currentMode==="fast",

    mode:
      (
        currentMode==="creative" ||
        currentMode==="reasoning" ||
        currentMode==="assistant"
      )
      ? "smart"
      : currentMode
  };
}

/* =========================
   GENERATE
========================= */

async function generateResponse(forcedText=null){

  if(isGenerating)return;

  const userText =
    forcedText !== null
      ? String(forcedText).trim()
      : messageInput.value.trim();

  if(!userText && selectedFiles.length===0){
    return;
  }

  isGenerating=true;
  sendBtn.disabled=true;

  if(welcome.parentNode===chatInner){
    welcome.remove();
  }

  if(userText){

    messages.push({
      role:"user",
      content:userText
    });

    addMessageToDOM("user",userText);
  }

  messageInput.value="";
  autoResize();

  const filesForRequest = selectedFiles.slice();

  selectedFiles=[];

  renderFiles();

  const bubble = addMessageToDOM(
    "assistant",
    ""
  );

  bubble.innerHTML =
    '<div class="typing"><i></i><i></i><i></i></div>';

  controller = new AbortController();

  const payload = buildPayload(userText);

  payload.files = filesForRequest;

  try{

    let reply="";

    try{

      reply = await streamRequest(
        payload,
        bubble,
        controller.signal
      );

    }catch(streamError){

      console.warn(
        "Streaming failed, trying normal endpoint:",
        streamError
      );

      bubble.innerHTML =
        '<div class="typing"><i></i><i></i><i></i></div>';

      reply = await normalRequest(
        payload,
        controller.signal
      );

      bubble.innerHTML = formatText(reply);
    }

    if(!reply){
      throw new Error("لم تصل إجابة من Sultan AI");
    }

    messages.push({
      role:"assistant",
      content:reply
    });

    saveMessages();

    updateHistory();

  }catch(error){

    console.error(error);

    const text =
      error?.name==="AbortError"
        ? "تم إيقاف التوليد."
        : "⚠️ "+friendlyClientError(error);

    bubble.textContent=text;

    messages.push({
      role:"assistant",
      content:text
    });

    saveMessages();

  }finally{

    isGenerating=false;
    sendBtn.disabled=false;
    controller=null;

    scrollBottom();
  }
}

/* =========================
   STREAM
========================= */

async function streamRequest(
  payload,
  bubble,
  signal
){

  const response = await fetch(
    STREAM_API,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"text/event-stream"
      },
      body:JSON.stringify(payload),
      signal
    }
  );

  if(!response.ok){

    let msg="Streaming request failed";

    try{
      const data=await response.json();
      msg=data.error || data.message || msg;
    }catch(e){}

    const error=new Error(msg);
    error.status=response.status;

    throw error;
  }

  const contentType =
    response.headers.get("content-type") || "";

  if(!contentType.includes("text/event-stream")){
    throw new Error("الخادم لم يرسل SSE");
  }

  if(!response.body){
    throw new Error("Streaming غير مدعوم");
  }

  const reader=response.body.getReader();
  const decoder=new TextDecoder("utf-8");

  let buffer="";
  let fullReply="";
  let sawDone=false;

  while(true){

    const {value,done}=await reader.read();

    if(done)break;

    buffer += decoder.decode(
      value,
      {stream:true}
    );

    const events=buffer.split(/\r?\n\r?\n/);

    buffer=events.pop() || "";

    for(const event of events){

      const parsed=parseSSEEvent(event);

      if(!parsed)continue;

      const type=parsed.type;
      const data=parsed.data || {};

      if(type==="meta"){
        continue;
      }

      if(type==="status"){
        continue;
      }

      if(type==="token"){

        const token =
          data.text ??
          data.token ??
          data.content ??
          "";

        if(token){

          fullReply += String(token);

          bubble.innerHTML =
            formatText(fullReply);

          scrollBottom();
        }

        continue;
      }

      if(type==="done"){

        sawDone=true;

        const finalText =
          data.reply ??
          data.text ??
          data.content ??
          "";

        if(finalText){

          fullReply=String(finalText);

          bubble.innerHTML =
            formatText(fullReply);

        }

        continue;
      }

      if(type==="error"){

        throw new Error(
          data.message ||
          data.error ||
          "حدث خطأ في الخادم"
        );
      }
    }
  }

  if(buffer.trim()){

    const parsed=parseSSEEvent(buffer);

    if(parsed){

      const data=parsed.data || {};

      if(parsed.type==="token"){

        const token =
          data.text ??
          data.token ??
          data.content ??
          "";

        if(token){
          fullReply+=String(token);
          bubble.innerHTML=formatText(fullReply);
        }
      }

      if(parsed.type==="done"){

        sawDone=true;

        const finalText =
          data.reply ??
          data.text ??
          data.content ??
          "";

        if(finalText){
          fullReply=String(finalText);
          bubble.innerHTML=formatText(fullReply);
        }
      }

      if(parsed.type==="error"){
        throw new Error(
          data.message ||
          data.error ||
          "حدث خطأ في الخادم"
        );
      }
    }
  }

  if(!fullReply && sawDone){
    throw new Error("وصل حدث done بدون نص");
  }

  if(!fullReply){
    throw new Error("لم تصل إجابة من Sultan AI");
  }

  return fullReply;
}

function parseSSEEvent(raw){

  const lines=raw
    .replace(/\r/g,"")
    .split("\n");

  let eventType="message";
  const dataLines=[];

  for(const line of lines){

    if(line.startsWith("event:")){
      eventType=line.slice(6).trim();
    }

    if(line.startsWith("data:")){
      dataLines.push(
        line.slice(5).trimStart()
      );
    }
  }

  if(dataLines.length===0){
    return null;
  }

  const rawData=dataLines.join("\n").trim();

  if(rawData==="[DONE]"){
    return {
      type:"done",
      data:{}
    };
  }

  try{

    return {
      type:eventType,
      data:JSON.parse(rawData)
    };

  }catch(e){

    return {
      type:eventType,
      data:{
        text:rawData
      }
    };
  }
}

/* =========================
   NORMAL
========================= */

async function normalRequest(payload,signal){

  const response=await fetch(
    NORMAL_API,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload),
      signal
    }
  );

  let data=null;

  try{
    data=await response.json();
  }catch(e){}

  if(!response.ok){

    const error=new Error(
      data?.error ||
      data?.message ||
      "فشل الطلب"
    );

    error.status=response.status;

    throw error;
  }

  const reply =
    data?.reply ??
    data?.text ??
    data?.message ??
    "";

  if(!reply){
    throw new Error(
      "لم تصل إجابة من Sultan AI"
    );
  }

  return String(reply);
}

/* =========================
   EDIT
========================= */

function editMessage(index){

  const msg=messages[index];

  if(!msg || msg.role!=="user")return;

  messageInput.value=msg.content || "";

  messages=messages.slice(0,index);

  saveMessages();
  renderMessages();

  messageInput.focus();
  autoResize();
}

window.editMessage=editMessage;

   INPUT
========================= */

messageInput.addEventListener(

);

function autoResize(){

  messageInput.style.height="auto";

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      160
    )+"px";
}

messageInput.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter" && !e.shiftKey){

      e.preventDefault();

      generateResponse();
    }
  }
);

sendBtn.addEventListener(

  ()=>generateResponse()
);

    healthBtn.textContent="◌";

    const response=await fetch(
      HEALTH_API,
      {
        cache:"no-store"
      }
    );

    const data=await response.json();

    if(response.ok && data?.success){

      statusText.textContent =
        "Sultan AI متصل";

      healthBtn.textContent="●";

    }else{
      throw new Error();
    }

    statusDot.classList.add("offline");

    statusText.textContent =

    healthBtn.textContent="○";
  }
}

healthBtn.addEventListener(

/* =========================
   ERRORS
========================= */

function friendlyClientError(error){

  const status=error?.status;

  if(status===400){
    return "الطلب غير صالح. جرّب رسالة أقصر.";
  }

  if(status===401){
    return "مفتاح الذكاء الاصطناعي غير مضبوط على الخادم.";
  }

  if(status===413){
    return "حجم الطلب كبير جداً. جرّب تقليل الملفات أو حجمها.";
  }

  if(status===429){
    return "الطلبات كثيرة حالياً. جرّب بعد قليل.";
  }

  if(status>=500){
    return "حدث خطأ في الخادم. جرّب مرة ثانية.";
  }

  if(error?.message){
    return error.message;
  }

  return "حدث خطأ غير متوقع.";
}
