<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>A S AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0d10;
      --panel: #11151a;
      --panel2: #171c22;
      --border: #252b33;
      --text: #f5f7fa;
      --muted: #9aa4af;
      --accent: #22c55e;
      --accent2: #16a34a;
      --user: #1b222a;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100dvh;
      width: 100%;
    }

    /* SIDEBAR */

    .sidebar {
      width: 280px;
      flex: none;
      background: #0f1216;
      border-left: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px 16px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #06110a;
      box-shadow: 0 8px 28px #16a34a22;
    }

    .brand strong {
      font-size: 18px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      text-align: right;
    }

    .new-chat:hover {
      border-color: #39424c;
      background: #1b2128;
    }

    .side-title {
      font-size: 11px;
      color: #68727d;
      margin: 10px 6px 0;
    }

    .history {
      overflow: auto;
      flex: 1;
    }

    .history-item {
      padding: 10px 11px;
      border-radius: 10px;
      color: #c9d0d7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 3px 0;
    }

    .history-item:hover {
      background: #171c22;
    }

    .side-footer {
      color: #69737e;
      font-size: 11px;
      padding: 8px 6px;
      line-height: 1.7;
    }

    /* MAIN */

    .main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 62px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #0d1014cc;
      backdrop-filter: blur(16px);
      z-index: 3;
    }

    .top-title {
      font-weight: 750;
    }

    .status {
      font-size: 11px;
      color: #7f8a95;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px #22c55e;
    }

    /* MESSAGES */

    .messages {
      flex: 1;
      overflow: auto;
      padding: 26px 16px 150px;
    }

    .welcome {
      max-width: 900px;
      margin: 6vh auto 0;
      text-align: center;
    }

    .welcome h1 {
      font-size: clamp(30px, 5vw, 52px);
      margin: 0 0 10px;
      letter-spacing: -1.5px;
    }

    .welcome p {
      color: var(--muted);
      margin: 0 auto 28px;
      max-width: 650px;
      line-height: 1.8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: right;
    }

    .card {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #14191f, #101419);
      padding: 17px;
      border-radius: 16px;
      transition: .2s;
      color: white;
      text-align: right;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #3a444f;
    }

    .card b {
      display: block;
      margin-bottom: 7px;
    }

    .card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .message {
      max-width: 900px;
      margin: 0 auto 18px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .message.user {
      justify-content: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      flex: none;
      font-size: 14px;
      font-weight: 800;
    }

    .assistant .avatar {
      background: #183522;
      color: #65e08b;
    }

    .user .avatar {
      background: #252b33;
      color: #dce2e8;
    }

    .bubble {
      max-width: min(780px, 85%);
      padding: 13px 15px;
      border-radius: 16px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .bubble {
      background: transparent;
      padding-right: 4px;
    }

    .user .bubble {
      background: var(--user);
      border: 1px solid #2a323b;
    }

    .tools {
      display: flex;
      gap: 5px;
      margin-top: 7px;
      direction: ltr;
    }

    .tool {
      border: 1px solid var(--border);
      background: #11161b;
      color: #9da7b1;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .tool:hover {
      color: #fff;
      background: #1a2027;
    }

    /* GENERATED IMAGE */

    .generated {
      max-width: 760px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0f1317;
      margin-top: 10px;
    }

    .generated img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      background: #090b0e;
    }

    .image-actions {
      display: flex;
      gap: 8px;
      padding: 10px;
      direction: rtl;
    }

    .primary {
      border: 0;
      background: var(--accent);
      color: #041008;
      font-weight: 800;
      padding: 9px 13px;
      border-radius: 10px;
    }

    .primary:hover {
      background: #34d469;
    }

    .secondary {
      border: 1px solid var(--border);
      background: #151a20;
      color: #e7ebef;
      padding: 9px 13px;
      border-radius: 10px;
    }

    /* COMPOSER */

    .composer-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 16px 18px;
      background: linear-gradient(transparent, #0b0d10 30%);
      z-index: 4;
    }

    .composer {
      max-width: 900px;
      margin: auto;
      border: 1px solid #303842;
      background: #12171c;
      border-radius: 18px;
      box-shadow: 0 12px 45px #0008;
      overflow: hidden;
    }

    .preview {
      display: none;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .preview.show {
      display: block;
    }

    .preview img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
    }

    .remove-preview {
      position: absolute;
      top: 8px;
      right: 8px;
      border: 0;
      background: #000b;
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      flex: none;
      border: 1px solid var(--border);
      background: #171c22;
      color: #dbe1e7;
      border-radius: 12px;
    }

    .icon-btn:hover {
      background: #20262d;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      min-height: 42px;
      max-height: 150px;
      padding: 10px 4px;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #6f7984;
    }

    .send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      background: var(--accent);
      font-size: 18px;
    }

    .send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .modebar {
      display: flex;
      gap: 7px;
      padding: 0 10px 10px;
      overflow: auto;
    }

    .mode {
      border: 1px solid var(--border);
      background: #11161b;
      color: #9ca6b0;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .mode.active {
      background: #153521;
      border-color: #2b9e50;
      color: #83eea4;
    }

    .hint {
      text-align: center;
      color: #606a74;
      font-size: 10px;
      margin-top: 7px;
    }

    /* LOADING */

    .loading {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      color: #8b96a1;
    }

    .loading i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b96a1;
      animation: loading 1s infinite;
    }

    .loading i:nth-child(2) {
      animation-delay: .15s;
    }

    .loading i:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes loading {
      50% {
        opacity: .2;
        transform: translateY(-2px);
      }
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 22px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%) translateY(15px);
      background: #20262d;
      border: 1px solid #343c46;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .sidebar {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 10;
        transform: translateX(105%);
        transition: .25s;
        box-shadow: -20px 0 50px #0008;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        padding: 0 12px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .welcome {
        margin-top: 5vh;
      }

      .messages {
        padding-left: 10px;
        padding-right: 10px;
      }

      .bubble {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">AS</div>

      <div>
        <strong>A S AI</strong>
        <small>ذكاء اصطناعي متعدد الاستخدامات</small>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      ＋ محادثة جديدة
    </button>

    <div class="side-title">
      المحادثات الأخيرة
    </div>

    <div class="history" id="historyList"></div>

    <div class="side-footer">
      A S AI يستخدم Gemini عبر الخادم.
      مفتاح API لا يتم وضعه داخل المتصفح.
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <button class="mobile-menu" id="menuBtn">
        ☰
      </button>

      <div class="top-title">
        A S AI
      </div>

      <div class="status">
        <span class="dot"></span>
        متصل
      </div>

    </header>


    <section class="messages" id="messages">

      <div class="welcome" id="welcome">

        <h1>
          شو فيني ساعدك؟
        </h1>

        <p>
          محادثة سريعة، فهم للصور، وإنشاء وتعديل الصور من نفس المكان.
        </p>


        <div class="cards">

          <button
            class="card"
            data-prompt="اشرحلي هذا الموضوع بطريقة سهلة"
          >
            <b>🧠 اسألني</b>

            <span>
              شرح، أفكار، برمجة، دراسة وأسئلة عامة.
            </span>
          </button>


          <button
            class="card"
            data-mode="image"
            data-prompt="اعمل صورة سينمائية لمدينة مستقبلية في لبنان وقت الغروب"
          >
            <b>🎨 أنشئ صورة</b>

            <span>
              اكتب وصف الصورة التي تريد إنشاءها.
            </span>
          </button>


          <button
            class="card"
            data-mode="image"
            data-prompt="حسّن جودة الصورة وحافظ على تفاصيلها الطبيعية"
          >
            <b>🖼️ عدّل صورة</b>

            <span>
              ارفع صورة واكتب التعديل المطلوب.
            </span>
          </button>

        </div>

      </div>

    </section>


    <div class="composer-wrap">

      <div class="composer">

        <div class="preview" id="preview">

          <button
            class="remove-preview"
            id="removeImage"
          >
            ×
          </button>

          <img
            id="previewImg"
            alt="الصورة المرفوعة"
          >

        </div>


        <div class="modebar">

          <button
            class="mode active"
            data-mode="chat"
          >
            💬 محادثة
          </button>

          <button
            class="mode"
            data-mode="image"
          >
            🎨 إنشاء/تعديل صورة
          </button>

        </div>


        <div class="input-row">

          <input
            type="file"
            id="fileInput"
            accept="image/*"
            hidden
          >

          <button
            class="icon-btn"
            id="uploadBtn"
            title="رفع صورة"
          >
            📎
          </button>

          <textarea
            id="prompt"
            rows="1"
            placeholder="اكتب رسالتك..."
          ></textarea>

          <button
            class="send"
            id="sendBtn"
            title="إرسال"
          >
            ➤
          </button>

        </div>

      </div>

      <div class="hint">
        A S AI قد يخطئ أحيانًا. راجع المعلومات المهمة.
      </div>

    </div>

  </main>

</div>


<div class="toast" id="toast"></div>


<script>

  const $ = selector => document.querySelector(selector);

  const messagesEl = $("#messages");
  const welcome = $("#welcome");
  const promptEl = $("#prompt");
  const sendBtn = $("#sendBtn");
  const fileInput = $("#fileInput");
  const preview = $("#preview");
  const previewImg = $("#previewImg");
  const toast = $("#toast");

  let history =
    JSON.parse(
      localStorage.getItem("asai_history") || "[]"
    );

  let currentImage = null;
  let mode = "chat";
  let busy = false;


  function saveHistory() {

    localStorage.setItem(
      "asai_history",
      JSON.stringify(history.slice(-30))
    );

  }


  function showToast(text) {

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
      setTimeout(
        () => toast.classList.remove("show"),
        2500
      );

  }


  function renderHistory() {

    const list = $("#historyList");

    list.innerHTML = "";

    history
      .filter(x => x.role === "user")
      .slice(-12)
      .reverse()
      .forEach(x => {

        const item =
          document.createElement("div");

        item.className = "history-item";

        item.textContent =
          x.content || "محادثة";

        list.appendChild(item);

      });

  }


  function scrollBottom() {

    requestAnimationFrame(() => {

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

    });

  }


  function addMessage(
    role,
    text = "",
    imageUrl = null
  ) {

    welcome.style.display = "none";


    const row =
      document.createElement("div");

    row.className =
      "message " + role;


    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      role === "assistant"
        ? "AS"
        : "أنت";


    const body =
      document.createElement("div");

    body.className = "body";


    const bubble =
      document.createElement("div");

    bubble.className = "bubble";


    if (text) {
      bubble.textContent = text;
    }


    body.appendChild(bubble);


    if (imageUrl) {

      const box =
        document.createElement("div");

      box.className = "generated";


      const img =
        document.createElement("img");

      img.src = imageUrl;

      img.alt =
        "صورة من A S AI";


      img.addEventListener(
        "click",
        () => window.open(imageUrl, "_blank")
      );


      box.appendChild(img);


      const actions =
        document.createElement("div");

      actions.className =
        "image-actions";


      const download =
        document.createElement("button");

      download.className = "primary";

      download.textContent =
        "⬇ تحميل الصورة";

      download.onclick =
        () => downloadImage(imageUrl);


      const open =
        document.createElement("button");

      open.className = "secondary";

      open.textContent =
        "🔍 تكبير";

      open.onclick =
        () => window.open(imageUrl, "_blank");


      actions.append(
        download,
        open
      );


      box.appendChild(actions);

      body.appendChild(box);

    }


    if (role === "assistant") {

      const tools =
        document.createElement("div");

      tools.className = "tools";


      const copy =
        document.createElement("button");

      copy.className = "tool";

      copy.textContent = "نسخ";


      copy.onclick = async () => {

        try {

          await navigator.clipboard.writeText(
            bubble.textContent
          );

          showToast("تم النسخ");

        } catch {

          showToast("تعذر النسخ");

        }

      };


      tools.appendChild(copy);

      body.appendChild(tools);

    }


    row.append(
      avatar,
      body
    );

    messagesEl.appendChild(row);

    scrollBottom();


    return {
      row,
      bubble,
      body
    };

  }


  async function downloadImage(url) {

    try {

      const response =
        await fetch(url);

      const blob =
        await response.blob();

      const objectUrl =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");

      a.href = objectUrl;

      a.download =
        "as-ai-image.png";


      document.body.appendChild(a);

      a.click();

      a.remove();


      setTimeout(
        () => URL.revokeObjectURL(objectUrl),
        1000
      );

    } catch {

      window.open(
        url,
        "_blank"
      );

    }

  }


  function setMode(nextMode) {

    mode = nextMode;


    document
      .querySelectorAll(".mode")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.mode === nextMode
        );

      });


    promptEl.placeholder =
      nextMode === "image"

        ? (
            currentImage
              ? "اكتب التعديل المطلوب للصورة..."
              : "اكتب وصف الصورة التي تريد إنشاءها..."
          )

        : "اكتب رسالتك...";

  }


  function clearImage() {

    currentImage = null;

    fileInput.value = "";

    preview.classList.remove("show");

    previewImg.removeAttribute("src");

    setMode(mode);

  }


  function resizeImage(
    file,
    maxSide = 1800
  ) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload = () => {

          const img =
            new Image();


          img.onload = () => {

            const scale =
              Math.min(
                1,
                maxSide /
                  Math.max(
                    img.width,
                    img.height
                  )
              );


            const canvas =
              document.createElement("canvas");


            canvas.width =
              Math.round(
                img.width * scale
              );


            canvas.height =
              Math.round(
                img.height * scale
              );


            const ctx =
              canvas.getContext("2d");


            ctx.drawImage(
              img,
              0,
              0,
              canvas.width,
              canvas.height
            );


            resolve(
              canvas.toDataURL(
                "image/jpeg",
                .88
              )
            );

          };


          img.onerror = reject;

          img.src =
            reader.result;

        };


        reader.onerror = reject;

        reader.readAsDataURL(file);

      }
    );

  }


  fileInput.addEventListener(
    "change",
    async () => {

      const file =
        fileInput.files?.[0];


      if (!file) return;


      if (!file.type.startsWith("image/")) {

        showToast(
          "الملف ليس صورة"
        );

        return;

      }


      try {

        currentImage =
          await resizeImage(file);


        previewImg.src =
          currentImage;


        preview.classList.add(
          "show"
        );


        setMode("image");

        showToast(
          "تم تجهيز الصورة"
        );

      } catch {

        showToast(
          "تعذر قراءة الصورة"
        );

      }

    }
  );


  $("#uploadBtn").onclick =
    () => fileInput.click();


  $("#removeImage").onclick =
    clearImage;


  document
    .querySelectorAll(".mode")
    .forEach(button => {

      button.onclick =
        () => setMode(
          button.dataset.mode
        );

    });


  document
    .querySelectorAll(".card")
    .forEach(card => {

      card.onclick = () => {

        if (card.dataset.mode) {

          setMode(
            card.dataset.mode
          );

        }


        promptEl.value =
          card.dataset.prompt || "";


        autoGrow();

        promptEl.focus();

      };

    });


  $("#newChat").onclick = () => {

    history = [];

    saveHistory();


    messagesEl.innerHTML = "";

    messagesEl.appendChild(
      welcome
    );

    welcome.style.display = "";


    clearImage();

    setMode("chat");

    renderHistory();


    $("#sidebar")
      .classList.remove("open");

  };


  $("#menuBtn").onclick = () => {

    $("#sidebar")
      .classList.toggle("open");

  };


  function autoGrow() {

    promptEl.style.height =
      "auto";


    promptEl.style.height =
      Math.min(
        promptEl.scrollHeight,
        150
      ) + "px";

  }


  promptEl.addEventListener(
    "input",
    autoGrow
  );


  promptEl.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        send();

      }

    }
  );


  function setBusy(value) {

    busy = value;

    sendBtn.disabled = value;


    sendBtn.textContent =
      value
        ? "…"
        : "➤";

  }


  async function send() {

    if (busy) return;


    const text =
      promptEl.value.trim();


    if (!text && !currentImage) {
      return;
    }


    const sentImage =
      currentImage;


    const userText =
      text ||
      (
        sentImage
          ? "حلل هذه الصورة."
          : ""
      );


    addMessage(
      "user",
      userText,
      sentImage && mode === "chat"
        ? sentImage
        : null
    );


    promptEl.value = "";

    autoGrow();

    setBusy(true);


    try {

      if (mode === "image") {

        await generateImage(
          userText,
          sentImage
        );

      } else {

        await chat(
          userText,
          sentImage
        );

      }

    } catch (error) {

      addMessage(
        "assistant",
        error.message ||
          "حدث خطأ."
      );

    } finally {

      setBusy(false);

      clearImage();

      renderHistory();

    }

  }


  async function chat(
    userText,
    image
  ) {

    history.push({
      role: "user",
      content: userText
    });


    saveHistory();


    const placeholder =
      addMessage(
        "assistant",
        ""
      );


    placeholder.bubble.innerHTML =
      `
      <span class="loading">
        <i></i>
        <i></i>
        <i></i>
        جاري التفكير...
      </span>
      `;


    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            messages: history,
            image: image || null
          })

        }
      );


    if (!response.ok) {

      let data = {};

      try {
        data =
          await response.json();
      } catch {}

      throw new Error(
        data.error ||
        "تعذر الاتصال بالخادم."
      );

    }


    if (!response.body) {

      throw new Error(
        "المتصفح لا يدعم الرد المتدفق."
      );

    }


    placeholder.bubble.textContent =
      "";


    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder();


    let buffer = "";

    let finalText = "";


    while (true) {

      const {
        value,
        done
      } = await reader.read();


      if (done) break;


      buffer +=
        decoder.decode(
          value,
          { stream: true }
        );


      const events =
        buffer.split("\n\n");


      buffer =
        events.pop() || "";


      for (
        const event of events
      ) {

        const line =
          event
            .split("\n")
            .find(
              x =>
                x.startsWith(
                  "data: "
                )
            );


        if (!line) continue;


        const data =
          JSON.parse(
            line.slice(6)
          );


        if (data.type === "text") {

          finalText +=
            data.text || "";


          placeholder.bubble.textContent =
            finalText;


          scrollBottom();

        }


        if (data.type === "error") {

          throw new Error(
            data.error
          );

        }

      }

    }


    if (!finalText) {

      finalText =
        "لم يصلني رد من الذكاء الاصطناعي.";

    }


    history.push({
      role: "assistant",
      content: finalText
    });


    saveHistory();

  }


  async function generateImage(
    prompt,
    image
  ) {

    const placeholder =
      addMessage(
        "assistant",
        ""
      );


    placeholder.bubble.innerHTML =
      `
      <span class="loading">
        <i></i>
        <i></i>
        <i></i>
        جاري إنشاء الصورة...
      </span>
      `;


    const response =
      await fetch(
        "/api/images",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            prompt,
            image: image || null,
            imageSize: "1K"
          })

        }
      );


    let data = {};

    try {

      data =
        await response.json();

    } catch {}


    if (!response.ok) {

      throw new Error(
        data.error ||
        "تعذر إنشاء الصورة."
      );

    }


    if (!data.image) {

      throw new Error(
        "لم تصل الصورة من Gemini."
      );

    }


    placeholder.bubble.textContent =
      "";


    const box =
      document.createElement("div");

    box.className =
      "generated";


    const img =
      document.createElement("img");

    img.src =
      data.image;

    img.alt =
      "صورة مولدة من A S AI";


    img.onclick =
      () =>
        window.open(
          data.image,
          "_blank"
        );


    box.appendChild(img);


    const actions =
      document.createElement("div");

    actions.className =
      "image-actions";


    const download =
      document.createElement("button");

    download.className =
      "primary";

    download.textContent =
      "⬇ تحميل الصورة";


    download.onclick =
      () =>
        downloadImage(
          data.image
        );


    const open =
      document.createElement("button");

    open.className =
      "secondary";

    open.textContent =
      "🔍 تكبير";


    open.onclick =
      () =>
        window.open(
          data.image,
          "_blank"
        );


    actions.append(
      download,
      open
    );


    box.appendChild(actions);


    placeholder.body.appendChild(
      box
    );


    history.push({
      role: "user",
      content: prompt
    });


    history.push({
      role: "assistant",
      content: "[تم إنشاء صورة]"
    });


    saveHistory();

  }


  function restore() {

    renderHistory();


    const recent =
      history.slice(-12);


    if (!recent.length) {
      return;
    }


    welcome.style.display =
      "none";


    recent.forEach(
      message => {

        addMessage(
          message.role,
          message.content
        );

      }
    );

  }


  restore();

</script>

</body>
</html>
