<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Sultan AI — Smart AI Assistant</title>
<meta name="description" content="Sultan AI - مساعد ذكاء اصطناعي سريع للبرمجة، التحليل، الصور والملفات.">
<meta name="theme-color" content="#080808">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#070707;
  --panel:#0e0e0f;
  --panel2:#141416;
  --panel3:#19191b;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,106,0,.18);
  --text:#f5f5f7;
  --muted:#8b8b91;
  --muted2:#5e5e64;
  --orange:#ff6800;
  --orange2:#ff9800;
  --green:#27d66f;
  --danger:#ff4d4d;
  --shadow:0 20px 70px rgba(0,0,0,.45);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Segoe UI",sans-serif;
}

body{
  -webkit-font-smoothing:antialiased;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:focus-visible,
textarea:focus-visible{
  outline:2px solid rgba(255,106,0,.55);
  outline-offset:2px;
}

/* =========================
   BACKGROUND
========================= */

.app{
  width:100%;
  height:100dvh;
  display:flex;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 75% 5%,rgba(255,106,0,.10),transparent 27%),
    radial-gradient(circle at 15% 90%,rgba(255,106,0,.045),transparent 25%),
    var(--bg);
}

.app::before{
  content:"";
  position:absolute;
  width:380px;
  height:380px;
  right:18%;
  top:-220px;
  border-radius:50%;
  background:rgba(255,106,0,.06);
  filter:blur(80px);
  pointer-events:none;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:276px;
  height:100%;
  flex-shrink:0;
  padding:18px;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(180deg,rgba(20,20,20,.96),rgba(8,8,8,.98));
  border-left:1px solid var(--border);
  z-index:30;
  transition:transform .28s cubic-bezier(.2,.8,.2,1);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:20px;
}

.brand-logo,
.welcome-logo,
.assistant-avatar{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:#111;
  font-weight:1000;
}

.brand-logo{
  width:44px;
  height:44px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  box-shadow:0 0 28px rgba(255,106,0,.24);
}

.brand-logo::after,
.welcome-logo::after,
.assistant-avatar::after{
  content:"";
  position:absolute;
  inset:-80%;
  background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.32) 50%,transparent 58%);
  transform:rotate(20deg);
  animation:shine 4.5s infinite;
}

.brand-text strong{
  display:block;
  font-size:18px;
  font-weight:900;
}

.brand-text span{
  color:#707076;
  font-size:11px;
}

.new-chat{
  width:100%;
  padding:13px;
  border-radius:13px;
  color:#111;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  font-weight:900;
  box-shadow:0 9px 30px rgba(255,106,0,.13);
  transition:transform .18s,box-shadow .18s;
}

.new-chat:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 35px rgba(255,106,0,.22);
}

.new-chat:active{
  transform:scale(.98);
}

.nav-title{
  color:#55555b;
  font-size:10px;
  letter-spacing:.08em;
  margin:20px 4px 9px;
}

.nav-item{
  width:100%;
  padding:12px;
  border-radius:11px;
  color:#aaa;
  background:transparent;
  text-align:right;
  margin-bottom:5px;
  transition:background .18s,color .18s,transform .18s;
}

.nav-item:hover,
.nav-item.active{
  color:#fff;
  background:rgba(255,255,255,.055);
}

.nav-item:hover{
  transform:translateX(-2px);
}

.creator{
  margin-top:auto;
  padding:14px;
  border-radius:15px;
  background:
    linear-gradient(145deg,rgba(255,106,0,.12),rgba(255,255,255,.025));
  border:1px solid rgba(255,106,0,.12);
}

.creator small{
  display:block;
  color:#66666c;
  font-size:9px;
  margin-bottom:5px;
}

.creator strong{
  font-size:12px;
}

/* =========================
   MAIN
========================= */

.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:67px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(7,7,7,.72);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:10;
}

.top-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:900;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 13px var(--green);
  animation:pulse 2s infinite;
}

.mode{
  color:#77777d;
  font-size:11px;
}

.menu-btn{
  display:none;
  width:40px;
  height:40px;
  border-radius:11px;
  background:rgba(255,255,255,.055);
  color:white;
  font-size:19px;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:30px 20px 190px;
  scroll-behavior:smooth;
  scrollbar-width:thin;
  scrollbar-color:#303033 transparent;
}

.chat::-webkit-scrollbar{
  width:6px;
}

.chat::-webkit-scrollbar-thumb{
  background:#29292c;
  border-radius:10px;
}

.chat-inner{
  width:100%;
  max-width:950px;
  margin:auto;
}

.welcome{
  min-height:56vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  animation:welcomeIn .55s cubic-bezier(.2,.8,.2,1);
}

.welcome-logo{
  width:82px;
  height:82px;
  border-radius:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:41px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04),
    0 0 65px rgba(255,106,0,.20);
  margin-bottom:21px;
  animation:float 4s ease-in-out infinite;
}

.welcome h1{
  font-size:clamp(30px,5vw,48px);
  line-height:1.15;
  font-weight:1000;
  margin-bottom:10px;
}

.welcome h1 span{
  color:var(--orange);
  text-shadow:0 0 30px rgba(255,106,0,.2);
}

.welcome p{
  max-width:640px;
  color:#85858b;
  line-height:1.8;
  font-size:14px;
}

.quick{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:28px;
}

.quick button{
  min-height:66px;
  border:1px solid var(--border);
  border-radius:15px;
  color:#ccc;
  background:rgba(255,255,255,.025);
  padding:13px;
  text-align:right;
  transition:
    transform .2s,
    background .2s,
    border-color .2s,
    box-shadow .2s;
}

.quick button:hover{
  transform:translateY(-3px);
  border-color:rgba(255,106,0,.28);
  background:rgba(255,106,0,.055);
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.quick button:active{
  transform:scale(.98);
}

.quick b{
  color:#f2f2f2;
  display:block;
  margin-bottom:4px;
}

.quick span{
  color:#6e6e74;
  font-size:10px;
}

/* =========================
   MESSAGES
========================= */

.message{
  display:flex;
  gap:11px;
  margin-bottom:25px;
  direction:rtl;
  animation:messageIn .25s ease both;
}

.avatar{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:11px;
  background:#19191b;
  border:1px solid var(--border);
}

.assistant-avatar{
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:#111;
  border:0;
  box-shadow:0 5px 20px rgba(255,106,0,.13);
}

.bubble-wrap{
  min-width:0;
  max-width:82%;
}

.name{
  color:#707076;
  font-size:10px;
  margin-bottom:5px;
}

.bubble{
  padding:13px 15px;
  border-radius:17px;
  line-height:1.78;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
  background:rgba(18,18,18,.92);
  border:1px solid var(--border);
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.user .bubble{
  background:
    linear-gradient(135deg,rgba(255,106,0,.15),rgba(255,106,0,.055));
  border-color:rgba(255,106,0,.14);
}

.message-actions{
  display:flex;
  gap:5px;
  margin-top:6px;
  opacity:.55;
  transition:opacity .18s;
}

.message:hover .message-actions{
  opacity:1;
}

.action-btn{
  width:28px;
  height:27px;
  border-radius:8px;
  color:#999;
  background:rgba(255,255,255,.035);
  font-size:12px;
  transition:.18s;
}

.action-btn:hover{
  color:#fff;
  background:rgba(255,255,255,.08);
}

.code-block{
  direction:ltr;
  text-align:left;
  margin:10px 0;
  padding:13px;
  overflow:auto;
  border-radius:11px;
  background:#090909;
  border:1px solid rgba(255,255,255,.08);
  font-family:Consolas,Monaco,monospace;
  font-size:12px;
  line-height:1.6;
}

/* =========================
   TYPING
========================= */

.typing{
  display:none;
  align-items:center;
  gap:6px;
  margin:5px 0 20px;
}

.typing.show{
  display:flex;
}

.dots{
  display:flex;
  gap:4px;
  padding:12px 14px;
  background:#121214;
  border:1px solid var(--border);
  border-radius:14px;
}

.dots i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#888;
  animation:dot 1.05s infinite;
}

.dots i:nth-child(2){animation-delay:.14s}
.dots i:nth-child(3){animation-delay:.28s}

/* =========================
   ATTACHMENTS
========================= */

.attachments{
  display:none;
  gap:8px;
  flex-wrap:wrap;
  max-width:950px;
  margin:0 auto 9px;
}

.attachments.show{
  display:flex;
}

.attachment{
  position:relative;
  width:82px;
  height:82px;
  border-radius:13px;
  overflow:hidden;
  background:#151517;
  border:1px solid var(--border);
  animation:messageIn .2s ease;
}

.attachment img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.file-card{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:4px;
  color:#bbb;
  padding:7px;
  text-align:center;
}

.file-icon{
  font-size:23px;
}

.file-name{
  width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:8px;
}

.remove-file{
  position:absolute;
  top:5px;
  left:5px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:rgba(0,0,0,.78);
  color:white;
  font-size:12px;
  z-index:2;
}

/* =========================
   COMPOSER
========================= */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:15px 20px 19px;
  background:linear-gradient(transparent,#070707 35%);
  z-index:5;
}

.composer{
  max-width:950px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px;
  background:rgba(18,18,19,.93);
  border:1px solid rgba(255,255,255,.095);
  border-radius:19px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  transition:border-color .2s,box-shadow .2s;
}

.composer:focus-within{
  border-color:rgba(255,106,0,.25);
  box-shadow:
    0 18px 70px rgba(0,0,0,.48),
    0 0 0 3px rgba(255,106,0,.035);
}

.attach{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:12px;
  background:#1b1b1d;
  color:#aaa;
  font-size:23px;
  transition:.18s;
}

.attach:hover{
  color:white;
  background:#252527;
  transform:rotate(8deg);
}

#fileInput{
  display:none;
}

textarea{
  flex:1;
  min-width:0;
  min-height:43px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:11px 4px;
  line-height:1.5;
  direction:rtl;
  overflow-y:auto;
}

textarea::placeholder{
  color:#626269;
}

.send{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:#111;
  font-size:18px;
  font-weight:1000;
  box-shadow:0 5px 20px rgba(255,106,0,.12);
  transition:transform .18s,box-shadow .18s,opacity .18s;
}

.send:hover:not(:disabled){
  transform:scale(1.055);
  box-shadow:0 7px 25px rgba(255,106,0,.22);
}

.send:active:not(:disabled){
  transform:scale(.94);
}

.send:disabled{
  opacity:.42;
  cursor:not-allowed;
}

.hint{
  max-width:950px;
  margin:7px auto 0;
  text-align:center;
  color:#505056;
  font-size:9px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:9px 14px;
  border-radius:11px;
  background:#1d1d20;
  border:1px solid var(--border);
  color:#ddd;
  font-size:11px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

.overlay{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    position:fixed;
    right:0;
    top:0;
    transform:translateX(105%);
    box-shadow:-20px 0 60px rgba(0,0,0,.5);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    height:60px;
    padding:0 11px;
  }

  .top-title{
    font-size:13px;
  }

  .mode{
    display:none;
  }

  .overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(2px);
    z-index:25;
  }

  .chat{
    padding:20px 11px 175px;
  }

  .bubble-wrap{
    max-width:88%;
  }

  .bubble{
    font-size:13px;
  }

  .quick{
    grid-template-columns:1fr;
    margin-top:22px;
  }

  .welcome{
    min-height:62vh;
  }

  .welcome-logo{
    width:67px;
    height:67px;
    border-radius:22px;
    font-size:33px;
  }

  .welcome h1{
    font-size:30px;
  }

  .welcome p{
    font-size:12px;
    padding:0 8px;
  }

  .composer-area{
    padding:
      9px
      9px
      calc(9px + env(safe-area-inset-bottom));
  }

  .composer{
    border-radius:17px;
    padding:8px;
  }

  .hint{
    display:none;
  }

  .attachments{
    padding:0 2px;
  }

  .attachment{
    width:72px;
    height:72px;
  }

  .message-actions{
    opacity:1;
  }
}

@media(max-width:420px){
  .avatar{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:10px;
  }

  .bubble-wrap{
    max-width:90%;
  }

  .bubble{
    padding:11px 12px;
  }

  .attach,
  .send{
    width:40px;
    height:40px;
    min-width:40px;
  }
}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}

/* =========================
   ANIMATIONS
========================= */

@keyframes welcomeIn{
  from{
    opacity:0;
    transform:translateY(14px) scale(.985);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes dot{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }
 30%{
    transform:translateY(-4px);
    opacity:1;
  }
}

@keyframes pulse{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }
  50%{
    opacity:.55;
    transform:scale(.78);
  }
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

@keyframes shine{
  0%{transform:translateX(-120%) rotate(20deg)}
  25%,100%{transform:translateX(120%) rotate(20deg)}
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">S</div>
      <div class="brand-text">
        <strong>Sultan AI</strong>
        <span>Smart AI Assistant</span>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">
      ＋ محادثة جديدة
    </button>

    <div class="nav-title">WORKSPACE</div>

    <button class="nav-item active" id="chatNav">
      💬 المحادثة
    </button>

    <button class="nav-item" id="filesNav">
      📎 الملفات والصور
    </button>

    <button class="nav-item" id="fastNav">
      ⚡ الوضع السريع
    </button>

    <div class="creator">
      <small>CREATED BY</small>
      <strong>Ali Sultan ⚡ • Ali Arandis</strong>
    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">

    <header class="topbar">

      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="فتح القائمة"
      >☰</button>

      <div class="top-title">
        <span class="status-dot"></span>
        Sultan AI Online
      </div>

      <div class="mode">
        ⚡ Lightning Mode
      </div>

    </header>

    <section class="chat" id="chat">

      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">S</div>

          <h1>
            أهلا فيك مع <span>Sultan AI</span>
          </h1>

          <p>
            مساعدك الذكي للبحث، البرمجة، تحليل الصور والملفات
            والإجابة على أسئلتك بسرعة.
          </p>

          <div class="quick">

            <button data-question="اشرحلي كيف بتقدر تساعدني">
              <b>🤖 شو بتقدر تعمل؟</b>
              <span>تعرّف على قدرات Sultan AI</span>
            </button>

            <button data-question="ما هي آخر أخبار التكنولوجيا اليوم؟">
              <b>🌐 بحث على الويب</b>
              <span>معلومات حديثة ومحدثة</span>
            </button>

            <button data-question="اكتبلي صفحة HTML احترافية من الصفر">
              <b>💻 برمجة</b>
              <span>ساعدني ببناء كود</span>
            </button>

            <button id="quickFile">
              <b>📎 تحليل ملف أو صورة</b>
              <span>ارفع ملف وخلي Sultan AI يحلله</span>
            </button>

          </div>

        </div>

        <div id="messages"></div>

        <div class="typing" id="typing">

          <div class="avatar assistant-avatar">S</div>

          <div class="dots">
            <i></i>
            <i></i>
            <i></i>
          </div>

        </div>

      </div>

    </section>

    <div class="composer-area">

      <div class="attachments" id="attachments"></div>

      <div class="composer">

        <input
          type="file"
          id="fileInput"
          accept="image/*,.pdf,.txt,.csv,.json,.js,.jsx,.ts,.tsx,.html,.htm,.css,.scss,.md,.markdown,.xml,.svg,.sql,.py,.java,.c,.cpp,.h,.hpp,.php,.sh,.yaml,.yml"
          multiple
        >

        <button
          class="attach"
          id="attachBtn"
          type="button"
          title="إضافة صورة أو ملف"
          aria-label="إضافة صورة أو ملف"
        >＋</button>

        <textarea
          id="input"
          rows="1"
          placeholder="اكتب رسالتك إلى Sultan AI..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>

        <button
          class="send"
          id="send"
          type="button"
          aria-label="إرسال"
        >➤</button>

      </div>

      <div class="hint">
        Sultan AI قد يستخدم الأدوات المناسبة حسب سؤالك.
      </div>

    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================
   STATE
========================================================= */

let conversation = [];
let selectedFiles = [];
let sending = false;
let lastUserText = "";
let toastTimer = null;

/*
  Limit frontend history.
  The server also limits history.
*/
const MAX_HISTORY = 20;
const MAX_FILES = 5;
const MAX_FILE_SIZE = 20 * 1024 * 1024;

/* =========================================================
   ELEMENTS
========================================================= */

const $ = id => document.getElementById(id);

const input = $("input");
const sendButton = $("send");
const messages = $("messages");
const welcome = $("welcome");
const typing = $("typing");
const chat = $("chat");
const attachments = $("attachments");
const fileInput = $("fileInput");
const sidebar = $("sidebar");
const overlay = $("overlay");
const toast = $("toast");

/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  toast.textContent = text;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 1800);
}

/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}

function closeSidebar(){

  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

$("menuBtn").addEventListener("click", toggleSidebar);
overlay.addEventListener("click", closeSidebar);

/* =========================================================
   FILE PICKER
========================================================= */

function openFilePicker(){

  if(sending) return;

  fileInput.click();
}

$("attachBtn").addEventListener("click", openFilePicker);
$("filesNav").addEventListener("click", openFilePicker);
$("quickFile").addEventListener("click", openFilePicker);

fileInput.addEventListener("change", event => {

  const files = Array.from(event.target.files || []);

  if(files.length){
    addSelectedFiles(files);
  }

  fileInput.value = "";
});

/* =========================================================
   FILES
========================================================= */

function addSelectedFiles(files){

  for(const file of files){

    if(selectedFiles.length >= MAX_FILES){
      showToast(`الحد الأقصى ${MAX_FILES} ملفات`);
      break;
    }

    if(file.size > MAX_FILE_SIZE){
      showToast(`${file.name} أكبر من 20MB`);
      continue;
    }

    const duplicate = selectedFiles.some(f =>
      f.name === file.name &&
      f.size === file.size &&
      f.lastModified === file.lastModified
    );

    if(duplicate) continue;

    selectedFiles.push(file);
  }

  renderAttachments();
}

function getFileIcon(file){

  const ext = file.name
    .split(".")
    .pop()
    ?.toLowerCase();

  if(["js","jsx","ts","tsx"].includes(ext)) return "💻";
  if(["html","htm"].includes(ext)) return "🌐";
  if(["css","scss"].includes(ext)) return "🎨";
  if(["json","csv"].includes(ext)) return "📊";
  if(["py","java","c","cpp","php"].includes(ext)) return "🧑‍💻";
  if(ext === "pdf") return "📕";
  if(["txt","md","markdown"].includes(ext)) return "📄";

  return "📎";
}

function renderAttachments(){

  attachments.replaceChildren();

  if(!selectedFiles.length){
    attachments.classList.remove("show");
    return;
  }

  attachments.classList.add("show");

  const fragment = document.createDocumentFragment();

  selectedFiles.forEach((file,index) => {

    const card = document.createElement("div");
    card.className = "attachment";

    const remove = document.createElement("button");

    remove.className = "remove-file";
    remove.type = "button";
    remove.textContent = "×";
    remove.title = "حذف الملف";

    remove.addEventListener("click", () => {
      selectedFiles.splice(index,1);
      renderAttachments();
    });

    card.appendChild(remove);

    if(file.type.startsWith("image/")){

      const img = document.createElement("img");
      img.alt = file.name;
      img.loading = "lazy";

      /*
        Object URL is much faster than
        converting the image to Base64
        just for the preview.
      */
      const url = URL.createObjectURL(file);

      img.src = url;

      img.addEventListener("load", () => {
        URL.revokeObjectURL(url);
      }, {once:true});

      card.appendChild(img);

    }else{

      const fileCard = document.createElement("div");
      fileCard.className = "file-card";

      const icon = document.createElement("div");
      icon.className = "file-icon";
      icon.textContent = getFileIcon(file);

      const name = document.createElement("div");
      name.className = "file-name";
      name.textContent = file.name;
      name.title = file.name;

      fileCard.append(icon,name);
      card.appendChild(fileCard);
    }

    fragment.appendChild(card);
  });

  attachments.appendChild(fragment);
}

function fileToBase64(file){

  return new Promise((resolve,reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("تعذر قراءة الملف."));

    reader.readAsDataURL(file);
  });
}

async function prepareFiles(){

  if(!selectedFiles.length) return [];

  /*
    Parallel reading is faster than
    reading files one after another.
  */
  return Promise.all(
    selectedFiles.map(async file => ({
      name:file.name,
      type:file.type || "application/octet-stream",
      size:file.size,
      data:await fileToBase64(file)
    }))
  );
}

/* =========================================================
   MESSAGE HELPERS
========================================================= */

function addMessage(role,text){

  const wrapper = document.createElement("div");
  wrapper.className = `message ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";

  if(role === "assistant"){
    avatar.classList.add("assistant-avatar");
    avatar.textContent = "S";
  }else{
    avatar.textContent = "أنت";
  }

  const bubbleWrap = document.createElement("div");
  bubbleWrap.className = "bubble-wrap";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = role === "assistant" ? "Sultan AI" : "أنت";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  /*
    textContent keeps responses safe.
  */
  bubble.textContent = text;

  bubbleWrap.append(name,bubble);

  if(role === "assistant"){
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.className = "action-btn";
    copy.type = "button";
    copy.textContent = "⧉";
    copy.title = "نسخ الرد";

    copy.addEventListener("click", async () => {

      try{
        await navigator.clipboard.writeText(text);
        showToast("تم نسخ الرد ✓");
      }catch{
        showToast("ما قدرت أنسخ الرد");
      }
    });

    const regenerate = document.createElement("button");
    regenerate.className = "action-btn";
    regenerate.type = "button";
    regenerate.textContent = "↻";
    regenerate.title = "إعادة السؤال";

    regenerate.addEventListener("click", () => {

      if(sending || !lastUserText) return;

      input.value = lastUserText;
      autoResize();
      sendMessage();
    });

    actions.append(copy,regenerate);
    bubbleWrap.appendChild(actions);
  }

  wrapper.append(avatar,bubbleWrap);
  messages.appendChild(wrapper);

  scrollToBottom();
}

function showTyping(){
  typing.classList.add("show");
  scrollToBottom();
}

function hideTyping(){
  typing.classList.remove("show");
}

function scrollToBottom(){

  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

/* =========================================================
   HISTORY
========================================================= */

function pushConversation(role,content){

  conversation.push({role,content});

  if(conversation.length > MAX_HISTORY){
    conversation =
      conversation.slice(-MAX_HISTORY);
  }
}

/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

  if(sending) return;

  const text = input.value.trim();

  if(!text && !selectedFiles.length){
    return;
  }

  sending = true;
  sendButton.disabled = true;

  welcome.style.display = "none";

  const displayFiles = selectedFiles.map(
    file => `📎 ${file.name}`
  );

  let displayText = text;

  if(displayFiles.length){
    displayText = displayText
      ? `${displayText}\n\n${displayFiles.join("\n")}`
      : displayFiles.join("\n");
  }

  addMessage("user",displayText);

  lastUserText = text;

  /*
    Store only the actual text.
  */
  pushConversation(
    "user",
    text || "حلل الملفات المرفقة."
  );

  input.value = "";
  autoResize();

  try{

    /*
      Prepare files after displaying
      the message so the UI feels instant.
    */
    const filesForServer = await prepareFiles();

    selectedFiles = [];
    renderAttachments();

    showTyping();

    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        messages:conversation,
        message:text,
        files:filesForServer
      })
    });

    let data;

    try{
      data = await response.json();
    }catch{
      throw new Error("Invalid server response");
    }

    if(!response.ok){
      throw new Error(
        data?.reply ||
        `Server error ${response.status}`
      );
    }

    const reply =
      data?.reply ||
      "ما وصلني جواب من Sultan AI.";

    hideTyping();

    addMessage("assistant",reply);

    pushConversation("assistant",reply);

  }catch(error){

    console.error("SULTAN AI:",error);

    hideTyping();

    addMessage(
      "assistant",
      "ما قدرت أحصل على رد حاليًا. جرّب إرسال السؤال مرة ثانية."
    );

  }finally{

    sending = false;
    sendButton.disabled = false;

    input.focus();
  }
}

sendButton.addEventListener("click",sendMessage);

/* =========================================================
   QUICK QUESTIONS
========================================================= */

document.querySelectorAll("[data-question]").forEach(button => {

  button.addEventListener("click",() => {

    input.value = button.dataset.question;
    autoResize();
    sendMessage();
  });
});

/* =========================================================
   TEXTAREA
========================================================= */

input.addEventListener("input",autoResize);

function autoResize(){

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight,150) + "px";
}

input.addEventListener("keydown",event => {

  if(
    event.key === "Enter" &&
    !event.shiftKey &&
    !event.isComposing
  ){

    event.preventDefault();
    sendMessage();
  }
});

/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

  if(sending) return;

  conversation = [];
  selectedFiles = [];
  lastUserText = "";

  messages.replaceChildren();

  renderAttachments();

  welcome.style.display = "flex";

  input.value = "";
  autoResize();

  closeSidebar();
  input.focus();
}

$("newChatBtn").addEventListener("click",newChat);

/* =========================================================
   NAV
========================================================= */

$("chatNav").addEventListener("click",() => {
  closeSidebar();
  input.focus();
});

$("fastNav").addEventListener("click",() => {
  closeSidebar();
  showToast("⚡ Sultan AI يعمل بالوضع السريع");
  input.focus();
});

/* =========================================================
   START
========================================================= */

autoResize();

/*
  Don't force keyboard open on mobile.
*/
if(window.innerWidth > 800){
  input.focus();
}
</script>

</body>
</html>
