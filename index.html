<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="description" content="Sultan AI - مساعد ذكاء اصطناعي متقدم">
<title>Sultan AI V8</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#080b12;
  color:#f5f7fb;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
  overflow:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  outline:none;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  touch-action:manipulation;
  user-select:none;
}

button:focus,
button:focus-visible{
  outline:none;
  box-shadow:none;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 80% -10%,
      rgba(126,87,255,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 100%,
      rgba(0,212,255,.08),
      transparent 30%
    ),
    #080b12;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:280px;
  height:100%;
  flex:none;
  border-left:1px solid rgba(255,255,255,.07);
  background:rgba(12,16,25,.92);
  backdrop-filter:blur(24px);
  display:flex;
  flex-direction:column;
  padding:18px;
  transition:.25s ease;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:15px;
  flex:none;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      145deg,
      #8b5cf6,
      #4f46e5
    );
  box-shadow:
    0 10px 35px rgba(99,102,241,.28);
}

.logo svg{
  width:31px;
  height:31px;
}

.brand-text strong{
  display:block;
  font-size:17px;
  letter-spacing:.2px;
}

.brand-text span{
  display:block;
  margin-top:2px;
  color:#8992a6;
  font-size:11px;
}

.new-chat{
  width:100%;
  min-height:48px;
  border-radius:15px;
  color:white;
  background:
    linear-gradient(
      135deg,
      #7655f5,
      #4d43d9
    );
  box-shadow:
    0 10px 25px rgba(91,74,220,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-weight:700;
  margin-bottom:18px;
}

.new-chat:active{
  transform:scale(.98);
}

.side-title{
  color:#727c91;
  font-size:11px;
  font-weight:700;
  margin:8px 5px;
}

.chat-list{
  flex:1;
  overflow:auto;
}

.empty-history{
  padding:16px 8px;
  color:#697386;
  font-size:12px;
  line-height:1.7;
}

.side-bottom{
  border-top:1px solid rgba(255,255,255,.06);
  padding-top:15px;
}

.status-card{
  padding:13px;
  border-radius:15px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
}

.status-row{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#aab2c1;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#40e6a5;
  box-shadow:0 0 12px rgba(64,230,165,.7);
}

/* =========================
   MAIN
========================= */

.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:70px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(8,11,18,.72);
  backdrop-filter:blur(22px);
  z-index:10;
}

.top-left,
.top-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.mobile-menu{
  display:none;
}

.model-pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  background:rgba(255,255,255,.035);
  color:#aeb7c8;
  font-size:12px;
}

.model-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#8b5cf6;
  box-shadow:0 0 10px rgba(139,92,246,.8);
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:rgba(255,255,255,.045);
  color:#aeb7c8;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.055);
}

.icon-btn:active{
  transform:scale(.95);
}

.icon-btn svg{
  width:19px;
  height:19px;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-behavior:smooth;
  padding:30px 18px 160px;
}

.chat-inner{
  width:min(900px,100%);
  margin:auto;
}

/* =========================
   WELCOME
========================= */

.welcome{
  min-height:calc(100dvh - 250px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px 10px;
}

.welcome-box{
  max-width:680px;
  animation:welcomeIn .5s ease;
}

@keyframes welcomeIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.hero-logo{
  width:82px;
  height:82px;
  margin:0 auto 20px;
  border-radius:26px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      145deg,
      #8b5cf6,
      #4338ca
    );
  box-shadow:
    0 25px 65px rgba(91,74,220,.35);
}

.hero-logo svg{
  width:56px;
  height:56px;
}

.welcome h1{
  margin:0;
  font-size:clamp(30px,6vw,52px);
  line-height:1.1;
  letter-spacing:-1.5px;
}

.welcome h1 span{
  background:
    linear-gradient(
      90deg,
      #b39aff,
      #6ee7ff
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.welcome p{
  margin:15px auto 0;
  max-width:560px;
  color:#8d96a9;
  font-size:15px;
  line-height:1.8;
}

.quick-grid{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.quick{
  min-height:82px;
  padding:13px;
  text-align:right;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.065);
  background:rgba(255,255,255,.035);
  color:#dce2ed;
  transition:.2s;
}

.quick:hover{
  border-color:rgba(139,92,246,.4);
  background:rgba(139,92,246,.07);
}

.quick:active{
  transform:scale(.98);
}

.quick-icon{
  width:31px;
  height:31px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(139,92,246,.13);
  margin-bottom:8px;
}

.quick-icon svg{
  width:17px;
  height:17px;
}

.quick strong{
  display:block;
  font-size:12px;
}

.quick span{
  display:block;
  margin-top:3px;
  color:#717b90;
  font-size:10px;
}

/* =========================
   MESSAGES
========================= */

.message{
  display:flex;
  gap:12px;
  margin:0 0 25px;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  flex-direction:row-reverse;
}

.avatar{
  width:35px;
  height:35px;
  flex:none;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#171d2a;
  border:1px solid rgba(255,255,255,.07);
  color:#aeb8ca;
  font-size:12px;
  font-weight:800;
}

.message.assistant .avatar{
  background:
    linear-gradient(
      145deg,
      #7052e8,
      #4434bb
    );
  color:#fff;
}

.bubble{
  max-width:min(760px,calc(100% - 50px));
  padding:14px 16px;
  border-radius:18px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
  color:#e6eaf2;
  font-size:14px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.message.user .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(108,83,230,.2),
      rgba(74,58,171,.14)
    );
  border-color:rgba(125,98,245,.2);
}

.bubble p{
  margin:0 0 10px;
}

.bubble p:last-child{
  margin-bottom:0;
}

.bubble h1,
.bubble h2,
.bubble h3{
  margin:12px 0 7px;
}

.bubble ul,
.bubble ol{
  margin:8px 0;
  padding-right:22px;
}

.bubble code{
  direction:ltr;
  unicode-bidi:embed;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
}

.inline-code{
  padding:2px 6px;
  border-radius:6px;
  background:rgba(255,255,255,.08);
  color:#d9cfff;
}

.code-wrap{
  margin:13px 0;
  overflow:hidden;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.08);
  background:#06080d;
  direction:ltr;
  text-align:left;
}

.code-head{
  height:38px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.035);
  border-bottom:1px solid rgba(255,255,255,.06);
  color:#7d879b;
  font-size:10px;
}

.copy-code{
  background:transparent;
  color:#929caf;
  font-size:11px;
  padding:5px 8px;
  border-radius:7px;
}

.code-wrap pre{
  margin:0;
  padding:14px;
  overflow:auto;
  color:#dce4f4;
  font-size:12px;
  line-height:1.65;
  white-space:pre;
}

/* =========================
   MESSAGE ACTIONS
========================= */

.message-actions{
  display:flex;
  gap:5px;
  margin-top:8px;
  opacity:.7;
}

.message.user .message-actions{
  justify-content:flex-end;
}

.action{
  width:30px;
  height:30px;
  border-radius:9px;
  color:#758095;
  background:transparent;
  display:grid;
  place-items:center;
}

.action:hover{
  background:rgba(255,255,255,.05);
  color:#c4cbd8;
}

.action svg{
  width:15px;
  height:15px;
}

/* =========================
   TYPING
========================= */

.typing{
  display:flex;
  align-items:center;
  gap:10px;
}

.typing-dots{
  display:flex;
  gap:4px;
}

.typing-dots i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#8b5cf6;
  animation:dot 1s infinite ease-in-out;
}

.typing-dots i:nth-child(2){
  animation-delay:.15s;
}

.typing-dots i:nth-child(3){
  animation-delay:.3s;
}

@keyframes dot{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  40%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* =========================
   COMPOSER
========================= */

.composer-zone{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:18px 18px max(18px,env(safe-area-inset-bottom));
  background:
    linear-gradient(
      to top,
      #080b12 65%,
      rgba(8,11,18,.92) 80%,
      transparent
    );
  pointer-events:none;
}

.composer-inner{
  width:min(900px,100%);
  margin:auto;
  pointer-events:auto;
}

.file-preview{
  display:none;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:8px;
}

.file-preview.show{
  display:flex;
}

.file-chip{
  display:flex;
  align-items:center;
  gap:7px;
  max-width:220px;
  padding:7px 9px;
  border-radius:10px;
  background:#151b27;
  border:1px solid rgba(255,255,255,.07);
  color:#aab3c3;
  font-size:11px;
}

.file-chip span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.remove-file{
  width:20px;
  height:20px;
  border-radius:6px;
  background:rgba(255,255,255,.06);
  color:#8993a5;
}

.composer{
  min-height:64px;
  border-radius:21px;
  border:1px solid rgba(255,255,255,.09);
  background:
    rgba(17,22,33,.95);
  box-shadow:
    0 20px 70px rgba(0,0,0,.45);
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:10px;
}

.attach{
  width:43px;
  height:43px;
  flex:none;
  border-radius:13px;
  color:#8994a8;
  background:rgba(255,255,255,.045);
  display:grid;
  place-items:center;
}

.attach svg{
  width:19px;
  height:19px;
}

.input{
  flex:1;
  min-width:0;
}

textarea{
  display:block;
  width:100%;
  min-height:43px;
  max-height:150px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:#edf1f8;
  padding:10px 5px;
  line-height:1.5;
}

textarea::placeholder{
  color:#626c7e;
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:2px 3px 0;
}

.fast-toggle{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 9px;
  border-radius:9px;
  color:#707b8f;
  background:transparent;
  font-size:10px;
}

.fast-toggle.active{
  color:#d2c9ff;
  background:rgba(139,92,246,.1);
}

.fast-toggle .switch{
  width:24px;
  height:14px;
  border-radius:20px;
  background:#303746;
  position:relative;
}

.fast-toggle .switch i{
  position:absolute;
  width:10px;
  height:10px;
  top:2px;
  right:2px;
  border-radius:50%;
  background:#8b94a6;
  transition:.2s;
}

.fast-toggle.active .switch{
  background:#6650d7;
}

.fast-toggle.active .switch i{
  right:12px;
  background:#fff;
}

.send{
  width:43px;
  height:43px;
  flex:none;
  border-radius:13px;
  background:#7354ed;
  color:#fff;
  display:grid;
  place-items:center;
  transition:.2s;
}

.send:hover{
  background:#8266f4;
}

.send:active{
  transform:scale(.94);
}

.send:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.send svg{
  width:19px;
  height:19px;
}

.disclaimer{
  text-align:center;
  margin-top:7px;
  color:#4f596b;
  font-size:9px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translate(-50%,15px);
  opacity:0;
  pointer-events:none;
  z-index:100;
  padding:10px 14px;
  border-radius:12px;
  background:#171d29;
  border:1px solid rgba(255,255,255,.08);
  color:#d9deea;
  font-size:12px;
  box-shadow:0 15px 45px rgba(0,0,0,.4);
  transition:.22s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

.overlay{
  display:none;
}

@media(max-width:760px){

  .sidebar{
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    width:min(310px,88vw);
    transform:translateX(105%);
    box-shadow:-25px 0 70px rgba(0,0,0,.5);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .overlay{
    position:fixed;
    inset:0;
    z-index:19;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(3px);
  }

  .overlay.show{
    display:block;
  }

  .mobile-menu{
    display:grid;
  }

  .topbar{
    height:62px;
    padding:0 12px;
  }

  .top-left{
    gap:7px;
  }

  .model-pill{
    padding:7px 9px;
    font-size:10px;
  }

  .chat{
    padding:20px 10px 150px;
  }

  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .welcome{
    min-height:calc(100dvh - 210px);
  }

  .welcome h1{
    font-size:35px;
  }

  .welcome p{
    font-size:13px;
  }

  .hero-logo{
    width:70px;
    height:70px;
    border-radius:22px;
  }

  .hero-logo svg{
    width:47px;
    height:47px;
  }

  .bubble{
    max-width:calc(100% - 42px);
    font-size:13px;
    padding:12px 13px;
  }

  .avatar{
    width:31px;
    height:31px;
    border-radius:10px;
    font-size:10px;
  }

  .message{
    gap:8px;
    margin-bottom:20px;
  }

  .composer-zone{
    padding:12px 9px max(10px,env(safe-area-inset-bottom));
  }

  .composer{
    min-height:58px;
    border-radius:18px;
    padding:7px;
  }

  .attach,
  .send{
    width:39px;
    height:39px;
    border-radius:12px;
  }

  textarea{
    min-height:39px;
    font-size:13px;
  }

  .disclaimer{
    font-size:8px;
  }
}

@media(max-width:380px){

  .model-pill span{
    display:none;
  }

  .quick{
    min-height:75px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="logo">
        <!-- Sultan AI original SVG logo -->
        <svg viewBox="0 0 64 64" fill="none"
             xmlns="http://www.w3.org/2000/svg">

          <path
            d="M45 14C40 10 34 8 27 9C18 10 12 16 12 23C12 31 18 35 27 37L35 39C40 40 42 42 42 46C42 51 37 55 30 55C23 55 17 52 13 48"
            stroke="white"
            stroke-width="6"
            stroke-linecap="round"
          />

          <path
            d="M42 10L45 5L48 10L54 11L49.5 15L50.5 21L45 18L39.5 21L40.5 15L36 11L42 10Z"
            fill="white"
          />

          <circle
            cx="50"
            cy="47"
            r="4"
            fill="#B8AAFF"
          />

        </svg>
      </div>

      <div class="brand-text">
        <strong>Sultan AI</strong>
        <span>Advanced AI Assistant</span>
      </div>

    </div>

    <button class="new-chat" id="newChat">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M12 5V19M5 12H19"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
      </svg>
      محادثة جديدة
    </button>

    <div class="side-title">المحادثة الحالية</div>

    <div class="chat-list">
      <div class="empty-history" id="historyText">
        ابدأ محادثة جديدة مع Sultan AI.
      </div>
    </div>

    <div class="side-bottom">

      <div class="status-card">

        <div class="status-row">
          <i class="status-dot"></i>
          <span id="serverStatus">جاري التحقق من الخادم...</span>
        </div>

      </div>

    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          class="icon-btn mobile-menu"
          id="menuBtn"
          aria-label="القائمة">

          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M4 7H20M4 12H20M4 17H20"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
          </svg>

        </button>

        <div class="model-pill">
          <i class="model-dot"></i>
          <span>Sultan AI • Compound</span>
        </div>

      </div>

      <div class="top-right">

        <button
          class="icon-btn"
          id="clearBtn"
          aria-label="محادثة جديدة">

          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M4 6H20M9 6V4H15V6M7 6L8 20H16L17 6M10 10V17M14 10V17"
              stroke="currentColor"

<script>
"use strict";

/* =========================================================

========================================================= */

const API_URL = "/api/chat";
const MAX_HISTORY = 24;
const MAX_FILE_SIZE = 20 * 1024 * 1024;
const MAX_TOTAL_FILE_SIZE = 45 * 1024 * 1024;

let conversation = [];
let selectedFiles = [];
let fastMode = false;
let busy = false;

/* =========================================================
   ELEMENTS
========================================================= */

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const welcome = document.getElementById("welcome");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const attachBtn =
  document.getElementById("attachBtn");

const fileInput =
  document.getElementById("fileInput");

const filePreview =
  document.getElementById("filePreview");

const fastToggle =
  document.getElementById("fastToggle");

  document.getElementById("newChat");

const clearBtn =
  document.getElementById("clearBtn");

const menuBtn =
  document.getElementById("menuBtn");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const toast =
  document.getElementById("toast");

const serverStatus =
  document.getElementById("serverStatus");

/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showToast(message){

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      () => {
        toast.classList.remove("show");
      },
      2400
    );

}


function scrollBottom(){

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


function setBusy(value){

  busy = value;

  sendBtn.disabled =
    value;

  if(value){

    sendBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none">
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="2"
          stroke-dasharray="20 30"/>
      </svg>
    `;

  }else{

    sendBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M21 3L10.5 13.5"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"/>
        <path
          d="M21 3L14.5 21L10.5 13.5L3 9.5L21 3Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"/>
      </svg>
    `;

  }

}


function autoResize(){

  messageInput.style.height =
    "auto";

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      150
    ) + "px";

}


/* =========================================================
   MARKDOWN RENDERER
========================================================= */

function renderMarkdown(text){

  let source =
    escapeHTML(text);

  const codeBlocks = [];

  source =
    source.replace(
      /```([\w+-]*)\n?([\s\S]*?)```/g,
      function(_,language,code){

        const id =
          "code_" +
          Math.random()
            .toString(36)
            .slice(2);

        codeBlocks.push({
          id,
          code
        });

        return `
          <div class="code-wrap">
            <div class="code-head">
              <span>${escapeHTML(language || "code")}</span>
              <button
                class="copy-code"
                data-copy-code="${id}">
                نسخ
              </button>
            </div>
            <pre><code>${code}</code></pre>
          </div>
        `;

      }
    );

  source =
    source.replace(
      /`([^`]+)`/g,
      '<code class="inline-code">$1</code>'
    );

  source =
    source.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );

  source =
    source.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );

  source =
    source.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );

  source =
    source.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  source =
    source.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );

  source =
    source.replace(
      /^\s*[-•] (.*)$/gm,
      "<li>$1</li>"
    );

  source =
    source.replace(
      /(<li>.*<\/li>)/gs,
      "<ul>$1</ul>"
    );

  source =
    source.replace(
      /\n{2,}/g,
      "</p><p>"
    );

  source =
    source.replace(
      /\n/g,
      "<br>"
    );

  return "<p>" + source + "</p>";

}


/* =========================================================
   MESSAGE UI
========================================================= */

function addMessage(
  role,
  content
){

  if(welcome){

    welcome.style.display =
      "none";

  }

  const message =
    document.createElement("div");

  message.className =
    "message " +
    role;

  const avatar =
    role === "assistant"
      ? `
        <div class="avatar">
          S
        </div>
      `
      : `
        <div class="avatar">
          أنت
        </div>
      `;

  const rendered =
    role === "assistant"
      ? renderMarkdown(content)
      : escapeHTML(content)
          .replace(/\n/g,"<br>");

  message.innerHTML = `

    ${avatar}

    <div>

      <div class="bubble">
        ${rendered}
      </div>

      <div class="message-actions">

        <button
          class="action copy-message"
          title="نسخ"
          data-copy-message="">

          <svg viewBox="0 0 24 24" fill="none">
            <rect
              x="8"
              y="8"
              width="11"
              height="11"
              rx="2"
              stroke="currentColor"
              stroke-width="1.7"/>
            <path
              d="M16 8V6C16 4.9 15.1 4 14 4H6C4.9 4 4 4.9 4 6V14C4 15.1 4.9 16 6 16H8"
              stroke="currentColor"
              stroke-width="1.7"/>
          </svg>

        </button>

      </div>

    </div>
  `;

  chatInner.appendChild(
    message
  );

  const copyButton =
    message.querySelector(
      ".copy-message"
    );

  copyButton.addEventListener(
    "click",
    async () => {

      await copyText(
        content
      );

      showToast(
        "تم نسخ الرسالة"
      );

    }
  );

  message
    .querySelectorAll(
      "[data-copy-code]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const code =
            button
              .closest(".code-wrap")
              ?.querySelector("code")
              ?.textContent || "";

          await copyText(
            code
          );

          button.textContent =
            "تم النسخ";

          setTimeout(
            () => {
              button.textContent =
                "نسخ";
            },
            1200
          );

        }
      );

    });

  scrollBottom();

  return message;

}


/* =========================================================
   COPY
========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch{

    const area =
      document.createElement("textarea");

    area.value =
      text;

    area.style.position =
      "fixed";

    area.style.opacity =
      "0";

    document.body.appendChild(
      area
    );

    area.focus();
    area.select();

    document.execCommand(
      "copy"
    );

    area.remove();

  }

}


/* =========================================================
   TYPING
========================================================= */

function addTyping(){

  const element =
    document.createElement("div");

  element.className =
    "message assistant";

  element.id =
    "typingMessage";

  element.innerHTML = `

    <div class="avatar">S</div>

    <div class="bubble">

      <div class="typing">

        <span>يفكر</span>

        <div class="typing-dots">
          <i></i>
          <i></i>
          <i></i>
        </div>

      </div>

    </div>
  `;

  chatInner.appendChild(
    element
  );

  scrollBottom();

}


function removeTyping(){

  document
    .getElementById(
      "typingMessage"
    )
    ?.remove();

}


/* =========================================================
   FILES
========================================================= */

function updateFilePreview(){

  filePreview.innerHTML =
    "";

  if(
    !selectedFiles.length
  ){

    filePreview.classList.remove(
      "show"
    );

    return;

  }

  filePreview.classList.add(
    "show"
  );

  selectedFiles.forEach(
    (file,index) => {

      const chip =
        document.createElement(
          "div"
        );

      chip.className =
        "file-chip";

      chip.innerHTML = `

        <span>
          ${escapeHTML(file.name)}
        </span>

        <button
          class="remove-file"
          data-index="${index}">
          ×
        </button>
      `;

      chip
        .querySelector(
          ".remove-file"
        )
        .addEventListener(
          "click",
          () => {

            selectedFiles.splice(
              index,
              1
            );

            updateFilePreview();

          }
        );

      filePreview.appendChild(
        chip
      );

    }
  );

}


function fileToBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


async function processFiles(
  files
){

  const incoming =
    Array.from(files);

  if(
    selectedFiles.length +
    incoming.length > 5
  ){

    showToast(
      "الحد الأقصى 5 ملفات."
    );

    return;

  }

  let total =
    selectedFiles.reduce(
      (sum,file) =>
        sum + file.size,
      0
    );

  for(
    const file of incoming
  ){

    if(
      file.size >
      MAX_FILE_SIZE
    ){

      showToast(
        `الملف ${file.name} أكبر من 20MB.`
      );

      continue;

    }

    if(
      total + file.size >
      MAX_TOTAL_FILE_SIZE
    ){

      showToast(
        "تجاوز الحجم الإجمالي للملفات."
      );

      break;

    }

    try{

      const data =
        await fileToBase64(
          file
        );

      selectedFiles.push({
        name:file.name,
        type:file.type ||
          "application/octet-stream",
        size:file.size,
        data
      });

      total +=
        file.size;

    }catch{

      showToast(
        `تعذر قراءة ${file.name}`
      );

    }

  }

  updateFilePreview();

}


/* =========================================================
   SEND TO SERVER
========================================================= */

async function requestAI(
  text,
  files,
  history
){

  const payload = {

    message:
      text,

    messages:
      history.slice(
        -MAX_HISTORY
      ),

    files:
      files,

    fastMode:
      fastMode

  };

  const response =
    await fetch(
      API_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );

  let data;

  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "الخادم أرسل استجابة غير صالحة."
    );

  }

  if(
    !response.ok ||
    !data.success
  ){

    throw new Error(
      data?.error ||
      "حدث خطأ في الخادم."
    );

  }

  return data;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(
  forcedText = null
){

  if(busy){
    return;
  }

  const text =
    (
      forcedText !== null
        ? forcedText
        : messageInput.value
    ).trim();

  if(
    !text &&
    !selectedFiles.length
  ){

    return;

  }

  const filesForRequest =
    selectedFiles.map(
      file => ({
        ...file
      })
    );

  /*
    مهم:
    نأخذ التاريخ القديم قبل إضافة
    رسالة المستخدم الحالية، حتى لا
    يتم إرسال الرسالة مرتين.
  */

  const historyForRequest =
    conversation
      .slice(
        -MAX_HISTORY
      )
      .map(item => ({
        role:item.role,
        content:item.content
      }));

  if(text){

    addMessage(
      "user",
      text
    );

    conversation.push({
      role:"user",
      content:text
    });

  }else{

    addMessage(
      "user",
      "تم إرفاق ملفات للتحليل."
    );

  }

  messageInput.value =
    "";

  autoResize();

  selectedFiles =
    [];

  updateFilePreview();

  closeSidebar();

  addTyping();

  setBusy(true);

  try{

    const data =
      await requestAI(
        text ||
        "حلل الملفات المرفقة.",
        filesForRequest,
        historyForRequest
      );

    removeTyping();

    addMessage(
      "assistant",
      data.reply
    );

    conversation.push({
      role:"assistant",
      content:data.reply
    });

    if(
      conversation.length >
      MAX_HISTORY
    ){

      conversation =
        conversation.slice(
          -MAX_HISTORY
        );

    }

    updateHistoryStatus();

  }catch(error){

    removeTyping();

    addMessage(
      "assistant",
      "⚠️ " +
      (
        error?.message ||
        "حدث خطأ أثناء الاتصال بالخادم."
      )
    );

    showToast(
      error?.message ||
      "تعذر الاتصال بالخادم."
    );

  }finally{

    setBusy(false);

  }

}


/* =========================================================
   NEW CHAT
========================================================= */

function resetChat(){

  conversation =
    [];

  selectedFiles =
    [];

  updateFilePreview();

  chatInner.innerHTML =
    "";

  chatInner.appendChild(
    welcome
  );

  welcome.style.display =
    "flex";

  updateHistoryStatus();

  messageInput.value =
    "";

  autoResize();

  closeSidebar();

}


/* =========================================================
   HISTORY STATUS
========================================================= */

function updateHistoryStatus(){

  if(
    conversation.length
  ){

    const lastUser =
      [...conversation]
        .reverse()
        .find(
          item =>
            item.role === "user"
        );

    document.getElementById(
      "historyText"
    ).textContent =
      lastUser?.content ||
      "المحادثة نشطة.";

  }else{

    document.getElementById(
      "historyText"
    ).textContent =
      "ابدأ محادثة جديدة مع Sultan AI.";

  }

}

   SIDEBAR
========================================================= */

function openSidebar(){

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "show"
  );

}


function closeSidebar(){

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

}


/* =========================================================
   SERVER STATUS
========================================================= */

async function checkServer(){

  try{

    const response =
      await fetch(
        "/api/health",
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      response.ok &&
      data.success
    ){

      serverStatus.textContent =
        data.configured
          ? "الخادم متصل • AI جاهز"
          : "الخادم متصل • API غير مضبوط";

    }else{

      serverStatus.textContent =
        "الخادم غير جاهز";

    }

  }catch{

    serverStatus.textContent =
      "تعذر الاتصال بالخادم";

  }

}


/* =========================================================
   EVENTS
========================================================= */

sendBtn.addEventListener(
  "click",
  () => sendMessage()
);


attachBtn.addEventListener(
  "click",
  () => fileInput.click()
);


fileInput.addEventListener(
  "change",
  async event => {

    await processFiles(
      event.target.files
    );

    fileInput.value =
      "";

  }
);


messageInput.addEventListener(
  "input",
  autoResize
);


messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


fastToggle.addEventListener(
  "click",
  () => {

    fastMode =
      !fastMode;

    fastToggle.classList.toggle(
      "active",
      fastMode
    );

    showToast(
      fastMode
        ? "تم تشغيل الوضع السريع"
        : "تم إيقاف الوضع السريع"
    );

  }
);


newChat.addEventListener(
  "click",
  resetChat
);


clearBtn.addEventListener(
  "click",
  resetChat
);


menuBtn.addEventListener(
  "click",
  openSidebar
);


overlay.addEventListener(
  "click",
  closeSidebar
);


/* =========================================================
   QUICK PROMPTS
========================================================= */

document
  .querySelectorAll(
    ".quick"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          messageInput.value =
            button.dataset.prompt ||
            "";

          autoResize();

          messageInput.focus();

        }
      );

    }
  );


/* =========================================================
   INIT
========================================================= */

updateHistoryStatus();
autoResize();
checkServer();

</script>

</body>
</html>
