<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Sultan AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --panel: #101010;
      --panel2: #151515;
      --border: rgba(255,255,255,.08);
      --text: #f5f5f5;
      --muted: #999;
      --orange: #ff6a00;
      --orange2: #ff8a00;
      --danger: #ff4444;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Arial,
        "Segoe UI",
        sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       APP
    ===================================================== */

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(255,106,0,.08),
          transparent 30%
        ),
        #080808;
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      width: 270px;
      height: 100%;
      flex-shrink: 0;
      background:
        linear-gradient(
          180deg,
          #111,
          #0a0a0a
        );
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px;
      z-index: 20;
      transition: transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          var(--orange),
          var(--orange2)
        );
      color: #111;
      font-size: 23px;
      font-weight: 1000;
      box-shadow:
        0 0 25px rgba(255,106,0,.25);
    }

    .brand-text strong {
      display: block;
      font-size: 18px;
      font-weight: 900;
    }

    .brand-text span {
      color: #777;
      font-size: 11px;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border-radius: 13px;
      color: white;
      background:
        linear-gradient(
          135deg,
          #ff6500,
          #ff8b00
        );
      font-weight: 900;
      margin-bottom: 16px;
      box-shadow:
        0 8px 25px rgba(255,106,0,.12);
    }

    .nav-title {
      color: #666;
      font-size: 11px;
      margin: 10px 4px;
    }

    .nav-item {
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      color: #bbb;
      background: transparent;
      text-align: right;
      margin-bottom: 5px;
      transition: .2s;
    }

    .nav-item:hover,
    .nav-item.active {
      color: white;
      background: rgba(255,255,255,.06);
    }

    .creator {
      margin-top: auto;
      padding: 14px;
      border-radius: 15px;
      background:
        linear-gradient(
          145deg,
          rgba(255,106,0,.13),
          rgba(255,255,255,.025)
        );
      border: 1px solid rgba(255,106,0,.12);
    }

    .creator small {
      display: block;
      color: #777;
      font-size: 10px;
      margin-bottom: 5px;
    }

    .creator strong {
      font-size: 13px;
    }

    /* =====================================================
       MAIN
    ===================================================== */

    .main {
      min-width: 0;
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 67px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(8,8,8,.82);
      backdrop-filter: blur(15px);
      z-index: 10;
    }

    .top-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 900;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #25d366;
      box-shadow: 0 0 10px #25d366;
    }

    .mode {
      color: #aaa;
      font-size: 12px;
    }

    /* =====================================================
       MOBILE MENU
    ===================================================== */

    .menu-btn {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: white;
      font-size: 20px;
    }

    /* =====================================================
       CHAT
    ===================================================== */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px 180px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      max-width: 950px;
      margin: auto;
    }

    .welcome {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeUp .4s ease;
    }

    .welcome-logo {
      width: 78px;
      height: 78px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          var(--orange),
          var(--orange2)
        );
      color: #111;
      font-size: 40px;
      font-weight: 1000;
      box-shadow:
        0 0 55px rgba(255,106,0,.23);
      margin-bottom: 22px;
    }

    .welcome h1 {
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 1000;
      margin-bottom: 9px;
    }

    .welcome h1 span {
      color: var(--orange);
    }

    .welcome p {
      max-width: 620px;
      color: #888;
      line-height: 1.7;
      font-size: 14px;
    }

    .quick {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 28px;
    }

    .quick button {
      min-height: 64px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: #ccc;
      background: rgba(255,255,255,.025);
      padding: 12px;
      text-align: right;
      transition: .2s;
    }

    .quick button:hover {
      border-color: rgba(255,106,0,.3);
      background: rgba(255,106,0,.05);
      transform: translateY(-2px);
    }

    .quick b {
      color: white;
      display: block;
      margin-bottom: 4px;
    }

    .quick span {
      color: #777;
      font-size: 11px;
    }

    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      direction: rtl;
      animation: fadeUp .25s ease;
    }

    .message.user {
      flex-direction: row;
    }

    .message.assistant {
      flex-direction: row;
    }

    .avatar {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      background: #191919;
      border: 1px solid var(--border);
    }

    .assistant .avatar {
      background:
        linear-gradient(
          135deg,
          var(--orange),
          var(--orange2)
        );
      color: #111;
    }

    .bubble-wrap {
      min-width: 0;
      max-width: 82%;
    }

    .name {
      color: #777;
      font-size: 10px;
      margin-bottom: 5px;
    }

    .bubble {
      padding: 13px 15px;
      border-radius: 16px;
      line-height: 1.75;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      background: #121212;
      border: 1px solid var(--border);
    }

    .user .bubble {
      background:
        linear-gradient(
          135deg,
          rgba(255,106,0,.16),
          rgba(255,106,0,.07)
        );
      border-color:
        rgba(255,106,0,.13);
    }

    /* =====================================================
       ATTACHMENT PREVIEW
    ===================================================== */

    .attachments {
      display: none;
      gap: 9px;
      flex-wrap: wrap;
      margin: 0 auto 9px;
      max-width: 950px;
    }

    .attachments.show {
      display: flex;
    }

    .attachment {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 13px;
      overflow: hidden;
      background: #151515;
      border: 1px solid var(--border);
    }

    .attachment img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-card {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      color: #bbb;
      padding: 7px;
      text-align: center;
    }

    .file-icon {
      font-size: 25px;
    }

    .file-name {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 9px;
    }

    .remove-file {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,.8);
      color: white;
      font-size: 12px;
      z-index: 2;
    }

    /* =====================================================
       TYPING
    ===================================================== */

    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      margin: 5px 0 20px;
    }

    .typing.show {
      display: flex;
    }

    .typing .avatar {
      background:
        linear-gradient(
          135deg,
          var(--orange),
          var(--orange2)
        );
      color: #111;
    }

    .dots {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
      background: #121212;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #888;
      animation: dot 1.1s infinite;
    }

    .dots i:nth-child(2) {
      animation-delay: .15s;
    }

    .dots i:nth-child(3) {
      animation-delay: .3s;
    }

    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 20px 20px;
      background:
        linear-gradient(
          transparent,
          #080808 35%
        );
    }

    .composer {
      max-width: 950px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 10px;
      background: rgba(18,18,18,.95);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;
      box-shadow:
        0 15px 50px rgba(0,0,0,.4);
      backdrop-filter: blur(18px);
    }

    .attach {
      width: 43px;
      height: 43px;
      min-width: 43px;
      border-radius: 12px;
      background: #1c1c1c;
      color: #aaa;
      font-size: 25px;
      transition: .2s;
    }

    .attach:hover {
      color: white;
      background: #252525;
    }

    #fileInput {
      display: none;
    }

    textarea {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      min-height: 43px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 11px 4px;
      line-height: 1.5;
      direction: rtl;
    }

    textarea::placeholder {
      color: #666;
    }

    .send {
      width: 43px;
      height: 43px;
      min-width: 43px;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          var(--orange),
          var(--orange2)
        );
      color: #111;
      font-size: 18px;
      font-weight: 1000;
      transition: .2s;
    }

    .send:hover {
      transform: scale(1.04);
    }

    .send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .hint {
      max-width: 950px;
      margin: 8px auto 0;
      text-align: center;
      color: #555;
      font-size: 9px;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    .overlay {
      display: none;
    }

    @media (max-width: 800px) {

      .sidebar {
        position: fixed;
        right: 0;
        top: 0;
        transform: translateX(105%);
        box-shadow: -20px 0 50px rgba(0,0,0,.45);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-btn {
        display: block;
      }

      .topbar {
        padding: 0 12px;
      }

      .top-title {
        font-size: 13px;
      }

      .mode {
        display: none;
      }

      .overlay.show {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.6);
        z-index: 15;
      }

      .chat {
        padding-left: 12px;
        padding-right: 12px;
        padding-top: 20px;
      }

      .bubble-wrap {
        max-width: 88%;
      }

      .quick {
        grid-template-columns: 1fr;
      }

      .composer-area {
        padding:
          10px
          10px
          calc(10px + env(safe-area-inset-bottom));
      }

      .composer {
        border-radius: 16px;
      }

      .hint {
        display: none;
      }

      .welcome {
        min-height: 60vh;
      }

      .welcome-logo {
        width: 66px;
        height: 66px;
        font-size: 33px;
      }
    }

    /* =====================================================
       ANIMATIONS
    ===================================================== */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dot {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .45;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ===================================================
       SIDEBAR
  ==================================================== -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">S</div>

      <div class="brand-text">
        <strong>Sultan AI</strong>
        <span>Smart AI Assistant</span>
      </div>
    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ محادثة جديدة
    </button>

    <div class="nav-title">
      WORKSPACE
    </div>

    <button
      class="nav-item active"
      onclick="focusComposer()"
    >
      💬 المحادثة
    </button>

    <button
      class="nav-item"
      onclick="openFilePicker()"
    >
      📎 الملفات والصور
    </button>

    <button
      class="nav-item"
      onclick="focusComposer()"
    >
      ⚡ الوضع السريع
    </button>

    <div class="creator">

      <small>
        CREATED BY
      </small>

      <strong>
        Ali Sultan ⚡ • Ali Arandis
      </strong>

    </div>

  </aside>

  <div
    class="overlay"
    id="overlay"
    onclick="closeSidebar()"
  ></div>

  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="main">

    <header class="topbar">

      <button
        class="menu-btn"
        onclick="toggleSidebar()"
        aria-label="Menu"
      >
        ☰
      </button>

      <div class="top-title">
        <span class="status-dot"></span>
        Sultan AI Online
      </div>

      <div class="mode">
        ⚡ Lightning Mode
      </div>

    </header>

    <!-- =================================================
         CHAT
    ================================================== -->

    <section
      class="chat"
      id="chat"
    >

      <div
        class="chat-inner"
        id="chatInner"
      >

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            S
          </div>

          <h1>
            أهلا فيك مع
            <span>Sultan AI</span>
          </h1>

          <p>
            مساعدك الذكي للبحث، البرمجة، تحليل الصور والملفات
            والإجابة على أسئلتك بسرعة.
          </p>

          <div class="quick">

            <button
              onclick="quickAsk('اشرحلي كيف بتقدر تساعدني')"
            >
              <b>🤖 شو بتقدر تعمل؟</b>
              <span>تعرّف على قدرات Sultan AI</span>
            </button>

            <button
              onclick="quickAsk('ما هي آخر أخبار التكنولوجيا اليوم؟')"
            >
              <b>🌐 بحث على الويب</b>
              <span>معلومات حديثة ومحدثة</span>
            </button>

            <button
              onclick="quickAsk('اكتبلي صفحة HTML احترافية من الصفر')"
            >
              <b>💻 برمجة</b>
              <span>ساعدني ببناء كود</span>
            </button>

            <button
              onclick="openFilePicker()"
            >
              <b>📎 تحليل ملف أو صورة</b>
              <span>ارفع ملف وخلي Sultan AI يحلله</span>
            </button>

          </div>

        </div>

        <div
          id="messages"
        ></div>

        <div
          class="typing"
          id="typing"
        >

          <div class="avatar">
            S
          </div>

          <div class="dots">
            <i></i>
            <i></i>
            <i></i>
          </div>

        </div>

      </div>

    </section>

    <!-- =================================================
         COMPOSER
    ================================================== -->

    <div class="composer-area">

      <div
        class="attachments"
        id="attachments"
      ></div>

      <div class="composer">

        <input
          type="file"
          id="fileInput"
          accept="image/*,.pdf,.txt,.csv,.json,.js,.jsx,.ts,.tsx,.html,.htm,.css,.scss,.md,.markdown,.xml,.svg,.sql,.py,.java,.c,.cpp,.h,.hpp,.php,.sh,.yaml,.yml"
          multiple
        >

        <button
          class="attach"
          type="button"
          onclick="openFilePicker()"
          aria-label="Add image or file"
          title="إضافة صورة أو ملف"
        >
          ＋
        </button>

        <textarea
          id="input"
          rows="1"
          placeholder="اكتب رسالتك إلى Sultan AI..."
          autocomplete="off"
        ></textarea>

        <button
          class="send"
          id="send"
          type="button"
          onclick="sendMessage()"
          aria-label="Send"
        >
          ➤
        </button>

      </div>

      <div class="hint">
        Sultan AI قد يستخدم البحث والبرمجة والأدوات المناسبة حسب سؤالك.
      </div>

    </div>

  </main>

</div>

<script>
/* =========================================================
   STATE
========================================================= */

let conversation = [];

let selectedFiles = [];

let sending = false;

/* =========================================================
   ELEMENTS
========================================================= */

const input =
  document.getElementById("input");

const sendButton =
  document.getElementById("send");

const messages =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");

const typing =
  document.getElementById("typing");

const chat =
  document.getElementById("chat");

const attachments =
  document.getElementById("attachments");

const fileInput =
  document.getElementById("fileInput");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

/* =========================================================
   FILE PICKER
========================================================= */

function openFilePicker() {

  if (sending) {
    return;
  }

  fileInput.click();
}

fileInput.addEventListener(
  "change",
  event => {

    const files =
      Array.from(
        event.target.files || []
      );

    if (!files.length) {
      return;
    }

    addSelectedFiles(files);

    /*
      Reset input so selecting
      the same file again works.
    */

    fileInput.value = "";

  }
);

/* =========================================================
   ADD FILES
========================================================= */

function addSelectedFiles(files) {

  const maxFiles = 5;

  for (const file of files) {

    if (
      selectedFiles.length >=
      maxFiles
    ) {
      break;
    }

    /*
      20MB maximum per file.
    */

    if (
      file.size >
      20 * 1024 * 1024
    ) {

      alert(
        `الملف ${file.name} أكبر من 20MB.`
      );

      continue;
    }

    const duplicate =
      selectedFiles.some(
        f =>
          f.name === file.name &&
          f.size === file.size &&
          f.lastModified ===
            file.lastModified
      );

    if (duplicate) {
      continue;
    }

    selectedFiles.push(file);
  }

  renderAttachments();
}

/* =========================================================
   RENDER FILES
========================================================= */

function renderAttachments() {

  attachments.innerHTML = "";

  if (!selectedFiles.length) {

    attachments.classList.remove(
      "show"
    );

    return;
  }

  attachments.classList.add(
    "show"
  );

  selectedFiles.forEach(
    (file, index) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "attachment";

      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "remove-file";

      remove.type = "button";

      remove.textContent =
        "×";

      remove.onclick =
        () => removeFile(index);

      card.appendChild(remove);

      if (
        file.type.startsWith(
          "image/"
        )
      ) {

        const img =
          document.createElement(
            "img"
          );

        const reader =
          new FileReader();

        reader.onload =
          event => {
            img.src =
              event.target.result;
          };

        reader.readAsDataURL(file);

        card.appendChild(img);

      } else {

        const fileCard =
          document.createElement(
            "div"
          );

        fileCard.className =
          "file-card";

        const icon =
          document.createElement(
            "div"
          );

        icon.className =
          "file-icon";

        icon.textContent =
          getFileIcon(file);

        const name =
          document.createElement(
            "div"
          );

        name.className =
          "file-name";

        name.textContent =
          file.name;

        fileCard.appendChild(icon);
        fileCard.appendChild(name);

        card.appendChild(
          fileCard
        );
      }

      attachments.appendChild(
        card
      );

    }
  );
}

/* =========================================================
   FILE ICON
========================================================= */

function getFileIcon(file) {

  const ext =
    file.name
      .split(".")
      .pop()
      ?.toLowerCase();

  if (
    [
      "js",
      "jsx",
      "ts",
      "tsx"
    ].includes(ext)
  ) {
    return "💻";
  }

  if (
    [
      "html",
      "htm"
    ].includes(ext)
  ) {
    return "🌐";
  }

  if (
    [
      "css",
      "scss"
    ].includes(ext)
  ) {
    return "🎨";
  }

  if (
    [
      "json",
      "csv"
    ].includes(ext)
  ) {
    return "📊";
  }

  if (
    [
      "py",
      "java",
      "c",
      "cpp",
      "php"
    ].includes(ext)
  ) {
    return "🧑‍💻";
  }

  if (ext === "pdf") {
    return "📕";
  }

  if (
    [
      "txt",
      "md",
      "markdown"
    ].includes(ext)
  ) {
    return "📄";
  }

  return "📎";
}

/* =========================================================
   REMOVE FILE
========================================================= */

function removeFile(index) {

  selectedFiles.splice(
    index,
    1
  );

  renderAttachments();
}

/* =========================================================
   FILE TO BASE64
========================================================= */

function fileToBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => {

          const result =
            String(
              reader.result || ""
            );

          /*
            Server accepts either
            full data URL or Base64.
          */

          resolve(result);
        };

      reader.onerror =
        () => {

          reject(
            new Error(
              "تعذر قراءة الملف."
            )
          );

        };

      reader.readAsDataURL(file);

    }
  );
}

/* =========================================================
   PREPARE FILES
========================================================= */

async function prepareFiles() {

  const output = [];

  for (
    const file of selectedFiles
  ) {

    const data =
      await fileToBase64(file);

    output.push({

      name:
        file.name,

      type:
        file.type ||
        "application/octet-stream",

      size:
        file.size,

      data

    });
  }

  return output;
}

/* =========================================================
   QUICK ASK
========================================================= */

function quickAsk(text) {

  input.value = text;

  autoResize();

  sendMessage();
}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  if (sending) {
    return;
  }

  const text =
    input.value.trim();

  if (
    !text &&
    !selectedFiles.length
  ) {
    return;
  }

  sending = true;

  sendButton.disabled = true;

  welcome.style.display =
    "none";

  const filesForServer =
    await prepareFiles();

  /*
    Display user message.
  */

  let displayText =
    text;

  if (
    selectedFiles.length
  ) {

    const fileNames =
      selectedFiles
        .map(
          file =>
            `📎 ${file.name}`
        )
        .join("\n");

    displayText =
      displayText
        ? `${displayText}\n\n${fileNames}`
        : fileNames;
  }

  addMessage(
    "user",
    displayText
  );

  /*
    Keep text conversation history.
  */

  conversation.push({
    role: "user",
    content:
      text ||
      "حلل الملفات المرفقة."
  });

  input.value = "";

  autoResize();

  renderAttachments();

  showTyping();

  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              messages:
                conversation,

              message:
                text,

              files:
                filesForServer

            })
        }
      );

    let data = null;

    try {
      data =
        await response.json();
    }

    catch {
      throw new Error(
        "Invalid server response"
      );
    }

    if (!response.ok) {

      throw new Error(
        data?.reply ||
        "Server error"
      );
    }

    const reply =
      data?.reply ||
      "ما وصلني جواب من Sultan AI.";

    hideTyping();

    addMessage(
      "assistant",
      reply
    );

    conversation.push({
      role: "assistant",
      content: reply
    });

    /*
      Clear selected files
      after successful request.
    */

    selectedFiles = [];

    renderAttachments();

  }

  catch (error) {

    console.error(
      "SULTAN AI:",
      error
    );

    hideTyping();

    addMessage(
      "assistant",
      "⚠️ صار خطأ بالاتصال مع Sultan AI.\n\n" +
      (
        error?.message ||
        "جرّب مرة ثانية."
      )
    );

  }

  finally {

    sending = false;

    sendButton.disabled =
      false;

    input.focus();

  }
}

/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  role,
  text
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    `message ${role}`;

  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "assistant"
      ? "S"
      : "أنت";

  const bubbleWrap =
    document.createElement(
      "div"
    );

  bubbleWrap.className =
    "bubble-wrap";

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "name";

  name.textContent =
    role === "assistant"
      ? "Sultan AI"
      : "أنت";

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  /*
    textContent prevents
    uploaded content from
    becoming executable HTML.
  */

  bubble.textContent =
    text;

  bubbleWrap.appendChild(name);
  bubbleWrap.appendChild(bubble);

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubbleWrap);

  messages.appendChild(wrapper);

  scrollToBottom();
}

/* =========================================================
   TYPING
========================================================= */

function showTyping() {

  typing.classList.add(
    "show"
  );

  scrollToBottom();
}

function hideTyping() {

  typing.classList.remove(
    "show"
  );
}

/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );
}

/* =========================================================
   TEXTAREA
========================================================= */

input.addEventListener(
  "input",
  autoResize
);

function autoResize() {

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";
}

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

  conversation = [];

  selectedFiles = [];

  messages.innerHTML = "";

  renderAttachments();

  welcome.style.display =
    "flex";

  input.value = "";

  autoResize();

  closeSidebar();

  input.focus();

}

/* =========================================================
   FOCUS
========================================================= */

function focusComposer() {

  closeSidebar();

  input.focus();

}

/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

  sidebar.classList.toggle(
    "open"
  );

  overlay.classList.toggle(
    "show"
  );
}

function closeSidebar() {

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );
}

/* =========================================================
   START
========================================================= */

input.focus();

</script>
