<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AS AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --panel: #f7f7f5;
      --panel-2: #efefec;
      --text: #242424;
      --muted: #77746e;
      --border: #e4e2dd;
      --accent: #c96f45;
      --accent-dark: #ad5933;
      --user: #f0eee9;
      --shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    body.dark {
      --bg: #171716;
      --panel: #20201e;
      --panel-2: #292927;
      --text: #eeeeea;
      --muted: #a3a19a;
      --border: #353531;
      --accent: #e48b60;
      --accent-dark: #c96f45;
      --user: #292927;
      --shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      transition: .25s ease;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 8px 9px 22px;
    }

    .brand-logo {
      width: 37px;
      height: 37px;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      box-shadow: var(--shadow);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.4px;
    }

    .new-chat {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 11px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      transition: .2s;
    }

    .new-chat:hover {
      background: var(--panel-2);
    }

    .section-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 25px 10px 9px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 10px 11px;
      border-radius: 9px;
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .chat-item:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    .bottom {
      border-top: 1px solid var(--border);
      padding-top: 13px;
      display: flex;
      gap: 7px;
    }

    .small-btn {
      flex: 1;
      background: transparent;
      border-radius: 9px;
      padding: 10px 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .small-btn:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 62px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: var(--bg);
    }

    .mobile-menu {
      display: none;
      background: transparent;
      font-size: 22px;
      margin-right: 12px;
    }

    .model {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 650;
      color: var(--text);
    }

    .model-dot {
      width: 8px;
      height: 8px;
      background: #55a66b;
      border-radius: 50%;
    }

    .top-actions {
      display: flex;
      gap: 5px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      background: transparent;
      border-radius: 9px;
      font-size: 18px;
    }

    .icon-btn:hover {
      background: var(--panel);
    }

    /* CHAT */

    .messages {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 38px 20px 150px;
    }

    .conversation {
      width: min(820px, 100%);
      margin: auto;
    }

    .welcome {
      min-height: 62vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      padding: 20px;
    }

    .welcome-mark {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .welcome h1 {
      font-size: clamp(28px, 5vw, 43px);
      letter-spacing: -1.5px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      max-width: 500px;
      line-height: 1.6;
      font-size: 15px;
    }

    .message {
      display: flex;
      flex-direction: column;
      margin-bottom: 30px;
      animation: appear .2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-items: flex-end;
    }

    .message.ai {
      align-items: flex-start;
    }

    .message-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 7px;
      padding: 0 4px;
    }

    .bubble {
      max-width: min(720px, 92%);
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: var(--user);
      padding: 12px 16px;
      border-radius: 17px;
    }

    .ai .bubble {
      padding: 2px 4px;
    }

    .message-image {
      max-width: 300px;
      max-height: 300px;
      border-radius: 13px;
      margin-bottom: 9px;
      border: 1px solid var(--border);
    }

    /* COMPOSER */

    .composer-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px 13px;
      background: linear-gradient(
        transparent,
        var(--bg) 24%
      );
    }

    .composer-wrap {
      width: min(820px, 100%);
      margin: auto;
    }

    .composer {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 17px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .preview {
      display: none;
      padding: 12px 13px 0;
    }

    .preview.active {
      display: block;
    }

    .preview-box {
      position: relative;
      display: inline-block;
    }

    .preview img {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .remove-image {
      position: absolute;
      right: -7px;
      top: -7px;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      font-size: 12px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 55px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 17px 17px 5px;
      line-height: 1.5;
      font-size: 15px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 9px 9px;
    }

    .composer-left,
    .composer-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tool-btn {
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
    }

    .tool-btn:hover {
      background: var(--panel);
      color: var(--text);
    }

    .send {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    .send:hover {
      background: var(--accent-dark);
    }

    .send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding-top: 8px;
    }

    /* RESPONSIVE */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        z-index: 20;
        left: -285px;
        top: 0;
        bottom: 0;
        box-shadow: var(--shadow);
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: inline-block;
      }

      .topbar {
        padding: 0 13px;
      }

      .messages {
        padding: 25px 13px 145px;
      }

      .composer-area {
        padding: 12px 10px 9px;
      }

      .welcome {
        min-height: 55vh;
      }

      .welcome h1 {
        font-size: 31px;
      }

      .bubble {
        font-size: 14px;
      }

      .model {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">AS</div>
      <div class="brand-name">AS AI</div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ <span>New chat</span>
    </button>

    <div class="section-title">Recent chats</div>

    <div class="chat-list" id="chatList">
      <div class="chat-item">Welcome to AS AI</div>
    </div>

    <div class="bottom">
      <button class="small-btn" onclick="toggleTheme()">◐ Theme</button>
      <button class="small-btn" onclick="showAbout()">ⓘ About</button>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;">
        <button class="mobile-menu" onclick="toggleSidebar()">☰</button>

        <div class="model">
          <span class="model-dot"></span>
          AS AI
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" title="New chat" onclick="newChat()">＋</button>
      </div>

    </header>

    <!-- MESSAGES -->
    <section class="messages" id="messages">

      <div class="conversation" id="conversation">

        <div class="welcome" id="welcome">

          <div class="welcome-mark">AS</div>

          <h1>How can I help?</h1>

          <p>
            Ask anything, write code, analyze an image,
            or start a new conversation with AS AI.
          </p>

        </div>

      </div>

    </section>

    <!-- COMPOSER -->
    <div class="composer-area">

      <div class="composer-wrap">

        <div class="composer">

          <div class="preview" id="preview">
            <div class="preview-box">
              <img id="previewImg" alt="Selected image">
              <button class="remove-image" onclick="removeImage()">×</button>
            </div>
          </div>

          <textarea
            id="prompt"
            placeholder="Message AS AI..."
            rows="1"
            oninput="autoResize(this)"
            onkeydown="handleKey(event)"
          ></textarea>

          <div class="composer-bottom">

            <div class="composer-left">

              <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
                onchange="selectImage(event)"
              >

              <button
                class="tool-btn"
                onclick="document.getElementById('imageInput').click()"
                title="Upload image"
              >
                ＋ Attach
              </button>

            </div>

            <div class="composer-right">
              <button
                class="send"
                id="sendBtn"
                onclick="sendMessage()"
                title="Send"
              >
                ↑
              </button>
            </div>

          </div>

        </div>

        <div class="disclaimer">
          AS AI can make mistakes. Check important information.
          <br>
          © 2026 Ali Sultan & Ali Arandis
        </div>

      </div>

    </div>

  </main>

</div>

<script>

  const promptBox = document.getElementById("prompt");
  const messages = document.getElementById("messages");
  const conversation = document.getElementById("conversation");
  const welcome = document.getElementById("welcome");
  const sendBtn = document.getElementById("sendBtn");

  let selectedImage = null;
  let busy = false;

  /* THEME */

  function toggleTheme() {
    document.body.classList.toggle("dark");

    localStorage.setItem(
      "asai-theme",
      document.body.classList.contains("dark")
        ? "dark"
        : "light"
    );
  }

  if (localStorage.getItem("asai-theme") === "dark") {
    document.body.classList.add("dark");
  }

  /* SIDEBAR */

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
  }

  /* NEW CHAT */

  function newChat() {
    conversation.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-mark">AS</div>
        <h1>How can I help?</h1>
        <p>
          Ask anything, write code, analyze an image,
          or start a new conversation with AS AI.
        </p>
      </div>
    `;

    promptBox.value = "";
    removeImage();
    promptBox.focus();
  }

  /* TEXTAREA */

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 180) + "px";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  /* IMAGE */

  function selectImage(event) {
    const file = event.target.files[0];

    if (!file) return;

    selectedImage = file;

    const reader = new FileReader();

    reader.onload = function(e) {
      document.getElementById("previewImg").src = e.target.result;
      document.getElementById("preview").classList.add("active");
    };

    reader.readAsDataURL(file);
  }

  function removeImage() {
    selectedImage = null;
    document.getElementById("imageInput").value = "";
    document.getElementById("preview").classList.remove("active");
    document.getElementById("previewImg").src = "";
  }

  /* MESSAGE UI */

  function addUserMessage(text, image) {

    welcome?.remove();

    const message = document.createElement("div");
    message.className = "message user";

    let html = `<div class="message-label">You</div>`;

    if (image) {
      const url = URL.createObjectURL(image);

      html += `
        <img class="message-image"
             src="${url}"
             alt="Uploaded image">
      `;
    }

    if (text) {
      html += `<div class="bubble">${escapeHTML(text)}</div>`;
    }

    message.innerHTML = html;

    conversation.appendChild(message);

    scrollBottom();
  }

  function addAIMessage() {

    const message = document.createElement("div");
    message.className = "message ai";

    message.innerHTML = `
      <div class="message-label">AS AI</div>
      <div class="bubble"></div>
    `;

    conversation.appendChild(message);

    scrollBottom();

    return message.querySelector(".bubble");
  }

  function scrollBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  /* SEND */

  async function sendMessage() {

    if (busy) return;

    const text = promptBox.value.trim();

    if (!text && !selectedImage) return;

    busy = true;
    sendBtn.disabled = true;

    const image = selectedImage;

    addUserMessage(text, image);

    promptBox.value = "";
    promptBox.style.height = "55px";

    removeImage();

    const aiBubble = addAIMessage();

    try {

      /*
       * IMPORTANT:
       * Change this URL if your server uses another endpoint.
       */

      const formData = new FormData();

      formData.append("message", text);

      if (image) {
        formData.append("image", image);
      }

      const response = await fetch("/api/chat", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        throw new Error("Server error " + response.status);
      }

      /*
       * Streaming support
       */

      if (response.body) {

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let fullText = "";

        while (true) {

          const { value, done } = await reader.read();

          if (done) break;

          const chunk = decoder.decode(value, {
            stream: true
          });

          fullText += chunk;

          aiBubble.textContent = fullText;

          scrollBottom();
        }

      } else {

        const data = await response.json();

        aiBubble.textContent =
          data.text ||
          data.response ||
          "No response.";

      }

    } catch (error) {

      console.error(error);

      aiBubble.textContent =
        "Sorry, I couldn't connect to AS AI right now.";

    } finally {

      busy = false;
      sendBtn.disabled = false;

      promptBox.focus();
      scrollBottom();
    }
  }

  /* ABOUT */

  function showAbout() {

    const bubble = addAIMessage();

    bubble.textContent =
      "AS AI\n\nCreated by Ali Sultan & Ali Arandis.\n\nA modern AI assistant for chat, coding and image analysis.";

    scrollBottom();
  }

</script>

</body>
</html>
